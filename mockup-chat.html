    </footer>

    <!-- ── Gruppeninfo: Mitgliederliste + Gruppe löschen ── -->
    <div class="overlay" id="gruppeninfo-overlay">
      <div class="overlay-karte">
        <div class="overlay-kopf">
          <span class="overlay-titel">Gruppeninfo</span>
          <button class="overlay-schliessen" id="gruppeninfo-schliessen" aria-label="Schließen">&times;</button>
        </div>
        <!-- Gruppenbild (optional): fällt ohne Auswahl auf die
             Mitglieder-Initialen zurück, siehe gruppenAvatarAnwenden (JS). -->
        <div class="gruppe-foto-zeile">
          <div class="profil-foto-wrapper">
            <div class="avatar avatar--profil" id="gruppeninfo-avatar">–</div>
            <button class="profil-foto-upload-btn" id="gruppeninfo-foto-upload-btn" type="button" title="Gruppenbild ändern" aria-label="Gruppenbild ändern">✎</button>
            <input type="file" accept="image/*" id="gruppeninfo-foto-input" hidden>
          </div>
        </div>
        <div class="kontakt-auswahl-liste" id="gruppeninfo-mitglieder-liste"></div>
        <button class="btn-sekundaer btn--gefahr" id="gruppe-loeschen-btn">Gruppe löschen</button>
      </div>
    </div>

    <!-- ── Bestätigungs-Dialog: für Mitglied entfernen / Gruppe löschen ── -->
    <div class="overlay overlay--zentriert" id="bestaetigung-overlay">
      <div class="bestaetigung-karte">
        <p class="bestaetigung-text" id="bestaetigung-text">Wirklich?</p>
        <div class="bestaetigung-aktionen">
          <button class="btn-tertiaer" id="bestaetigung-abbrechen-btn">Abbrechen</button>
          <button class="btn-primaer btn--gefahr" id="bestaetigung-bestaetigen-btn">Entfernen</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

// ══════════════════════════════════════════════════════════════════
//  WÖRTLICH AUS chat.html – von build-mockup.js eingesetzt
// ══════════════════════════════════════════════════════════════════
const SITURA_SCHRIFTSCHNITTE = [
    'Situra-Thin',
    'Situra-Light',
    'Situra-Regular',
    'Situra-Medium',
    'Situra-SemiBold',
    'Situra-Bold',
    'Situra-Black'
  ];
const SPACING_WEIT = 0.30;
const SPACING_ENG_PRO_SCHNITT = {
    'Situra-Thin':     -0.100,
    'Situra-Light':    -0.090,
    'Situra-Regular':  -0.065,
    'Situra-Medium':   -0.055,
    'Situra-SemiBold': -0.045,
    'Situra-Bold':     -0.035,
    'Situra-Black':    -0.025
  };
const SPACING_ENG_STANDARD = -0.025;
  function umrechnen(wert, vonMin, vonMax, zuMin, zuMax) {
    return zuMin + (wert - vonMin) / (vonMax - vonMin) * (zuMax - zuMin);
  }
  function intensitaetZuSchriftschnitt(intensitaet) {
    const stufenBreite = 800 / SITURA_SCHRIFTSCHNITTE.length; // (900−100) / 7
    const index = Math.min(
      SITURA_SCHRIFTSCHNITTE.length - 1,
      Math.max(0, Math.floor((intensitaet - 100) / stufenBreite))
    );
    return SITURA_SCHRIFTSCHNITTE[index];
  }
  function sensorZuSchriftAchse(rohwerte) {

    // Intensität → statischer Schriftschnitt (echtes Umschalten
    // zwischen 7 Dateien statt fließender Gewichts-Verschiebung)
    const schriftschnitt = intensitaetZuSchriftschnitt(rohwerte.intensitaet);

    // BEHELF – Tempo → letter-spacing (0.14 em … −0.02 em)
    // RICHTUNG: schnelles Tippen (tempo hoch) = enge Laufweite, langsames
    // Tippen (tempo niedrig) = weite Laufweite – Hast lässt den Text
    // zusammenrücken, Zögern zieht ihn auseinander. Bei sehr schnellem
    // Tippen (tempo nahe 900) wird die Laufweite leicht NEGATIV, sodass
    // Buchstaben sichtbar ineinanderlaufen – bewusst nur dezent negativ,
    // damit es bei den fetteren Situra-Schnitten noch lesbar bleibt.
    //
    // Obere Grenze von 0,12 auf 0,14 em angehoben: Zusammen mit der
    // Neukalibrierung des Tempo-Bandes (siehe CPS_MINIMUM/CPS_MAXIMUM)
    // trennt das ein gezögertes Wort deutlicher von einem schnell
    // getippten. 0,14 em ist bei 26–30 px Schriftgröße rund 4 px
    // Zusatzabstand – klar erkennbar, ohne das Wort auseinanderfallen
    // zu lassen. ← nachjustieren, wenn der Unterschied zu stark wirkt.
    // ══════════════════════════════════════════════════════════════
    //  TEMPO → LAUFWEITE, erweitert in beide Richtungen
    //
    //  Vorher: 0,140 em … −0,020 em. Der enge Pol war praktisch wirkungs-
    //  los (−0,02 em sind bei 30 px keine 0,6 px), der weite blieb brav.
    //
    //  WEITER POL: 0,300 em, mehr als das Doppelte. Am Bildschirm geprüft
    //  (Situra, 30 px = echte Größe von .nachricht .text): auch bei
    //  0,380 em bleibt alles gut lesbar, aber ein langes Wort wird dann so
    //  breit, dass es fast immer umbricht. 0,300 em ist deutlich gesperrt
    //  und bricht seltener.
    //
    //  ENGER POL: schnittabhängig statt pauschal – das ist der Kern
    //  dieser Änderung. Ein fester Wert kann nicht funktionieren, weil
    //  Laufweite und Strichstärke sich gegenseitig aufheben: Dieselben
    //  −0,07 em, die in Thin noch luftig wirken, machen Black zu einer
    //  Masse. Die Intensitäts-Dimension wählt den Schnitt unabhängig vom
    //  Tempo, beide Pole können also gleichzeitig auftreten.
    //
    //  Am Bildschirm ermittelt, mit langen Wörtern und den heiklen Paaren
    //  rn / cl / vv / ss (dort summiert sich die Überlappung am stärksten,
    //  und "rn" kippt als Erstes sichtbar zu "m"):
    //
    //    Schnitt     eng      Beobachtung an "Kernmodul"/"…schwierigkeiten"
    //    ─────────── ──────── ────────────────────────────────────────────
    //    Thin        −0,100   Striche kreuzen sich, Formen bleiben lesbar
    //    Light       −0,090   dicht, alle Zeichen einzeln erkennbar
    //    Regular     −0,065   berühren sich; ab −0,070 wird "rn" zu "m"
    //    Medium      −0,055   entsprechend früher
    //    SemiBold    −0,045
    //    Bold        −0,035
    //    Black       −0,025   hat kaum Spielraum: schon beim alten −0,020
    //                         verschmilzt "ss" zu einer Form
    //
    //  Black bekommt damit sogar etwas WENIGER als vorher – dort war der
    //  bisherige Wert bereits an der Grenze. Alle anderen Schnitte gewinnen
    //  deutlich, Thin das Fünffache.
    //  ← nachjustieren: Werte gelten für 30 px; bei kleinerer Schrift
    //  verschmilzt es früher, weil die Überlappung in Pixeln gleich bleibt.
    // ══════════════════════════════════════════════════════════════
    const spacing = umrechnen(
      rohwerte.tempo, 100, 900,
      SPACING_WEIT,
      SPACING_ENG_PRO_SCHNITT[schriftschnitt] != null
        ? SPACING_ENG_PRO_SCHNITT[schriftschnitt]
        : SPACING_ENG_STANDARD
    );

    // Tempo → Dauer der Einblend-Animation neuer Nachrichten
    // Niedrig (100) = langsam/bedächtig (0.5 s) · hoch (900) = schnell/knapp (0.06 s)
    // Teilt KEINEN Parameter mehr mit Stabilität.
    const einblendDauer = umrechnen(rohwerte.tempo, 100, 900, 0.5, 0.06);

    // BEHELF – Stabilität → Translations-Amplitude pro Buchstabe
    // Dezenterer Bereich: spürbar aber nie unleserlich/grotesk
    const WOBBLE_AMPLITUDE_MAX = 2.0; // ← nachjustieren (px): Maximum bei Stabilität 100
    const WOBBLE_TOTZONE_PX    = 0.4; // ← nachjustieren (px): darunter = kein Zittern
    const wobbleRoh = umrechnen(rohwerte.stabilitaet, 100, 900, WOBBLE_AMPLITUDE_MAX, 0);
    const wobble    = wobbleRoh < WOBBLE_TOTZONE_PX ? 0 : wobbleRoh;

    // BEHELF – Stabilität → Rotations-Amplitude pro Buchstabe (Grad)
    const WOBBLE_ROT_MAX     = 2.5; // ← nachjustieren (Grad): Maximum
    const WOBBLE_ROT_TOTZONE = 0.5; // ← nachjustieren (Grad): Totzone
    const wobbleRotRoh = umrechnen(rohwerte.stabilitaet, 100, 900, WOBBLE_ROT_MAX, 0);
    const wobbleRot    = wobbleRotRoh < WOBBLE_ROT_TOTZONE ? 0 : wobbleRotRoh;

    // ══ TEST/DEMO – Temperatur → Schriftgröße ══════════════════════
    // Analogie Wärmeausdehnung: kühl = kleiner, warm = größer.
    // Die Hauttemperatur wird NICHT real gemessen – der Wert kommt
    // vorerst vom Testregler, die Anbindung bleibt Ausblick.
    //
    // Bewusst ein FAKTOR und keine Pixelgröße: Angewendet wird er als
    // em-Wert (siehe stilAnwenden), also relativ zur Größe, die das
    // umgebende Element ohnehin vorgibt. Dadurch bleibt die
    // Größen-Hierarchie des Interface unangetastet – eine Nachricht
    // skaliert von ihren 30px aus, ein Moment-Text von seinen 24px,
    // und beide bleiben in ihrem jeweiligen Verhältnis.
    //
    // ±12 % ist eng genug, dass sich nichts überholt: Eine Nachricht
    // misst im Minimum noch 26,4px und liegt damit weiterhin über dem
    // Kontaktnamen (22px, skaliert gar nicht mit – stilAnwenden wirkt
    // nur auf Wort-Spans in Nachrichten, Gruppenraum und Momenten).
    // ← nachjustieren: größer als ~0,15 lässt Zeilen sichtbar springen.
    const GROESSE_SPANNE = 0.12;
    const temperaturWert = (rohwerte.tonalitaet != null) ? rohwerte.tonalitaet : 500;
    const groesse = umrechnen(temperaturWert, 100, 900, 1 - GROESSE_SPANNE, 1 + GROESSE_SPANNE);

    // ══ TEST/DEMO – Schlafqualität → Unschärfe (filter: blur) ══════
    // Simulierte Eingabe, kein Live-Sensor. Niedrig/"müde" (100) = unscharf,
    // hoch/"wach" (900) = scharf. Siehe Matrix: Unschärfe-Dimension.
    // Falls für die aktuelle Sitzung keine Schlafqualität gemessen/
    // eingegeben wurde (Wert fehlt/ist null/undefined), greift als
    // Standardwert "wach" (900) statt Fehler oder leerer Anzeige – ergibt
    // hier scharfen (unverschwommenen) Text, wie bei echtem "wach".
    const BLUR_MAX = 1.4; // ← nachjustieren (px): Maximum bei Schlafqualität 100 – bewusst dezent, Text bleibt lesbar
    const schlafqualitaetWert = (rohwerte.schlafqualitaet != null) ? rohwerte.schlafqualitaet : 900;
    const blur = umrechnen(schlafqualitaetWert, 100, 900, BLUR_MAX, 0);

    // ══ TEST/DEMO – Atemfrequenz → Transparenz (opacity) ═══════════
    // Simulierte Eingabe, kein Live-Sensor. Niedrig/"aufgewühlt" (100) = blass,
    // hoch/"gefasst" (900) = deckend. Siehe Matrix: Transparenz-Dimension.
    const TRANSPARENZ_MIN = 0.35; // ← nachjustieren: Minimum bei Atemfrequenz 100
    const transparenz = umrechnen(rohwerte.atemfrequenz, 100, 900, TRANSPARENZ_MIN, 1);

    return { schriftschnitt, spacing, einblendDauer, wobble, wobbleRot, blur, transparenz, groesse };
  }
  const zitterStyleEl = document.createElement('style');
  document.head.appendChild(zitterStyleEl);

  function erstelleZitterAnimation(amplitude, rotAmplitude) {
    // Eindeutiger Name, damit Buchstaben sich nicht gegenseitig überschreiben
    const name = 'zb' + Math.random().toString(36).slice(2, 9);

    // Unregelmäßige Zeitstempel (nicht gleichmäßig verteilt) für nervöses Timing
    const schritte = [0];
    for (let i = 0; i < 5; i++) {
      schritte.push(Math.round(10 + Math.random() * 78));
    }
    schritte.push(100);
    schritte.sort((a, b) => a - b);

    let css = `@keyframes ${name}{`;
    schritte.forEach(pct => {
      const x   = ((Math.random() * 2 - 1) * amplitude   ).toFixed(2);
      const y   = ((Math.random() * 2 - 1) * amplitude * 0.8).toFixed(2);
      const r   = ((Math.random() * 2 - 1) * rotAmplitude).toFixed(2);
      // Leichte Zufalls-Skalierung: vermittelt Forminstabilität
      const sx  = (1 + (Math.random() * 2 - 1) * 0.04).toFixed(3);
      const sy  = (1 + (Math.random() * 2 - 1) * 0.04).toFixed(3);
      css += `${pct}%{transform:translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy});}`;
    });
    css += '}';

    zitterStyleEl.sheet.insertRule(css, zitterStyleEl.sheet.cssRules.length);
    return name;
  }
  function buchstabenAnimieren(element, achsen) {
    const text = element.textContent;
    element.textContent = ''; // Inhalt leeren, dann neu aufbauen

    for (const buchstabe of text) {
      const span = document.createElement('span');
      span.textContent = buchstabe;

      if (buchstabe === ' ' || buchstabe === '\n') {
        // Leer-/Trennzeichen: kein Transform, kein inline-block nötig
        element.appendChild(span);
        continue;
      }

      span.classList.add('zitter-buchstabe'); // display: inline-block per CSS

      // Einzigartiger Keyframe + zufällige Dauer und Startversatz pro Buchstabe
      // → unregelmäßiges, asynchrones Zittern statt synchronem Takt
      const animName  = erstelleZitterAnimation(achsen.wobble, achsen.wobbleRot);
      const dauer     = (0.25 + Math.random() * 0.9).toFixed(2); // 0.25–1.15 s
      const verzoeger = (-Math.random() * 1.5).toFixed(2);        // negativer Delay = mid-cycle start

      span.style.animationName           = animName;
      span.style.animationDuration       = `${dauer}s`;
      span.style.animationTimingFunction = 'ease-in-out';
      span.style.animationIterationCount = 'infinite';
      span.style.animationDelay          = `${verzoeger}s`;

      element.appendChild(span);
    }
  }
  function stilAnwenden(element, achsen) {
    // Intensität → statischer Schriftschnitt (7 feste Situra-Dateien,
    // echtes Umschalten statt Variable-Font-Achse). Fällt auf Inter
    // zurück, falls eine Datei nicht lädt.
    element.style.fontFamily = `'${achsen.schriftschnitt}', 'Inter', sans-serif`;

    // BEHELF – Tempo → letter-spacing
    // Tempo steuert NICHT das Zittern – nur Laufweite und Einblend-Speed.
    element.style.letterSpacing = `${achsen.spacing.toFixed(3)}em`;

    // ══ TEST/DEMO – Temperatur → Schriftgröße ═════════════════════
    // In em, nicht in px: Der Faktor wirkt damit relativ zu der Größe,
    // die das umgebende Element vorgibt (Nachricht 30px, Moment 24px,
    // Gruppenraum eigene Container-Einheit). Die Hierarchie bleibt so
    // erhalten, ohne dass diese Funktion sie kennen müsste.
    // Ältere Snapshots ohne "groesse" (vor dieser Fassung eingefroren)
    // fallen auf 1 zurück und bleiben damit unverändert.
    element.style.fontSize = (achsen.groesse != null ? achsen.groesse : 1).toFixed(3) + 'em';

    // Die Farbe bleibt von der Temperatur unberührt – Text ist schwarz
    // oder weiß je nach Modus (element.style.color unangetastet, siehe
    // stilNeutralAnwenden). Die Farb-Zuordnung kühl→warm ist rein
    // illustrativ im Onboarding zu sehen.

    // BEHELF – Stabilität → per-Buchstaben-Zittern mit Zufallsanimation
    // Teilt KEINEN Parameter mit Tempo.
    if (achsen.wobble > 0) {
      buchstabenAnimieren(element, achsen);
    }
    // Kein transform/animation auf dem Container-Element selbst

    // ══ TEST/DEMO – Schlafqualität → Unschärfe (filter: blur) ══════
    element.style.filter = achsen.blur > 0.05 ? `blur(${achsen.blur.toFixed(2)}px)` : 'none';

    // ══ TEST/DEMO – Atemfrequenz → Transparenz (opacity) ═══════════
    element.style.opacity = achsen.transparenz.toFixed(2);

    // ── Pause vor diesem Wort → zusätzlicher Wortabstand ────────────
    // word-spacing griffe hier nicht zuverlässig: jedes Wort ist ein
    // eigenes Element mit eigenem Inline-Style, das Leerzeichen davor
    // liegt außerhalb dieses Elements als eigener Textknoten (siehe
    // nachrichtHinzufuegen/momentTextRendern). margin-left auf dem
    // FOLGENDEN Wort wirkt dagegen zuverlässig auf Inline-Elementen.
    // achsen.pausenZuschlag ist bereits 0, wenn keine/zu kurze Pause
    // vorlag oder das Wort leblos ist (siehe pausenZuschlagVerbrauchen).
    element.style.marginLeft = `${(achsen.pausenZuschlag || 0).toFixed(3)}em`;
  }
  function stilNeutralAnwenden(element) {
    // Neutraler Zustand entspricht dem mittleren Schnitt der 7-stufigen Skala
    element.style.fontFamily            = "'Situra-Regular', 'Inter', sans-serif";
    element.style.letterSpacing         = '0em';
    element.style.color                 = '';
    element.style.transform             = 'none';
    element.style.animation             = 'none';
    element.style.filter                = 'none';
    element.style.opacity               = '1';
    // Zurück auf die Größe des umgebenden Elements – neutral heißt
    // hier: gar keine eigene Größe setzen, nicht "Faktor 1".
    element.style.fontSize              = '';
    // Kein Pausenzuschlag im leblosen Zustand (siehe pausenZuschlagVerbrauchen)
    element.style.marginLeft            = '0em';
  }
  function blasenPfad(breite, hoeheGesamt, radius, spitze, versatz, rechts) {
    const koerperHoehe = hoeheGesamt - spitze;
    if (!rechts) {
      // Spitze unten LINKS: Uhrzeigersinn ab der linken Kante der Ecke
      // oben-links, drei Ecken echt gerundet (Q-Kurve, Kontrollpunkt =
      // die scharfe Eckposition selbst), die vierte (unten-links, wo
      // die Spitze sitzt) BEWUSST ungerundet – die Spitze wächst als
      // einfache Verlängerung der linken Kante nach unten heraus, kein
      // eigener Rundungspunkt lässt sie organisch statt angesetzt wirken.
      return 'M0,' + radius + ' Q0,0 ' + radius + ',0' +
        ' L' + (breite - radius) + ',0 Q' + breite + ',0 ' + breite + ',' + radius +
        ' L' + breite + ',' + (koerperHoehe - radius) + ' Q' + breite + ',' + koerperHoehe + ' ' + (breite - radius) + ',' + koerperHoehe +
        ' L' + versatz + ',' + koerperHoehe + ' L0,' + hoeheGesamt + ' Z';
    }
    // Spitze unten RECHTS ("Du") – horizontal gespiegelte Punktfolge.
    return 'M' + breite + ',' + radius + ' Q' + breite + ',0 ' + (breite - radius) + ',0' +
      ' L' + radius + ',0 Q0,0 0,' + radius +
      ' L0,' + (koerperHoehe - radius) + ' Q0,' + koerperHoehe + ' ' + radius + ',' + koerperHoehe +
      ' L' + (breite - versatz) + ',' + koerperHoehe + ' L' + breite + ',' + hoeheGesamt + ' Z';
  }
  function blasenKonturAktualisieren(el) {
    const woerter = el.querySelectorAll('.wort');
    // VOR jeder Messung zurücksetzen – sonst entsteht ein sich selbst
    // verstärkender Rückkopplungs-Kreis: .raum-nachricht/.text haben
    // selbst keine feste Breite (shrink-to-fit, siehe CSS), ihre
    // gemessene Breite hängt also direkt von der AKTUELLEN max-width
    // jedes .wort ab – die aber genau die Zahl ist, die diese Funktion
    // gleich neu berechnet. Bliebe der alte (ggf. bereits zu kleine)
    // Wert beim Messen stehen, könnte ein neu berechneter Wert nie
    // wieder GRÖSSER werden als vorher, selbst wenn (z. B. nach einer
    // font-size-Transition beim Schrumpfen einer Gruppen-Zone) eigentlich
    // wieder mehr Platz da wäre – über mehrere ResizeObserver-Ticks
    // hinweg "rastet" die Blase dann immer enger ein, bis Wörter mitten
    // im Wort umbrechen, obwohl reichlich Platz vorhanden wäre (genau
    // der ursprünglich gemeldete Fehler). "none" statt der Prozent-
    // Basisregel entkoppelt die Messung: die Blase kann jetzt nur noch
    // durch IHRE EIGENE max-width (fest gegen ein stabiles Elternelement,
    // siehe .raum-eintrag/.nachricht) begrenzt werden, nicht mehr im
    // Kreis durch ihre eigenen Wörter.
    woerter.forEach(function (wort) { wort.style.maxWidth = 'none'; });

    // KORREKTUR ("Hallo" bricht mitten im Wort um, obwohl rechnerisch
    // reichlich Platz da wäre") – offsetWidth/offsetHeight liefern per
    // Spezifikation GERUNDETE Ganzzahl-Pixel, nicht die tatsächliche
    // (subpixelgenaue) Breite. Bei Buchstabenabstand (letter-spacing,
    // siehe stilAnwenden, JS) braucht ein Wort oft exakt einen
    // gebrochenen Pixelwert (z. B. 77.25px) – offsetWidth rundete diesen
    // Wert bislang auf 77px ab, wodurch der berechnete max-width-Wert
    // GENAU DAS fehlende Viertel-Pixel zu knapp war und das Wort exakt
    // an dieser Kante umbrach. getBoundingClientRect() liefert dieselbe
    // Breite subpixelgenau (als float) – exakt genug, um diesen
    // Rundungsfehler zu vermeiden.
    const eigeneBox = el.getBoundingClientRect();
    const breite = eigeneBox.width;
    const hoeheKoerper = eigeneBox.height;
    if (!breite || !hoeheKoerper) return; // noch nicht gerendert (z. B. unsichtbare Zone)

    const cs = getComputedStyle(el);
    const radius  = parseFloat(cs.getPropertyValue('--blase-radius'))  || 0;
    const spitze  = parseFloat(cs.getPropertyValue('--blase-spitze'))  || 0;
    const versatz = parseFloat(cs.getPropertyValue('--blase-versatz')) || 0;
    const rechts = el.classList.contains('raum-nachricht--ich') || !!el.closest('.nachricht-ich');


    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    // +0.5px Sicherheitsspanne: rundet den ohnehin schon subpixelgenauen
    // Wert bewusst leicht AUFwärts statt abwärts – fängt verbleibende
    // Subpixel-Rundungsunterschiede zwischen dieser Messung und dem
    // eigentlichen Zeilenumbruch-Layout des Browsers ab (verschiedene
    // interne Rundungsschritte), ohne die Blase sichtbar zu vergrößern.
    const inhaltsBreite = Math.max(0, breite - padX) + 0.5;
    woerter.forEach(function (wort) {
      wort.style.maxWidth = inhaltsBreite + 'px';
    });

    // ══════════════════════════════════════════════════════════════
    //  ERNEUT MESSEN – nach dem Setzen der Wort-Breiten
    //
    //  Die Messung ganz oben passiert bei maxWidth:none, also im
    //  UNBESCHRÄNKTEN Layout. Erst die Zeile darüber legt die
    //  tatsächliche Wortbreite fest, wodurch der Text neu umbricht und
    //  die Blase in der Regel höher wird. Die erste Messung taugt
    //  deshalb nur zur Berechnung von inhaltsBreite – für die Kontur
    //  wäre sie zu klein.
    //
    //  Früher fiel das nicht auf: Die Kontur lag in Pseudoelementen,
    //  die per CSS (left/right/top/bottom) automatisch die ECHTE
    //  Elementgröße hatten. Das SVG bekommt seine Maße dagegen aus
    //  dieser Funktion – misst sie zu früh, bleibt die Blase zu klein
    //  und der Text steht oben heraus.
    // ══════════════════════════════════════════════════════════════
    const endBox    = el.getBoundingClientRect();
    const breiteEnd = endBox.width;
    const hoeheEnd  = endBox.height;
    if (!breiteEnd || !hoeheEnd) return;
    // ══════════════════════════════════════════════════════════════
    //  KONTUR ALS ECHTER STRICH (SVG) – ersetzt die frühere Lösung aus
    //  zwei übereinanderliegenden clip-path-Ebenen.
    //
    //  Warum der Wechsel: Die alte Fassung erzeugte die sichtbare Linie
    //  als Zwischenraum zweier Flächen – außen die Konturfarbe, innen
    //  1px kleiner die Hintergrundfarbe. Rechnet man die Unterkante des
    //  Blasenkörpers nach, hoben sich dort die "-2" in der Höhe und die
    //  "-1" in der Spitze gegen den 1px-Versatz der inneren Ebene exakt
    //  auf: Abstand 0 statt 1px. Oben, links und rechts stimmte es –
    //  nur unten fehlte die Linie ganz. Genau das war als "unten dünner"
    //  sichtbar.
    //
    //  Ein Strich hat dieses Problem prinzipiell nicht: Seine Breite
    //  wird senkrecht zur Kurve gemessen, an jeder Stelle gleich – auch
    //  an der schrägen Flanke der Spitze, wo ein Koordinaten-Versatz
    //  systematisch zu dünn ausfällt (dort wirkt er nicht senkrecht,
    //  sondern nur waagerecht/senkrecht zur Achse).
    //
    //  Der Pfad wird um 0,5px eingerückt gezeichnet und um denselben
    //  Betrag verschoben. Da der Strich mittig auf der Kurve liegt,
    //  bedeckt er dadurch exakt das äußerste Pixel – die Blase behält
    //  ihre bisherigen Außenmaße.
    // ══════════════════════════════════════════════════════════════
    const hoeheGesamt = hoeheEnd + spitze;
    const pfad = blasenPfad(
      breiteEnd - 1, hoeheGesamt - 1, radius - 0.5, spitze - 0.5, versatz - 0.5, rechts
    );

    let svg = el.querySelector(':scope > .blase-kontur');
    if (!svg) {
      const NS = 'http://www.w3.org/2000/svg';
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'blase-kontur');
      svg.setAttribute('aria-hidden', 'true');   // reine Dekoration
      svg.appendChild(document.createElementNS(NS, 'path'));
      // Als ERSTES Kind: liegt hinter dem Text (z-index im CSS), und
      // position:absolute hält es aus dem Textfluss heraus.
      el.insertBefore(svg, el.firstChild);
    }

    svg.setAttribute('viewBox', '0 0 ' + breiteEnd + ' ' + hoeheGesamt);
    svg.setAttribute('width', breiteEnd);
    svg.setAttribute('height', hoeheGesamt);

    const pfadEl = svg.firstChild;
    pfadEl.setAttribute('d', pfad);
    pfadEl.setAttribute('transform', 'translate(0.5,0.5)');
  }
const blasenKonturBeobachter = new ResizeObserver(function (entries) {
    entries.forEach(function (entry) { blasenKonturAktualisieren(entry.target); });
  });
  function blasenSchriftenLaden(el) {
    if (!(window.document && document.fonts && document.fonts.load)) return Promise.resolve();
    const anfragen = [];
    el.querySelectorAll('.wort').forEach(function (wort) {
      const cs = getComputedStyle(wort);
      const angabe = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      anfragen.push(document.fonts.load(angabe, wort.textContent).catch(function () {}));
    });
    return Promise.all(anfragen);
  }
  function blasenKonturEinrichten(el) {
    blasenKonturAktualisieren(el);
    blasenKonturBeobachter.observe(el);
    blasenSchriftenLaden(el).then(function () { blasenKonturAktualisieren(el); });
  }
  function nachrichtElementErstellen(eintrag) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('nachricht', eintrag.vonMir ? 'nachricht-ich' : 'nachricht-andere');

    // Tempo steuert die Dauer der Einblend-Animation eigener Nachrichten
    if (eintrag.einblendDauer != null) {
      wrapper.style.setProperty('--einblenden-dauer', `${eintrag.einblendDauer.toFixed(2)}s`);
    }

    // Kein Absendername im Einzelchat: Zwischen genau zwei Personen ist
    // ohnehin klar, wer schreibt – die Seite der Blase sagt es bereits.
    // Im Gruppenraum bleibt die Zuordnung erhalten, der läuft über einen
    // eigenen Renderpfad (.raum-* / raumNachrichtHinzufuegen) und ist
    // von dieser Funktion nicht betroffen.

    const textEl = document.createElement('p');
    textEl.classList.add('text');

    if (eintrag.wortSnapshots) {
      // ═══════════════════════════════════════════════════════════
      // WORT-EBENE: Jedes Wort wird als eigenes <span class="wort">
      // dargestellt und bekommt SEINEN eigenen eingefrorenen Zustand
      // angewendet (statt eines einzigen Zustands für die ganze
      // Nachricht). Zwischen den Wörtern steht ein normales
      // Leerzeichen (Textknoten), damit der Zeilenumbruch dort
      // weiterhin normal funktioniert.
      // ═══════════════════════════════════════════════════════════
      const woerter = eintrag.text.split(/\s+/).filter(w => w.length > 0);

      woerter.forEach((wort, i) => {
        const snapshot = eintrag.wortSnapshots[i];

        const wortSpan = document.createElement('span');
        wortSpan.classList.add('wort');
        wortSpan.textContent = wort;

        // ★★★ HIER wird der für dieses Wort eingefrorene Zustand ★★★
        // ★★★ angewendet (oder die neutrale "leblos"-Darstellung). ★★★
        if (snapshot && !snapshot.leblos) {
          stilAnwenden(wortSpan, snapshot.achsen);
        } else {
          stilNeutralAnwenden(wortSpan);
        }

        textEl.appendChild(wortSpan);
        if (i < woerter.length - 1) {
          textEl.appendChild(document.createTextNode(' '));
        }
      });
    } else {
      textEl.textContent = eintrag.text;
    }

    wrapper.appendChild(textEl);

    // Status-Indikator: Emotion-Zustand beim Absenden, eingefroren.
    //
    // Gilt für BEIDE Richtungen. Vorher stand hier "if (eintrag.vonMir)" –
    // empfangene Nachrichten bekamen also nie ein "e", obwohl die
    // Information vorliegt: Der leblos-Marker wird pro Wort mit
    // übertragen (siehe Abschnitt VERBINDUNG, woerterPruefen im Server).
    // Sie wurde beim Empfänger nur nie dargestellt.
    //
    // Das Kennzeichen sagt aus, wie die Nachricht GESENDET wurde – es
    // gehört damit genauso zu einer empfangenen wie zu einer eigenen.
    if (eintrag.wortSnapshots) {
      const statusEl = document.createElement('span');
      statusEl.classList.add('nachricht-status');
      // "e" sichtbar, wenn mindestens EIN Wort emotional eingefroren wurde;
      // leer = alle Wörter leblos/neutral (Abwesenheit ist das Signal)
      const hatEmotionalesWort = eintrag.wortSnapshots.some(s => !s.leblos);
      statusEl.textContent = hatEmotionalesWort ? 'e' : '';
      wrapper.appendChild(statusEl);
    }

    return wrapper;
  }

// ══════════════════════════════════════════════════════════════════
//  INHALT DES MOCKUPS – aus scripts/mockup-inhalt.js
// ══════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
//  INHALT DES MOCKUPS
//
//  Wird von build-mockup.js in mockup-chat.html eingesetzt. Hier steht
//  NUR, welche Rohwerte gezeigt werden – wie daraus Typografie wird,
//  entscheidet ausschließlich sensorZuSchriftAchse aus chat.html.
//
//  Die Zahlen sind Rohwerte der Sensor-Skala (100–900), also genau das,
//  was in der App aus Band und Tippverhalten entsteht. Kein einziger
//  typografischer Wert ist hier von Hand gesetzt.
// ══════════════════════════════════════════════════════════════════

// Neutrale Grundlage – einzelne Wörter weichen davon ab.
function roh(ueberschreibung) {
  return Object.assign({
    intensitaet: 500, tempo: 500, stabilitaet: 900,
    tonalitaet: 500, schlafqualitaet: 900, atemfrequenz: 900
  }, ueberschreibung || {});
}

// ── Eingehende Nachricht ──────────────────────────────────────────
// "hey, alles okay bei dir?" – ruhig gesetzt. Intensität um 500 trifft
// Situra-Medium (mittlere Strichstärke), Tempo um 450 eine normale
// Laufweite. Stabilität und Schlaf auf dem oberen Anschlag: kein
// Zittern, keine Unschärfe. Die kleinen Abweichungen von Wort zu Wort
// sind Absicht – gleichmäßige Werte über alle Wörter kommen beim
// echten Tippen nicht vor.
const EINGEHEND = {
  text: 'hey, alles okay bei dir?',
  vonMir: false,
  rohwerte: [
    roh({ intensitaet: 520, tempo: 470 }),   // hey,
    roh({ intensitaet: 495, tempo: 440 }),   // alles
    roh({ intensitaet: 510, tempo: 455 }),   // okay
    roh({ intensitaet: 480, tempo: 430 }),   // bei
    roh({ intensitaet: 505, tempo: 460 })    // dir?
  ]
};

// ── Eigene Antwort ────────────────────────────────────────────────
// "ja, mir geht's gut" – der Wortlaut sagt das eine, der Zustand das
// andere. Intensität über 800 trifft Situra-Black (schwerster Schnitt),
// hohes Tempo zieht die Laufweite zusammen, niedrige Stabilität lässt
// die Buchstaben zittern, abgesenkter Schlafwert macht sie weich.
//
// ENTSCHEIDEND: "gut" ist deutlich gezögert – Tempo 150 statt 880.
// Daraus wird eine weite Laufweite, während die drei Wörter davor eng
// stehen. Genau so entsteht es beim echten Wort-für-Wort-Einfrieren:
// Wer vor einem Wort zögert, dehnt es. Dass ausgerechnet die
// Bestätigung gedehnt wird, ist der Widerspruch, um den es geht.
const ANTWORT = {
  text: "ja, mir geht's gut",
  vonMir: true,
  // Zur Unschärfe: Ein erster Versuch stand bei Schlafwerten um 340
  // (rund 0,96 px). Am Bildschirm geprüft war "geht's" damit nicht mehr
  // lesbar – die Unschärfe kommt auf die enge Laufweite von Black
  // obendrauf, und beides zusammen lässt die Buchstaben verschmelzen.
  // Werte um 580 ergeben rund 0,55 px: sichtbar weich, aber jeder
  // Buchstabe bleibt einzeln erkennbar. Das entspricht auch eher dem
  // "leicht weich" der Vorgabe.
  rohwerte: [
    roh({ intensitaet: 800, tempo: 870, stabilitaet: 260, schlafqualitaet: 620 }), // ja,
    roh({ intensitaet: 830, tempo: 890, stabilitaet: 230, schlafqualitaet: 600 }), // mir
    roh({ intensitaet: 850, tempo: 880, stabilitaet: 200, schlafqualitaet: 570 }), // geht's
    roh({ intensitaet: 820, tempo: 150, stabilitaet: 180, schlafqualitaet: 550 })  // gut  ← gezögert
  ]
};

// Baut einen Verlaufs-Eintrag im Format, das nachrichtElementErstellen
// erwartet: wortSnapshots mit fertig berechneten Achsen je Wort.
function eintragBauen(quelle) {
  return {
    text: quelle.text,
    vonMir: quelle.vonMir,
    einblendDauer: sensorZuSchriftAchse(quelle.rohwerte[0]).einblendDauer,
    wortSnapshots: quelle.rohwerte.map(function (r) {
      return { achsen: sensorZuSchriftAchse(r), leblos: false };
    })
  };
}

// ── Kopfzeile ─────────────────────────────────────────────────────
document.getElementById('chat-partner-name').textContent = 'Marie';
document.getElementById('chat-partner-avatar').textContent = 'M';

// Band verbunden zeigen – sonst sähe es aus, als käme die Darstellung
// aus Testreglern statt aus einer echten Messung.
const bandBtn = document.getElementById('band-btn');
bandBtn.textContent = 'Verbunden';
bandBtn.classList.add('verbunden');
const bpmLive = document.getElementById('band-bpm-live');
bpmLive.hidden = false;
bpmLive.textContent = '92 bpm';

// ── Sensor-Anzeige ────────────────────────────────────────────────
// Aufgeklappt, damit im Foto erkennbar ist, woher die Darstellung
// kommt. Die Werte entsprechen dem Zustand der eigenen Antwort – der
// Screen zeigt also nicht irgendwelche Zahlen, sondern die, aus denen
// die Blase darunter entstanden ist.
const drawer = document.getElementById('info-drawer');
if (drawer) drawer.classList.add('offen');
const griff = document.getElementById('info-drawer-griff');
if (griff) griff.setAttribute('aria-expanded', 'true');

// Mittelwert der Antwort-Rohwerte – das ist der Zustand, in dem sie
// geschrieben wurde.
function mittel(feld) {
  return Math.round(ANTWORT.rohwerte.reduce(function (s, r) { return s + r[feld]; }, 0)
                    / ANTWORT.rohwerte.length);
}
const ANZEIGE = {
  intensitaet: mittel('intensitaet'),
  tempo:       mittel('tempo'),
  stabilitaet: mittel('stabilitaet'),
  schlaf:      340   // Wachheit: aus der Nacht-Auswertung, nicht aus dem Tippen
};

function setzen(id, wert) { const el = document.getElementById(id); if (el) el.textContent = wert; }
function balken(id, wert) {
  const el = document.getElementById(id);
  if (el) el.style.width = Math.max(0, Math.min(100, (wert - 100) / 8)) + '%';
}

setzen('wert-intensitaet', ANZEIGE.intensitaet);
const sliderInt = document.getElementById('slider-intensitaet');
if (sliderInt) sliderInt.value = ANZEIGE.intensitaet;
// Mit Band ist die Intensität eine Messung, kein Testwert.
const badgeInt = document.getElementById('badge-intensitaet');
if (badgeInt) badgeInt.hidden = true;
const labelInt = document.getElementById('label-intensitaet');
if (labelInt) labelInt.classList.add('dimension-label--live');

setzen('wert-tempo', ANZEIGE.tempo);              balken('balken-tempo', ANZEIGE.tempo);
setzen('wert-stabilitaet', ANZEIGE.stabilitaet);  balken('balken-stabilitaet', ANZEIGE.stabilitaet);
setzen('wert-wachheit', ANZEIGE.schlaf);          balken('balken-wachheit', ANZEIGE.schlaf);
const labelWach = document.getElementById('label-wachheit');
if (labelWach) labelWach.innerHTML = 'Wachheit';  // echte Nacht vorhanden

// Profil-Werte, falls im Markup vorhanden
setzen('profil-wert-puls', '92 bpm');
setzen('profil-wert-stabilitaet', ANZEIGE.stabilitaet);

// ── Nachrichten einsetzen ─────────────────────────────────────────
const chat = document.getElementById('chat');
chat.innerHTML = '';
[EINGEHEND, ANTWORT].forEach(function (quelle) {
  const el = nachrichtElementErstellen(eintragBauen(quelle));
  chat.appendChild(el);
  // Kontur erst NACH dem Einfügen – sie braucht echtes Layout.
  blasenKonturEinrichten(el.querySelector('.text'));
});

// Eingabefeld leer und ohne Fokus – es ist ein Standbild.
const eingabe = document.getElementById('eingabe');
if (eingabe) { eingabe.value = ''; eingabe.blur(); }

// Für eine Kontrolle von außen (Konsole), nicht fürs Foto:
window.__mockup = {
  eingehend: EINGEHEND,
  antwort: ANTWORT,
  achsenJeWort: function (quelle) {
    return quelle.rohwerte.map(function (r, i) {
      const a = sensorZuSchriftAchse(r);
      return {
        wort: quelle.text.split(/\s+/)[i],
        schnitt: a.schriftschnitt,
        laufweite: +a.spacing.toFixed(3),
        zittern: +a.wobble.toFixed(2),
        unschaerfe: +a.blur.toFixed(2)
      };
    });
  }
};

})();
</script>
</body>
</html>
