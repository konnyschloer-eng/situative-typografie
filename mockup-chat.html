<!-- ══════════════════════════════════════════════════════════════
     ERZEUGT von scripts/build-mockup.js aus chat.html.
     NICHT von Hand bearbeiten – Änderungen gehen beim nächsten Lauf

<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════════════════════════════════
       PULS-SCHRIFTSCHNITTE – 7 statische Situra-Schnitte (kein
       Variable Font). Jeder Schnitt hat einen eigenen font-family-
       Namen und wird bewusst mit font-weight:400 registriert, damit
       kein Browser versucht, zusätzlich synthetisch fett/kursiv zu
       rendern – der jeweilige Schnitt selbst trägt die Strichstärke.
       Reihenfolge dünn → fett, siehe intensitaetZuSchriftschnitt()
       weiter unten im Script.

       KORREKTUR (Browser-Kompatibilität, Safari) – .woff2 zusätzlich
       zur bisherigen .ttf erzeugt und in src ZUERST gelistet: Server
       wie GitHub Pages liefern .ttf teils ohne korrekten Font-MIME-Typ
       (application/octet-stream) aus, was Safari beim @font-face-Laden
       ablehnt. .woff2 ist praktisch immer korrekt typisiert und wird
       von jedem aktuellen Browser bevorzugt geladen (erste unterstützte
       Quelle in src gewinnt) – .ttf bleibt als Fallback für den
       (unwahrscheinlichen) Fall eines noch älteren Browsers ohne
       WOFF2-Unterstützung. Nebeneffekt: die .woff2-Dateien sind rund
       ein Drittel so groß, die Schrift steht also schneller.
       Identisch in onboarding.html und situra-slider.html.
       ══════════════════════════════════════════════════════════════ */
    @font-face {
      font-family: 'Situra-Thin';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-thin.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-thin.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Situra-Light';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-Light.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-Light.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Situra-Regular';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-Regular.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Situra-Medium';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-Medium.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-Medium.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Situra-SemiBold';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-SemiBold.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-SemiBold.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Situra-Bold';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-Bold.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-Bold.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Situra-Black';
      src: url('assets/fonts/Situra/OpenType-TT/Situra-Black.woff2') format('woff2'),
           url('assets/fonts/Situra/OpenType-TT/Situra-Black.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ══════════════════════════════════════════════════════════════
       FARBWELTEN – als CSS-Custom-Properties auf .phone-frame
       Zum Anpassen: nur die Werte hier ändern, der Rest folgt.

       NEUTRAL (Emotion AUS): kühl, sachlich, nüchtern
       DUNKEL  (Emotion AN):  invertiert, schwarz, direkt
       ══════════════════════════════════════════════════════════════ */

    .phone-frame {
      /* ── Neutral (Standardzustand, Emotion AUS) ── */
      --bg:           #ffffff;   /* Haupthintergrund */
      --bg-surface:   #eceae7;   /* Header, Footer, Flächen */
      --bg-hover:     #e8e5e1;   /* Hover auf Listenelementen */
      --border:       #d6d3cc;   /* Kräftigere Linien */
      --border-light: #e4e1da;   /* Feine Linien (Diagramm-Gitter, dezente Rahmen) */
      --text-2:       #888888;   /* Sekundärtext */
      --text-3:       #aaaaaa;   /* Labels, schwacher Text */
      --text-4:       #bbbbbb;   /* Sehr schwacher Text, Wertanzeigen */
      --accent:       #555555;   /* Slider-Thumb, Fortschrittsbalken */
      --placeholder:  #c0bdb8;   /* Eingabefeld-Platzhalter */
      --bubble-outline: rgba(0, 0, 0, 0.75);   /* Sprechblasen-Outline, heller Modus */
      --scrollbar-farbe: rgba(0, 0, 0, 0.22);  /* Scroll-Indikator, heller Modus */
      --emotion-karte-bg: rgba(0, 0, 0, 0.85); /* Karte hinter dem Emotion-Schalter, heller Modus */
      --ring-ungesehen: #000000; /* "Ungesehen"-Ring um Moment-Kreise, heller Modus – bei hellem
                                     Hintergrund verschwindet ein fest weißer Ring sonst spurlos */
      /* Emotion-Schalter AN: volle Füllung statt nur Farbwechsel der
         Schiene (siehe .schalter-visuell) – Kontrastfarbe zur Schrift
         des Modus, --schalter-fuellung-kontrast ist die Thumb-Farbe
         AUF der Füllung. In der Karte hinter dem Schalter (schwebend/
         Chat-Fußleiste, siehe --emotion-karte-bg) unten überschrieben,
         weil die Karte dort in BEIDEN Modi dunkel ist. */
      --schalter-fuellung:           #000000;
      --schalter-fuellung-kontrast:  #ffffff;
      --fokus:        #000000;   /* Tastatur-Fokusrahmen, siehe FOKUS-Abschnitt */
    }

    .phone-frame.emotion-an {
      /* ── Invertiert/Dunkel (Emotion AN) ── */
      --bg:           #000000;   /* Haupthintergrund */
      --bg-surface:   #1a1a1a;   /* Header, Footer, Flächen */
      --bg-hover:     #222222;   /* Hover auf Listenelementen */
      --border:       #383838;   /* Kräftigere Linien */
      --border-light: #2a2a2a;   /* Feine Linien (Diagramm-Gitter, dezente Rahmen) */
      --text-2:       #999999;   /* Sekundärtext */
      --text-3:       #666666;   /* Labels, schwacher Text */
      --text-4:       #505050;   /* Sehr schwacher Text, Wertanzeigen */
      --accent:       #888888;   /* Slider-Thumb, Fortschrittsbalken */
      --placeholder:  #484848;   /* Eingabefeld-Platzhalter */
      /* Stand vorher auf var(--bubble-outline) – also auf SICH SELBST.
         Eine Custom Property darf sich nicht selbst referenzieren; die
         Deklaration ist dadurch ungültig, und der einzige Nutzer
         (.avatar, border) bekam im dunklen Modus gar keine Rahmenfarbe.
         Avatar-Kreise ohne Foto waren deshalb unsichtbar – im Profil
         schwebte nur der Buchstabe. Wert analog zum hellen Modus
         gespiegelt, wie bei --scrollbar-farbe eine Zeile darunter. */
      --bubble-outline: rgba(255, 255, 255, 0.75); /* Sprechblasen-Outline, dunkler Modus */
      --scrollbar-farbe: rgba(255, 255, 255, 0.22); /* Scroll-Indikator, dunkler Modus */
      --emotion-karte-bg: rgba(255, 255, 255, 0.10); /* Karte hinter dem Emotion-Schalter, dunkler Modus */
      --ring-ungesehen: #ffffff; /* "Ungesehen"-Ring um Moment-Kreise, dunkler Modus */
      --schalter-fuellung:           #ffffff;
      --schalter-fuellung-kontrast:  #000000;
      --fokus:        #ffffff;   /* Tastatur-Fokusrahmen, siehe FOKUS-Abschnitt */
    }


    /* ══════════════════════════════════════════════════════════════
       FOKUS & ANTIPP-MARKIERUNG – schwarzweiß statt Systemblau

       Zwei verschiedene Dinge, die oft verwechselt werden:

       1. TAP-HIGHLIGHT: Die blaue Fläche, die Android/iOS beim
          Berühren über ein Element legen. Rein kosmetisch, gehört
          weder zum Fokus noch zum Klick – lässt sich folgenlos
          abschalten.

       2. FOKUS-OUTLINE: Der Rahmen, der zeigt, WO man gerade ist.
          Für Tastaturbedienung unverzichtbar. Deshalb wird er hier
          NICHT entfernt, sondern in Schwarz/Weiß neu gezeichnet.

       :focus-visible statt :focus ist der Kern der Lösung: der
       Browser zeigt den Rahmen damit bei Tastatur/Tab, aber NICHT
       bei Maus- oder Fingertipp. Genau das, was gewünscht ist –
       beim Antippen nichts, beim Tabben ein klarer Rahmen.

       Spezifität bewusst (0,2,0) über den Nachfahren-Selektor:
       damit gewinnt die Regel gegen die acht outline:none-Regeln
       weiter unten (je (0,1,0)) – unabhängig von der Reihenfolge im
       Stylesheet und auch dann noch, wenn dort später etwas
       dazukommt. Vier dieser acht hatten bisher gar keinen Ersatz
       (.profil-name-eingabe, .tagebuch-eingabe und die beiden
       Regler) – die waren per Tastatur schlicht unauffindbar.

       outline-offset hält den Rahmen AUSSERHALB des Elements. Das
       ist wichtig, weil manche Flächen selbst schwarz sind (Senden-
       Knopf): ein schwarzer Rahmen direkt darauf wäre unsichtbar,
       zwei Pixel daneben auf dem hellen Grund dagegen deutlich.
       ══════════════════════════════════════════════════════════════ */

    * { -webkit-tap-highlight-color: transparent; }

    /* Textauswahl: ebenfalls systemblau, wenn man sie nicht setzt.
       Invertiert statt blau – Vordergrund und Hintergrund tauschen
       die Rollen, dadurch passt es in beiden Modi. */
    .phone-frame ::selection { background: var(--fokus); color: var(--bg); }

    .phone-frame :focus-visible {
      outline: 2px solid var(--fokus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Regler: der Rahmen soll den Griff umfassen, nicht die 2px dünne
       Schiene – sonst sieht er aus wie ein verrutschter Strich.

       outline wird hier WIEDERHOLT, nicht nur outline-offset gesetzt:
       .testregler-regler-zeile input[type="range"] ist (0,2,1) und
       schlägt damit .phone-frame :focus-visible (0,2,0). Ohne eigenes
       outline bliebe dort das outline:none stehen und der Regler wäre
       per Tastatur unsichtbar. Diese Regel ist (0,3,1) und gewinnt. */
    .phone-frame input[type="range"]:focus-visible {
      outline: 2px solid var(--fokus);
      outline-offset: 6px;
    }

    /* #eingabe (Chat-Eingabefeld) setzt outline:none über eine ID –
       (1,0,0) schlägt jede Klassenregel. Deshalb hier ebenfalls über
       die ID, sonst bliebe ausgerechnet das meistgenutzte Feld der
       App ohne sichtbaren Tastaturfokus. */
    #eingabe:focus-visible {
      outline: 2px solid var(--fokus);
      outline-offset: 2px;
    }


    /* ══════════════════════════════════════════════════════════════
       SCROLLBALKEN – einheitlicher, dezenter Stil für ALLE
       scrollbaren Bereiche der App (Kontaktliste, Chat-Verlauf,
       Eingabefeld, Overlay-Karten inkl. Kontaktauswahl in "Neue
       Gruppe" und Story-Ansicht, Tagebuch-Liste/-Monatsansicht).
       Schmale Linie statt System-Balken, kein sichtbarer Track,
       abgerundete Enden, Farbe folgt dem aktuellen Modus über
       --scrollbar-farbe (siehe oben). Rein optisch – betrifft keine
       Typografie-/Zustandslogik.
       WICHTIG: scrollbar-width/-color (Standard-Properties, nur für
       Browser ohne ::-webkit-scrollbar-Unterstützung wie Firefox)
       ausdrücklich in @supports not selector(::-webkit-scrollbar)
       gekapselt – neuere Chromium-Versionen kennen inzwischen BEIDE
       Property-Familien, und wenn scrollbar-width/-color gesetzt
       sind, rendern sie dort ihren nativen "thin"-Balken (klobiger,
       sichtbarer Track, keine abgerundeten Enden) statt unser
       exaktes ::-webkit-scrollbar-thumb-Styling zu übernehmen – genau
       der Fall, der die dezente Optik "regressieren" ließ. Mit dem
       @supports-Gate bekommt jede Engine nur genau einen der beiden
       Mechanismen. ══════════════════════════════════════════════════ */
    @supports not selector(::-webkit-scrollbar) {
      .gespraechs-liste,
      .chat-bereich,
      .overlay-karte,
      .moment-ansicht-karte,
      .kontakt-auswahl-liste,
      .tagebuch-liste,
      .tagebuch-monat,
      .moment-feed,
      .moment-kommentar-liste,
      #tab-profil,
      #eingabe,
      .raum-zone-nachrichten {
        scrollbar-width: thin;                              /* Firefox */
        scrollbar-color: var(--scrollbar-farbe) transparent; /* Firefox */
      }
    }

    .gespraechs-liste::-webkit-scrollbar,
    .chat-bereich::-webkit-scrollbar,
    .overlay-karte::-webkit-scrollbar,
    .moment-ansicht-karte::-webkit-scrollbar,
    .kontakt-auswahl-liste::-webkit-scrollbar,
    .tagebuch-liste::-webkit-scrollbar,
    .tagebuch-monat::-webkit-scrollbar,
    .moment-feed::-webkit-scrollbar,
    .moment-kommentar-liste::-webkit-scrollbar,
    #tab-profil::-webkit-scrollbar,
    #eingabe::-webkit-scrollbar,
    .raum-zone-nachrichten::-webkit-scrollbar {
      width: 4px;
    }

    .gespraechs-liste::-webkit-scrollbar-track,
    .chat-bereich::-webkit-scrollbar-track,
    .overlay-karte::-webkit-scrollbar-track,
    .moment-ansicht-karte::-webkit-scrollbar-track,
    .kontakt-auswahl-liste::-webkit-scrollbar-track,
    .tagebuch-liste::-webkit-scrollbar-track,
    .tagebuch-monat::-webkit-scrollbar-track,
    .moment-feed::-webkit-scrollbar-track,
    .moment-kommentar-liste::-webkit-scrollbar-track,
    #tab-profil::-webkit-scrollbar-track,
    #eingabe::-webkit-scrollbar-track,
    .raum-zone-nachrichten::-webkit-scrollbar-track {
      background: transparent;
    }

    .gespraechs-liste::-webkit-scrollbar-thumb,
    .chat-bereich::-webkit-scrollbar-thumb,
    .overlay-karte::-webkit-scrollbar-thumb,
    .moment-ansicht-karte::-webkit-scrollbar-thumb,
    .kontakt-auswahl-liste::-webkit-scrollbar-thumb,
    .tagebuch-liste::-webkit-scrollbar-thumb,
    .tagebuch-monat::-webkit-scrollbar-thumb,
    .moment-feed::-webkit-scrollbar-thumb,
    .moment-kommentar-liste::-webkit-scrollbar-thumb,
    #tab-profil::-webkit-scrollbar-thumb,
    #eingabe::-webkit-scrollbar-thumb,
    .raum-zone-nachrichten::-webkit-scrollbar-thumb {
      background: var(--scrollbar-farbe);
      border-radius: 999px;
    }

    .gespraechs-liste::-webkit-scrollbar-button,
    .chat-bereich::-webkit-scrollbar-button,
    .overlay-karte::-webkit-scrollbar-button,
    .moment-ansicht-karte::-webkit-scrollbar-button,
    .kontakt-auswahl-liste::-webkit-scrollbar-button,
    .tagebuch-liste::-webkit-scrollbar-button,
    .tagebuch-monat::-webkit-scrollbar-button,
    .moment-feed::-webkit-scrollbar-button,
    .moment-kommentar-liste::-webkit-scrollbar-button,
    #tab-profil::-webkit-scrollbar-button,
    #eingabe::-webkit-scrollbar-button,
    .raum-zone-nachrichten::-webkit-scrollbar-button {
      display: none;
    }


    /* ── Äußerer Rahmen ───────────────────────────────── */
    body {
      background: #e8e6e1;  /* bleibt konstant (außerhalb des Frames) */
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
    }

    /* ── Phone-Frame ──────────────────────────────────── */
    .phone-frame {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
    }

    @media (max-width: 440px) {
      body { background: var(--bg); }
      .phone-frame { width: 100%; height: 100dvh; box-shadow: none; }
    }

    /* ── Ansichten (Übersicht / Chat) ─────────────────── */
    .ansicht {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: opacity 0.2s ease;
    }

    .ansicht--versteckt {
      opacity: 0;
      pointer-events: none;
    }


    /* ══════════════════════════════════════════════════════
       ANSICHT 1 – GESPRÄCHSÜBERSICHT
       ══════════════════════════════════════════════════════ */

    /* ── App-Kopfzeile: Name/Logo-Platzhalter + Menü-Symbol ──────
       Oberste Zeile der Übersicht, sitzt über der bestehenden
       Chats/Gruppen-Titelzeile. Rein strukturell/Platzhalter –
       Menü-Button hat bewusst keine Funktion hinterlegt. ── */
    .app-kopfzeile {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 6px;
    }

    .app-logo {
      height: 20px;
      width: auto;
      display: block;
    }

    .menu-btn {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-btn:hover { background: var(--bg-hover); color: #000000; }

    .menu-btn svg { width: 18px; height: 18px; }

    /* ── Suchfeld: schlicht, Outline, keine Farbe ────────────── */
    .suche-bereich {
      flex-shrink: 0;
      padding: 10px 20px;
    }

    /* Punkt 2: 13 → 14px Schrift, Polsterung 7/10 → 11/13px. Damit
       wächst das Feld von rund 30px auf 40px Höhe – näher an einer
       bequemen Tippfläche, ohne die Liste darunter zu verdrängen. */
    .suche-eingabe {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      outline: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 14px;
      color: #000000;
      padding: 11px 13px;
    }

    .suche-eingabe:focus { border-color: var(--text-2); }

    .suche-eingabe::placeholder { color: var(--placeholder); }

    /* ── Filter-Chips: Outline-Pillen, aktiver Chip gefüllt ──────
       Rein schwarz/weiß-basiert (var(--accent) / var(--bg)) –
       kein Grün, keine fremde Markenfarbe. ── */
    .filter-leiste {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 12px 20px 10px;
    }

    /* ══════════════════════════════════════════════════════════════
       "+"-ZEICHEN OPTISCH ZENTRIEREN
       Alle Plus-Kreise stehen bereits auf display:flex mit
       align-items/justify-content:center – rechnerisch also mittig.
       Trotzdem sitzt das Zeichen sichtbar zu hoch, denn Flexbox
       zentriert die ZEILENBOX, nicht die Glyphe. Die Zeilenbox reicht
       von der Oberkante der Versalien bis zur Unterlänge; das "+" hat
       aber weder Ober- noch Unterlänge und liegt in Situra oberhalb
       der Boxmitte.

       Am Bildschirm nachgemessen, mit einer 0x0-Sonde auf der
       Grundlinie (erfasst das Half-Leading mit) gegen die Tintenkanten
       aus dem Canvas: Die Tintenmitte lag 2,09px über der Kreismitte,
       bei 22px Schrift also 0,095em. Ein erster Versuch mit 0,08em
       ließ noch 0,33px Rest stehen – deshalb 0,095em.

       em-relativ statt in Pixeln, damit die Korrektur in jeder Größe
       stimmt: Der Versatz wächst proportional zur Schriftgröße.

       Horizontal ist keine Korrektur nötig: Das "+" ist symmetrisch,
       gemessene Abweichung 0,01px. */
    .plus-zeichen {
      display: block;
      transform: translateY(0.095em);
    }

    .filter-chip {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      /* Punkt 2: 11 → 12px, Polsterung 5/12 → 7/14px. Chips werden
         regelmäßig bedient; die Tippfläche wächst damit von rund
         23px auf 29px Höhe, ohne dass sie laut werden. */
      font-size: 12px;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .filter-chip:hover { border-color: var(--text-2); }

    .filter-chip--aktiv {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
    }

    .filter-chip--aktiv:hover { border-color: var(--accent); }

    /* ── Tab-Panels: Chats / Gruppen ──────────────────────────────
       Jeweils genau eines der beiden Panels ist sichtbar; beide sind
       selbst flex-column-Container, damit ihre Listen (flex:1,
       overflow-y:auto) wie gehabt scrollen. ── */
    .tab-inhalt {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .tab-inhalt.aktiv { display: flex; }

    /* Profil-Tab scrollt als GANZES (Foto/Name/Werte/Schlafgraph/
       Tagebuch zusammen) statt nur eines einzelnen Unterbereichs –
       siehe .tagebuch-liste/.tagebuch-monat oben, die bewusst KEIN
       eigenes overflow-y mehr haben, damit nicht zwei verschachtelte
       Scrollbereiche entstehen. */
    #tab-profil { overflow-y: auto; }

    /* ── Tab-Leiste: Chats / Gruppen (unten, wie Bottom-Nav) ──────── */
    .tab-leiste {
      flex-shrink: 0;
      display: flex;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
    }

    /* ══════════════════════════════════════════════════════════════
       TAB-LEISTE – zentrales Navigationselement, deshalb etwas
       präsenter als zuvor (11px Schrift, 12px Padding, Leiste rund
       37px hoch – für den Daumen knapp und für die Bedeutung zu leise).
       Der aktive Reiter unterschied sich zudem AUSSCHLIESSLICH durch
       die Farbe; die Schriftfamilie war ausdrücklich dieselbe.

       Neu: 56px Leistenhöhe. Das ist genau die Konvention beider
       Plattformen (Android 56dp, iOS 49pt) und liegt über den 48dp,
       die als Mindestmaß für eine Tippfläche gelten.

       Nicht zu dominant: Die Beschriftung bleibt mit 12px klein –
       gegenüber 30px Nachrichtentext ist das Verhältnis rund 1:2,5.
       Die Leiste gewinnt also über die FLÄCHE an Präsenz, nicht über
       die Schriftgröße. Der Inhalt darüber bleibt das Lauteste.
       ══════════════════════════════════════════════════════════════ */
    /* Höhe der Leiste als Variable, NICHT als Zahl in zwei Regeln.
       Genau daran ist es zuvor gescheitert: Der schwebende
       Emotions-Schalter stand auf bottom:54px – ein Wert, der zur
       damaligen ~37px-Leiste passte. Als die Leiste auf 56px wuchs,
       ragte der Schalter 3px in sie hinein (am Bildschirm nachgemessen).
       Zwei unabhängige Zahlen für dieselbe Kante laufen früher oder
       später auseinander; über die Variable können sie das nicht mehr.
       Wer die Leistenhöhe ändert, verschiebt den Schalter automatisch
       mit – siehe .emotion-schalter--schwebend. */
    .phone-frame { --tab-leiste-hoehe: 56px; }

    .tab-btn {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tab-leiste-hoehe);
      background: none;
      border: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 0 4px;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .tab-btn:hover { color: var(--text-2); }

    /* Drei Unterschiede statt einem: voller Kontrast, kräftigerer
       Schnitt und ein kurzer Strich an der Oberkante. Farbe allein
       trug zu wenig – besonders im dunklen Modus, wo --text-3 (#666)
       und Weiß auf kleiner Schrift nah beieinanderliegen. */
    .tab-btn--aktiv {
      color: #000000;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
    }

    .phone-frame.emotion-an .tab-btn--aktiv { color: #ffffff; }

    /* Kurzer Indikator auf der Trennlinie der Leiste (top:-1px deckt
       den 1px-Rand von .tab-leiste ab). Bewusst nur 28px breit statt
       über die volle Reiterbreite: markiert, ohne einen zweiten
       kräftigen Balken durchs Bild zu ziehen.

       3px statt der zunächst gewählten 2px: Am Bildschirm geprüft war
       ein 2px-Strich am äußersten Rand der Leiste kaum wahrnehmbar –
       technisch vorhanden, aber als Unterscheidungsmerkmal wertlos. */
    .tab-btn--aktiv::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      border-radius: 0 0 2px 2px;
      background: currentColor;
    }

    /* ── Gruppen-Kopf: Titel + "+"-Button ──────────────────────── */
    .gruppen-kopf {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
    }

    .gruppen-kopf-label {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .neue-gruppe-btn {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-2);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .neue-gruppe-btn:hover { border-color: var(--text-2); }

    /* ── Overlay: Neue Gruppe erstellen ──────────────────────────
       Schlichtes Bottom-Sheet innerhalb des Phone-Frames, passend
       zum reduzierten Look – keine Farbverläufe, nur Outline. ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
    }

    .overlay.sichtbar { display: flex; }

    .overlay-karte {
      width: 100%;
      max-height: 78%;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .overlay-kopf {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .overlay-titel {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .overlay-schliessen {
      background: none;
      border: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 20px;
      line-height: 1;
      color: var(--text-3);
      cursor: pointer;
    }

    .overlay-schliessen:hover { color: var(--text-2); }

    .kontakt-auswahl-liste {
      display: flex;
      flex-direction: column;
      gap: 1px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border-light);
    }

    .kontakt-auswahl-eintrag {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
    }

    .kontakt-auswahl-eintrag:hover { background: var(--bg-hover); }

    .kontakt-auswahl-eintrag input[type="checkbox"] {
      width: 14px; height: 14px;
      accent-color: var(--accent);
    }

    /* ══════════════════════════════════════════════════════════════
       BUTTON-HIERARCHIE – drei Stufen, app-weit
       ──────────────────────────────────────────────────────────────
       Vorher gab es .overlay-btn: EINE flache Variante (Outline,
       13px, 10px Padding, kein Radius) für acht sehr verschiedene
       Aktionen – "Gruppe erstellen" sah aus wie "Abbrechen". Genau
       daher rührte der Eindruck, alles sei gleichwertig.

       Vorbild ist das Onboarding, wo die Unterscheidung schon
       bestand (#weiter-btn gefüllt, .bluetooth-btn Outline,
       .link-btn nur Text). Diese drei Stufen sind hier
       verallgemeinert und heißen überall gleich.

         Stufe        Fläche          Rahmen        Form
         ──────────── ─────────────── ───────────── ──────────────
         primär       gefüllt         wie Fläche    Pille, 46px
         sekundär     keine           1px --border  Pille, 46px
         tertiär      keine           keiner        nur Text

       Primär und sekundär teilen sich ABSICHTLICH exakt dieselbe
       Geometrie – sie unterscheiden sich nur durch die Füllung, wie
       gefordert. Dadurch bleibt eine Reihe aus beiden ruhig.

       Die Füllung nutzt --schalter-fuellung/-kontrast (siehe
       Modus-Variablen ganz oben): dunkler Modus weiße Fläche mit
       schwarzer Schrift, heller Modus umgekehrt. Diese beiden
       Variablen existierten bereits für den Emotion-Schalter und
       bedeuten exakt das – kein neues Farbpaar nötig.

       KOMPAKTE VARIANTE (.btn--kompakt): für die Composer-Zeilen in
       Tagebuch und Moment, wo der Knopf neben einem Eingabefeld in
       einer schmalen Zeile sitzt. Gleiche Form und Rangfolge, nur
       kleiner – eine 46px-Pille über die volle Breite würde die
       Zeile dort sprengen.
       ══════════════════════════════════════════════════════════════ */
    .btn-primaer,
    .btn-sekundaer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 14px 22px;
      border-radius: 999px;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 14px;
      letter-spacing: 0.01em;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.2s ease, background-color 0.2s ease,
                  border-color 0.2s ease, transform 0.15s ease;
    }

    .btn-primaer {
      background: var(--schalter-fuellung);
      color: var(--schalter-fuellung-kontrast);
      border: 1px solid var(--schalter-fuellung);
    }

    /* Primärtext hat in dieser App keine eigene Variable (siehe
       Modus-Block oben: es gibt --text-2/-3/-4, aber kein --text) –
       deshalb wie überall sonst das Paar #000000 / .emotion-an #ffffff. */
    .btn-sekundaer {
      background: none;
      border: 1px solid var(--border);
      color: #000000;
    }
    .phone-frame.emotion-an .btn-sekundaer { color: #ffffff; }

    .btn-primaer:hover:not(:disabled)   { opacity: 0.86; }
    .btn-sekundaer:hover:not(:disabled) { border-color: var(--schalter-fuellung); }
    .btn-primaer:active:not(:disabled),
    .btn-sekundaer:active:not(:disabled) { transform: scale(0.98); }

    /* Gesperrt, z. B. solange die Anmeldung beim Server nicht bestätigt
       ist (siehe overlayKnoepfeAktualisieren im Abschnitt VERBINDUNG). */
    .btn-primaer:disabled,
    .btn-sekundaer:disabled { opacity: 0.3; cursor: default; }

    /* Tertiär: Abbrechen, Überspringen, Zurück. Kein Rahmen, keine
       Fläche, kleiner – soll erreichbar sein, aber nichts vorschlagen. */
    .btn-tertiaer {
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 8px 10px;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--text-2);
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .btn-tertiaer:hover { color: #000000; }
    .phone-frame.emotion-an .btn-tertiaer:hover { color: #ffffff; }

    .btn--kompakt {
      flex-shrink: 0; /* stand vorher auf .moment-senden-btn/.tagebuch-speichern-btn */
      min-height: 36px;
      padding: 9px 16px;
      font-size: 13px;
    }

    /* Die globale Fokusregel (.phone-frame :focus-visible, siehe
       FOKUS-Abschnitt) setzt border-radius:2px und ist mit (0,2,0)
       stärker als diese Klassen (0,1,0) – ohne diese Zeile würden die
       Pillen beim Tabben rechteckig. Spezifität hier (0,3,0). */
    .phone-frame .btn-primaer:focus-visible,
    .phone-frame .btn-sekundaer:focus-visible { border-radius: 999px; }

    /* Über die volle Breite, wenn der Knopf direkt in einer Overlay-
       Karte steht – die stapelt ihre Kinder ohnehin untereinander.
       Als Container-Regel statt als Zusatzklasse an jedem Knopf: so
       kann keiner vergessen werden. */
    .overlay-karte > .btn-primaer,
    .overlay-karte > .btn-sekundaer,
    .kopplung-seite > .btn-primaer,
    .kopplung-seite > .btn-sekundaer { width: 100%; }

    /* Destruktive Aktion (z. B. "Gruppe löschen"): dünne rote Outline
       statt schwarz/weiß, signalisiert Endgültigkeit – bewusst die
       einzige Farbabweichung vom sonst rein monochromen Look. Wirkt auf
       BEIDE Stufen, damit eine gefährliche Aktion primär ODER sekundär
       sein kann, je nachdem wie leicht sie erreichbar sein soll. */
    .btn--gefahr {
      border-color: rgba(196, 60, 48, 0.55);
      color: rgba(196, 60, 48, 0.9);
    }
    .phone-frame.emotion-an .btn-sekundaer.btn--gefahr { color: rgba(224, 96, 84, 0.95); }
    .btn-primaer.btn--gefahr {
      background: rgba(196, 60, 48, 0.9);
      border-color: rgba(196, 60, 48, 0.9);
      color: #ffffff;
    }

    /* ── Menü (Hamburger) + Einstellungen + Infos ────────────────── */
    .menu-eintrag {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border-light);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-2);
      padding: 14px 2px;
      cursor: pointer;
    }

    .menu-eintrag:last-child { border-bottom: none; }
    .menu-eintrag:hover { color: #000000; }
    .phone-frame.emotion-an .menu-eintrag:hover { color: #ffffff; }

    .einstellung-zeile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px;
    }

    .einstellung-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .einstellung-label {
      font-size: 13px;
      color: var(--text-2);
    }

    .einstellung-hinweis {
      font-size: 11px;
      color: var(--text-3);
    }

    /* ══════════════════════════════════════════════════════════════
       KOPPLUNG – Overlay zum Verbinden zweier Handys (siehe Abschnitt
       VERBINDUNG im Script). Baut bewusst auf denselben Bausteinen auf
       wie Menü und Einstellungen (.overlay/.overlay-karte/
       .einstellung-zeile/.overlay-btn) – deren Farben liegen auf
       --bg/--border/--text-2/--text-3 und schalten damit im
       Emotion-Modus von selbst mit. Eigene Regeln braucht es nur für
       die zwei Elemente, die es sonst nirgends gibt.

       WICHTIG: Das Overlay MUSS innerhalb von .phone-frame hängen –
       sämtliche CSS-Variablen sind dort definiert. An document.body
       gehängt fiele jedes var(--…) aus, und die emotion-an-Regeln
       unten griffen nie (der Fehler, an dem die erste Fassung scheiterte).

       Primärtext wird wie überall in dieser Datei als #000000 gesetzt
       und per .phone-frame.emotion-an auf #ffffff gedreht – es gibt
       bewusst KEINE --text-Variable, siehe .gespraechs-name.
       ══════════════════════════════════════════════════════════════ */
    /* "Kontakt hinzufügen" – steht dauerhaft ganz oben in der Liste
       und ist kein Mensch: gestrichelter Kreis statt der durchgezogenen
       Avatar-Kontur, damit er sich auf einen Blick von den Kontakten
       darunter abhebt, ohne eine neue Farbe einzuführen. */
    .gespraechs-eintrag--hinzufuegen .avatar {
      border-style: dashed;
      font-size: 22px;
    }

    .gespraechs-eintrag--hinzufuegen .gespraechs-name {
      color: var(--text-2);
    }

    .kopplung-code {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      line-height: 1.2;
      color: #000000;
    }

    /* Kopplungscode vom globalen Farbübergang ausnehmen.
       ".phone-frame *" (MODUSWECHSEL-TRANSITION weiter unten) blendet
       color über 0,4 s. Beim Wechsel aus dem "noch nicht erzeugt"-
       Zustand blieb dieser Übergang hängen – die Ziffern standen
       dauerhaft im Grau des Hinweistextes statt in Vordergrundfarbe.
       Ein Kopplungscode soll ohnehin sofort dastehen, nicht einblenden.

       Der Vorsatz ".phone-frame " ist notwendig, nicht Zierde: Die
       globale Regel steht bewusst als LETZTE im Stylesheet (siehe
       Kommentar dort) und hat mit (0,1,0) dieselbe Spezifität wie
       ".kopplung-code" allein – bei Gleichstand gewinnt die spätere.
       Mit (0,2,0) gewinnt diese hier unabhängig von der Reihenfolge. */
    .phone-frame .kopplung-code {
      transition: none;
    }

    .phone-frame.emotion-an .kopplung-code { color: #ffffff; }

    /* Zustand "noch kein Code erzeugt": liest sich als Hinweis, nicht
       als Zahl – deshalb zurück auf die Hinweis-Typografie. */
    .kopplung-code--leer {
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: normal;
      color: var(--text-3);
    }

    .phone-frame.emotion-an .kopplung-code--leer { color: var(--text-3); }

    .kopplung-eingabe {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: #000000;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 20px;
      letter-spacing: 0.25em;
      text-align: center;
    }

    .phone-frame.emotion-an .kopplung-eingabe { color: #ffffff; }

    .kopplung-eingabe::placeholder {
      color: var(--placeholder);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 13px;
      letter-spacing: normal;
    }

    /* ══════════════════════════════════════════════════════════════
       KOPPLUNG – zwei Modi: "Mein Code" und "Code scannen"

       Bewusst getrennt statt untereinander: Wer koppeln will, ist immer
       auf genau EINER Seite des Vorgangs – entweder man zeigt seinen
       Code oder man liest den fremden. Beides gleichzeitig zu sehen
       erzeugt nur die Frage, was man jetzt tun soll.

       Der Umschalter übernimmt Form und Maße vom Tagebuch-Umschalter
       (.tagebuch-ansicht-umschalter weiter oben) – dieselbe Bedeutung,
       dieselbe Gestalt, keine zweite Erfindung. Farben durchweg aus den
       vorhandenen Tokens, damit beide Modi der App folgen.
       ══════════════════════════════════════════════════════════════ */
    .kopplung-modus-umschalter {
      display: flex;
      gap: 2px;
      width: fit-content;
      margin: 0 auto 4px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .kopplung-modus-btn {
      background: none;
      border: none;
      color: var(--text-3);
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.02em;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .kopplung-modus-btn--aktiv,
    .kopplung-modus-btn--aktiv:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .kopplung-seite[hidden] { display: none; }

    .kopplung-seite {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      /* Beide Seiten gleich hoch halten, damit die Karte beim Umschalten
         nicht springt. Der QR-Code (200px + Rand) gibt das Maß vor; die
         Scan-Seite hat seit dem Entfernen der leeren Vorschaufläche
         weniger Inhalt und verteilt den Rest gleichmäßig. */
      min-height: 268px;
      justify-content: center;
    }

    /* "oder eintippen" trennt die beiden Wege im Scan-Modus, ohne eine
       Linie zu ziehen – zurückhaltend, aber deutlich genug, dass das
       Eingabefeld nicht wie ein Anhängsel des Knopfes wirkt. */
    .kopplung-trenner {
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 11px;
      color: var(--text-3);
      margin-top: 4px;
    }

    /* Der QR-Code braucht IMMER dunkle Module auf hellem Grund, auch im
       invertierten Modus – Scanner erwarten diese Polarität, und eine
       Umkehrung machte den Code für manche Lesegeräte unbrauchbar.
       Deshalb hier bewusst feste Farben statt --bg/--text. */
    .kopplung-qr {
      width: 200px;
      height: 200px;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kopplung-qr svg { width: 100%; height: 100%; display: block; }

    /* Platzhalter, solange kein Code erzeugt wurde */
    .kopplung-qr--leer {
      background: none;
      border: 1px dashed var(--border);
      color: var(--text-3);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 11px;
      text-align: center;
      padding: 20px;
    }


    /* Während der native Scanner läuft, muss die WebView durchsichtig
       sein, sonst verdeckt sie das Kamerabild. */
    .phone-frame.kamera-laeuft,
    .phone-frame.kamera-laeuft .overlay,
    .phone-frame.kamera-laeuft .overlay-karte { background: transparent; }
    .phone-frame.kamera-laeuft .ansicht,
    .phone-frame.kamera-laeuft .einstellung-zeile,
    .phone-frame.kamera-laeuft .kopplung-modus-umschalter { visibility: hidden; }

    .infos-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-2);
    }

    .infos-liste {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-2);
    }

    .infos-liste strong { color: #000000; }
    .phone-frame.emotion-an .infos-liste strong { color: #ffffff; }

    /* ── Testregler (Infos-Overlay): derselbe kombinierte Regler-Block
       wie situra-slider.html ("Kombiniert") und der Onboarding-Schritt
       "Probier's selbst" – hier als Abschluss der Infos-Karte, nutzt
       dieselben --text/--text-2/--text-3/--border-Variablen wie der Rest
       des Menüs, damit Licht-/Dunkelmodus automatisch mitgeht. ── */
    .testregler-trenner {
      border-top: 1px solid var(--border-light);
      margin-top: 4px;
    }

    .testregler-buehne {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0 4px;
    }

    .testregler-wort {
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 2.4rem;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #000000;
      user-select: none;
      white-space: nowrap;
    }

    /* Fällt Temperatur aus (siehe testreglerAchseEinrichten, JS), wird
       die per JS gesetzte Inline-Farbe entfernt und dieser CSS-Default
       greift wieder – WICHTIG: chat.html hat (anders als onboarding.html)
       keine --text-Variable, nur feste #000000/#ffffff je Modus (wie bei
       .tagebuch-tag) – sonst bleibt das Wort im Emotion-Modus (dunkler
       Hintergrund) unsichtbar schwarz-auf-schwarz statt weiß. */
    .phone-frame.emotion-an .testregler-wort { color: #ffffff; }

    @keyframes situraZittern {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25%      { transform: translate(var(--amp, 0px), calc(var(--amp, 0px) * -1)) rotate(calc(var(--rot, 0deg) * -1)); }
      50%      { transform: translate(calc(var(--amp, 0px) * -1), var(--amp, 0px)) rotate(var(--rot, 0deg)); }
      75%      { transform: translate(var(--amp, 0px), var(--amp, 0px)) rotate(calc(var(--rot, 0deg) * -1)); }
    }

    .testregler-achsen {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .testregler-achse { display: flex; flex-direction: column; gap: 8px; }

    .testregler-achse-kopf { display: flex; align-items: center; gap: 10px; }

    .testregler-achse-label {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #000000;
      transition: color 0.25s ease;
    }

    .phone-frame.emotion-an .testregler-achse-label { color: #ffffff; }
    .testregler-achse--aus .testregler-achse-label { color: var(--text-3); }
    .testregler-achse--aus .testregler-regler-zeile { opacity: 0.35; }

    .testregler-schalter { flex-shrink: 0; display: inline-flex; cursor: pointer; }
    .testregler-schalter input { display: none; }

    .testregler-schalter-visuell {
      width: 32px; height: 18px;
      background: transparent;
      border: 1.5px solid var(--text-3);
      border-radius: 9px;
      position: relative;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .testregler-schalter-visuell::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text-3);
      top: 1.5px; left: 1.5px;
      transition: transform 0.25s ease, background-color 0.25s ease;
    }

    .testregler-schalter input:checked + .testregler-schalter-visuell {
      background: var(--accent);
      border-color: var(--accent);
    }

    .testregler-schalter input:checked + .testregler-schalter-visuell::after {
      transform: translateX(14px);
      background: var(--bg);
    }

    .testregler-regler-zeile { display: flex; align-items: center; gap: 12px; }

    .testregler-regler-zeile input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 0;
      height: 2px;
      border-radius: 1px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    .testregler-regler-zeile input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .testregler-regler-zeile input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    /* FESTE Breite, nicht min-width: Der längste Inhalt ist
       "Situra-SemiBold · 900" (21 Zeichen). Mit min-width wuchs das
       Feld beim Ziehen über seine Mindestbreite hinaus, der Regler
       daneben schrumpfte entsprechend – der Griff rutschte unter dem
       Finger weg. Mit fester Breite bleibt die Reglerlänge konstant.

       22ch statt einer Pixelzahl, damit die Breite mitskaliert, falls
       die Schriftgröße geändert wird. nowrap verhindert zusätzlich
       einen Umbruch bei knappem Platz. */
    .testregler-wert {
      flex: 0 0 auto;
      width: 22ch;
      text-align: right;
      white-space: nowrap;
      font-size: 11px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .testregler-wert strong {
      color: #000000;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-weight: normal;
    }

    .phone-frame.emotion-an .testregler-wert strong { color: #ffffff; }

    /* ── Gruppeninfo: Mitgliederzeile mit Entfernen-"×" ──────────── */
    .gruppenmitglied-zeile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-2);
    }

    .gruppenmitglied-entfernen-btn {
      background: none;
      border: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1;
      color: var(--text-3);
      cursor: pointer;
      padding: 4px 6px;
    }

    .gruppenmitglied-entfernen-btn:hover { color: var(--text-2); }

    /* ── Bestätigungs-Dialog: zentriert statt Bottom-Sheet ───────── */
    .overlay--zentriert {
      align-items: center;
    }

    .bestaetigung-karte {
      width: 260px;
      max-width: 82%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bestaetigung-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-2);
      text-align: center;
    }

    .bestaetigung-aktionen {
      display: flex;
      gap: 10px;
    }

    .bestaetigung-aktionen .btn-primaer { flex: 1; }

    /* ══════════════════════════════════════════════════════════════
       MOMENT – horizontale Story-Leiste + Composer (versteckt hinter
       dem eigenen Kreis) + Feed der Momente anderer + Story-Ansicht.
       Separater Bereich: rein visuell eigenständig, die eigentliche
       Wort-Einfrier-Logik lebt im JS-Abschnitt "MOMENT" und rührt
       nicht an der Chat-Logik. Keine eigene "Moment"-Überschrift mehr
       (weder die geteilte Kopfzeile noch ein lokales Label) – der
       Bereich ist über die Tab-Leiste unten bereits eindeutig benannt,
       siehe tabAnzeigen (JS). ══════════════════════════════════ */
    .moment-leiste {
      flex-shrink: 0;
      display: flex;
      gap: 18px;
      padding: 20px 20px 18px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Siehe Kommentar beim großen Scrollbalken-Block oben – dasselbe
       @supports-Gate, damit Chromium-Versionen mit Unterstützung für
       BEIDE Property-Familien nicht den klobigeren nativen "thin"-
       Balken statt unseres ::-webkit-scrollbar-Thumb zeigen. */
    @supports not selector(::-webkit-scrollbar) {
      .moment-leiste {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-farbe) transparent;
      }
    }

    .moment-leiste::-webkit-scrollbar { height: 4px; }
    .moment-leiste::-webkit-scrollbar-track { background: transparent; }
    .moment-leiste::-webkit-scrollbar-thumb { background: var(--scrollbar-farbe); border-radius: 999px; }
    .moment-leiste::-webkit-scrollbar-button { display: none; }

    .moment-kreis-wrapper {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 74px; /* breiter als vorher (60px) – Platz für den deutlich größeren Namen darunter */
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    /* Größere Variante des bestehenden Profilbild-Kreises für die
       Story-Leiste – reine Größen-/Layoutanpassung, die Strichstärke
       (font-family) wird weiterhin vom bestehenden Profilbild-System
       gesetzt (siehe avatarDarstellungAktualisieren), da hier wie in
       der Kontaktliste dieselbe data-name-Selektorlogik greift. */
    .avatar--moment {
      width: 54px; height: 54px;
      font-size: 19px;
    }

    /* Ungesehener Moment: dünner Ring um den Kreis, per box-shadow (kein
       zusätzlicher Platzverbrauch/Layout-Shift). KORREKTUR – war fest
       weiß: bei ausgeschaltetem Emotion-Modus (heller Hintergrund)
       verschwand der Ring dadurch praktisch unsichtbar. --ring-ungesehen
       folgt jetzt demselben modusabhängigen Variablen-Muster wie --bg/
       --text-2/etc. (siehe .phone-frame/.phone-frame.emotion-an oben):
       schwarz im hellen, weiß im dunklen Modus. */
    .avatar--moment-ungesehen {
      box-shadow: 0 0 0 2px var(--ring-ungesehen);
    }

    /* Eigener Kreis: Profilbild (falls vorhanden) statt Buchstabe,
       plus kleines "+"-Badge unten rechts – derselbe Aufbau wie der
       Stift-Button auf dem Profilbild im PROFIL-Tab (position:relative
       Wrapper + absolut positioniertes Badge), zum Wiedererkennen. */
    .moment-kreis-du {
      position: relative;
    }

    .moment-kreis-plus {
      position: absolute;
      right: -2px; bottom: -2px;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1;
      pointer-events: none; /* Klick soll den ganzen Kreis treffen, nicht nur das kleine Badge */
    }

    /* Deutlich größer als vorher (11px) – dieselbe Idee wie bei
       .gespraechs-name in der Kontaktliste: der Name ist der Ort, an
       dem die typografische Charakteristik der Person sichtbar wird. */
    .moment-kreis-name {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text-2);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Composer: standardmäßig verborgen, öffnet sich erst durch Tippen
       auf den eigenen Kreis (siehe momentOeffnen/momentComposerOffen,
       JS) – kein dauerhaft sichtbares Eingabefeld mehr. */
    .moment-composer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
    }

    .moment-composer[hidden] { display: none; }

    .moment-eingabe {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      outline: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 14px;
      color: #000000;
      padding: 6px 0;
    }

    .moment-eingabe:focus { border-bottom-color: var(--text-2); }

    .moment-eingabe::placeholder { color: var(--placeholder); }

    /* ── Feed: Momente der anderen Personen als große Karten ─────────
       Füllt den vormals leeren Bereich unterhalb der Kreis-Leiste. Der
       gepostete Satz (momentTextRendern – UNVERÄNDERTE reagierende
       Wort-für-Wort-Typografie, exakt wie in der Story-Ansicht/im Chat)
       ist bewusst das dominante, große Element; Profilbild + Name
       bilden nur eine kleine, zurückhaltende Kopfzeile darüber. "Du"
       taucht hier nie auf – der eigene Moment lebt im Kreis mit "+"
       bzw. in der Story-Ansicht (siehe momentOeffnen). ── */
    .moment-feed {
      flex: 1;
      overflow-y: auto;
      padding: 4px 20px 24px;
    }

    .moment-karte {
      padding: 26px 0;
    }

    .moment-karte-kopf {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .avatar--moment-karte {
      width: 30px; height: 30px;
      font-size: 12px;
    }

    .moment-karte-name {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text-2);
      letter-spacing: 0.02em;
    }

    .moment-karte-text {
      font-size: 24px;
      line-height: 1.35;
      color: #000000;
      overflow-wrap: break-word;
    }

    .phone-frame.emotion-an .moment-karte-text { color: #ffffff; }

    /* ── Like-Leiste unter jeder Moment-Karte ─────────────────────── */
    .moment-karte-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
    }

    .moment-like-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      padding: 0;
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .moment-like-btn:active { transform: scale(0.9); }

    .moment-like-btn--aktiv { color: var(--accent); }

    .moment-like-zaehler {
      font-size: 12px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }

    .moment-feed-leer {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
      padding: 20px 0;
    }

    /* ── Story-Ansicht: großer, eingefrorener Text – dieselbe
       typografische Sprache wie die Chat-Nachrichten (30px, zentriert),
       aber als eigene Karte statt Sprechblase. ── */
    .moment-ansicht-overlay .overlay-schliessen { margin-left: auto; }

    /* Bildschirmfüllend statt zentrierter Karte: überschreibt
       .overlay--zentriert (align-items/justify-content) – die Karte
       selbst (.moment-ansicht-karte oben) hat width/height:100% und
       füllt den so entstehenden Platz komplett aus. Eigene Hintergrund-
       farbe statt der abgedunkelten Overlay-Fläche, weil die Karte
       jetzt ohnehin alles verdeckt. */
    .moment-ansicht-overlay {
      background: var(--bg);
      align-items: stretch;
      justify-content: stretch;
    }

    /* ── Story-Fortschrittsbalken (Instagram-artig): ein Segment pro
       Person mit Moment, das aktuelle Segment füllt sich von links
       nach rechts über MOMENT_STORY_DAUER, danach automatisch der
       nächste Moment. Farbe wie .moment-ansicht-text (schwarz/weiß je
       Modus statt fest "weiß"), damit der Balken auf hellem UND
       dunklem Kartenhintergrund sichtbar bleibt. ── */
    .moment-story-balken {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .moment-story-segment {
      flex: 1;
      height: 2px;
      background: rgba(128, 128, 128, 0.35);
      border-radius: 1px;
      overflow: hidden;
    }

    .moment-story-segment-fill {
      height: 100%;
      width: 0%;
      background: #000000;
    }

    .phone-frame.emotion-an .moment-story-segment-fill { background: #ffffff; }

    /* Bildschirmfüllend statt kleiner Karte (wie eine Instagram-Story):
       .moment-ansicht-overlay bekommt dafür weiter unten ebenfalls
       align-items/justify-content:stretch statt center, damit die
       Karte den kompletten Phone-Frame ausfüllt statt darin zu
       schweben. */
    .moment-ansicht-karte {
      width: 100%;
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      background: var(--bg);
      border: none;
      padding: 20px 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .moment-ansicht-kopf {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .moment-ansicht-name {
      font-size: 13px;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      color: var(--text-2);
      letter-spacing: 0.02em;
    }

    /* Vertikal mittig zwischen Kopf (oben) und Footer (unten) – wie bei
       Instagram-Storys der Haupt-"Inhalt". WICHTIG: KEIN display:flex
       hier (das war der Bug) – .moment-ansicht-text enthält Wort-Spans
       UND Leerzeichen-Textknoten als direkte Kinder (siehe
       momentTextRendern/JS), die in einem Flex-Container zu
       Flex-Items würden: dadurch verschwand der Zeilenumbruch
       (nowrap-Reihe statt normalem Textfluss) und die Wortabstände
       schrumpften sichtbar zusammen (flex-shrink drückt Wörter/
       Leerzeichen zusammen). margin:auto in einem Flex-COLUMN-Eltern
       (.moment-ansicht-karte) zentriert den ganzen Absatz vertikal,
       OHNE dass der Absatz selbst zum Flex-Container wird – Wort-Spans
       bleiben normale inline-block-Elemente mit normalem Zeilenumbruch
       und normalen Leerzeichen. */
    .moment-ansicht-text {
      margin-top: auto;
      margin-bottom: auto;
      font-size: 36px;
      line-height: 1.35;
      /* Linksbündig wie der Chat-Text. Die vertikale Zentrierung des
         ganzen Absatzes in der Karte bleibt (margin-top/bottom:auto
         oben) – hier geht es nur um die Zeilenausrichtung darin. */
      text-align: left;
      color: #000000;
      overflow-wrap: break-word;
    }

    .phone-frame.emotion-an .moment-ansicht-text { color: #ffffff; }

    /* ── Footer der Story-Ansicht: Like (wiederverwendet
       .moment-karte-footer/.moment-like-*, siehe MOMENT-Feed weiter
       unten) + Kommentare. ── */
    .moment-ansicht-footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .moment-kommentar-liste {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 120px;
      overflow-y: auto;
    }

    .moment-kommentar-eintrag {
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-2);
    }

    .moment-kommentar-eintrag strong {
      color: #000000;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-weight: normal;
      margin-right: 5px;
    }

    .phone-frame.emotion-an .moment-kommentar-eintrag strong { color: #ffffff; }

    .moment-kommentar-leer {
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
    }

    .moment-kommentar-eingabe-zeile {
      display: flex;
      gap: 8px;
    }

    .moment-kommentar-eingabe {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      outline: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 13px;
      color: #000000;
      padding: 4px 0;
    }

    .phone-frame.emotion-an .moment-kommentar-eingabe { color: #ffffff; }
    .moment-kommentar-eingabe:focus { border-bottom-color: var(--text-2); }
    .moment-kommentar-eingabe::placeholder { color: var(--placeholder); }

    .moment-kommentar-senden-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .moment-kommentar-senden-btn:hover { border-color: var(--text-2); color: #000000; }
    .phone-frame.emotion-an .moment-kommentar-senden-btn:hover { color: #ffffff; }


    /* ══════════════════════════════════════════════════════════════
       PROFIL – eigener Profilbereich (Foto, Name, aktuelle Werte)
       + TAGEBUCH (eigenständige, dauerhafte Einträge, im Unterschied
       zu MOMENT: kein 24h-Limit, kein "einmal pro Tag"). Gleicher
       reduzierter Look wie der Rest der App (Outline-Stil, Situra).
       ══════════════════════════════════════════════════════════════ */
    /* Mittig statt am linken Rand, mit mehr Luft rundherum – Avatar
       über dem Namen statt nebeneinander, damit der Bereich weniger
       gedrängt wirkt. */
    /* ── Hierarchie im Profilbereich ──────────────────────────────
       Vorher lagen Name (20px), Graph-Titel (12px), Werte (10px) und
       Namens-Hinweis (10px) so dicht beieinander, dass keine Rangfolge
       ablesbar war – alles wirkte gleichwertig. Die Abstände zwischen
       den Abschnitten (14–24px) waren zudem kaum größer als die
       Abstände INNERHALB eines Abschnitts, wodurch die Bereiche
       ineinander liefen.

       Neue Staffelung, drei klar getrennte Ebenen:
         1. Identität   Foto 112px, Name 32px      ← dominant
         2. Inhalt      Graph-Titel 12px, Tagebuch
         3. Beiwerk     Werte-Labels 9px, Werte 11px, Hinweis 11px

       Der Sprung von 32px auf 11px ist bewusst groß: Ein Verhältnis
       von rund 3:1 liest sich als Rangfolge, die bisherigen 2:1
       (20px zu 10px) taten das nicht.

       ABSCHNITTSABSTAND: einheitlich 40px zwischen den Bereichen
       (--profil-abschnitt), gegenüber 6–10px innerhalb eines Bereichs.
       Erst dieses Verhältnis macht sichtbar, dass es verschiedene
       Bereiche sind – dafür braucht es keine Trennlinien, die dem
       reduzierten Schwarz/Weiß-Ansatz widersprächen. */
    .tab-inhalt#tab-profil { --profil-abschnitt: 40px; }

    .profil-kopf {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding: 44px 24px var(--profil-abschnitt);
    }

    /* Größere Variante des bestehenden .avatar-Kreises (siehe dort) –
       gleicher Aufbau (Outline, Foto überschreibt Buchstaben), nur
       größer.

       DOPPELTE KLASSE (.avatar.avatar--profil) ist hier notwendig, nicht
       Kosmetik: Die Basisregel .avatar steht im Stylesheet WEITER UNTEN
       (bei den Kontaktlisten) und hat dieselbe Spezifität wie
       .avatar--profil allein – bei Gleichstand gewinnt die spätere
       Regel. Die 72px kamen dadurch nie an, alle drei Verwendungen
       (Profil, Neue Gruppe, Gruppeninfo) rendern bis heute mit den
       42px der Basisregel. Mit zwei Klassen (0-2-0 statt 0-1-0)
       gewinnt diese Regel unabhängig von der Reihenfolge. */
    .avatar.avatar--profil {
      width: 72px; height: 72px;
      font-size: 26px;
    }

    /* Nur der Profil-Tab: 112px statt 72px. Das Foto soll das Erste
       sein, was man wahrnimmt, nicht ein Element unter vielen. Bewusst
       NUR hier – in den beiden Overlays (Neue Gruppe, Gruppeninfo)
       wäre ein 112px-Kreis für den knappen Platz dort zu groß. */
    #profil-avatar.avatar--profil {
      width: 112px; height: 112px;
      font-size: 40px;
    }

    /* Mitwachsen mit dem größeren Kreis – ein 22px-Stift an einem
       112px-Kreis wirkte verloren. */
    #profil-avatar + .profil-foto-upload-btn {
      width: 28px; height: 28px;
      font-size: 13px;
    }

    .profil-foto-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    /* Zentriert den (generischen, s. o.) Foto-Wrapper in Kontexten ohne
       eigenes align-items:center – Neue-Gruppe- und Gruppeninfo-
       Overlay (.overlay-karte ist display:flex ohne align-items,
       Kinder würden sonst über die volle Breite gestreckt). */
    .gruppe-foto-zeile {
      display: flex;
      justify-content: center;
    }

    /* Kleiner Stift-Button, unten rechts über dem Foto-Kreis –
       öffnet den unsichtbaren Datei-Dialog (siehe #profil-foto-input). */
    .profil-foto-upload-btn {
      position: absolute;
      right: -2px; bottom: -2px;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
    }

    .profil-foto-upload-btn:hover { color: #000000; }
    .phone-frame.emotion-an .profil-foto-upload-btn:hover { color: #ffffff; }

    .profil-info { width: 100%; min-width: 0; }

    /* Eigener Name: kein Rahmen, sieht wie normaler Fließtext aus,
       trotzdem editierbar (Klick hinein zum Umbenennen). Schriftschnitt
       wird per JS gesetzt (profilNameSchriftAktualisieren) – zeigt den
       tatsächlichen, aus echten Messdaten gemittelten Zustand, siehe
       eigenerMittelwertAktualisieren weiter unten (JS). */
    .profil-name-eingabe {
      display: block;
      width: 100%;
      background: none;
      border: none;
      outline: none;
      text-align: center;
      /* 32px statt 20px – zusammen mit dem 112px-Foto die dominante
         Ebene. Bei sehr langen Namen (maxlength 24) scrollt das
         Eingabefeld horizontal, wie schon vorher, nur früher. */
      font-size: 32px;
      line-height: 1.15;
      color: #000000;
      padding: 0 0 6px;
      font-family: 'Situra-Medium', 'Inter', sans-serif; /* Fallback, bis JS den echten Schnitt setzt */
    }

    .phone-frame.emotion-an .profil-name-eingabe { color: #ffffff; }

    .profil-name-hinweis {
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }

    /* ── Tagebuch ─────────────────────────────────────────────────
       Aktuelle Werte (Puls/Schlaf) liegen bewusst VOR der "Tagebuch"-
       Überschrift (ganz oben im Profilbereich, direkt unter Foto/
       Name) – die Überschrift steht direkt über den Einträgen/der
       Ansicht, wie gefordert. Zwei Ansichten (Liste/Monat) über einen
       dezenten Pillen-Umschalter (gleiche Optik wie .filter-chip).
       Kopfzeile mit dezentem "+"-Button (öffnet den Composer, sonst
       verborgen), Einträge im Editorial-Stil (großes Datum links,
       Text rechts, statt Kästen).
       Schriftschnitt: alle UI-Texte hier in Situra-Medium – AUSNAHME
       ist das große Datum (Situra-Black, siehe .tagebuch-tag). NICHT
       betroffen ist .tagebuch-text (der eigentliche Eintragstext):
       der bleibt vollständig der reagierenden Wort-für-Wort-Typografie
       überlassen (momentTextRendern/stilAnwenden) – hier absichtlich
       kein statischer font-family-Wert gesetzt. ── */
    /* Werte-Gruppe: drei gleich gebaute Zellen nebeneinander. Damit sie
       als EINE Gruppe lesbar ist, bekommt jede Zelle dieselbe
       Beschriftungsgröße, denselben Innenabstand und dieselbe Breite
       (flex:1) – Unterschiede zwischen den Zellen wären sonst
       Bedeutungsträger, obwohl keiner gemeint ist. */
    .tagebuch-werte {
      flex-shrink: 0;
      display: flex;
      gap: 16px;
      padding: 0 20px var(--profil-abschnitt);
    }

    .tagebuch-werte .sensor-dimension { flex: 1; min-width: 0; gap: 0; }

    /* Gestapelt statt nebeneinander: Bei drei Zellen in einer schmalen
       Spalte stünden Label und Wert sonst gedrängt auf einer Zeile
       (space-between). Übereinander liest sich jede Zelle als Einheit,
       und alle drei Zellen sehen identisch aus. */
    .tagebuch-werte .dimension-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .tagebuch-werte .dimension-label,
    .tagebuch-werte .dimension-wert {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
    }

    /* Zusatzinformation, nicht gleichrangiger Block: Beide Zeilen
       kleiner als bisher (Label 10→9, Wert bleibt klein) und deutlich
       unter dem 32px-Namen. Der Wert steht etwas größer und heller als
       sein Label, damit innerhalb der Zelle die Zahl das Inhaltliche
       ist – zwischen den Zellen bleibt aber alles gleich. */
    .tagebuch-werte .dimension-label {
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--text-3);
    }

    .tagebuch-werte .dimension-wert {
      font-size: 11px;
      color: var(--text-2);
    }

    /* Kein zusätzlicher Abstand nach oben: Den liefert bereits das
       padding-bottom des Schlafgraphen darüber (--profil-abschnitt).
       Beides zu setzen ergäbe 80px und risse den Bereich auseinander.

       KLEBEND am oberen Rand des Scrollbereichs (#tab-profil hat
       overflow-y:auto, ist also selbst der Container): Das löst die
       Überlappung mit dem schwebenden Emotions-Schalter, der unten
       rechts sitzt – sobald die Kopfzeile oben klebt, sind die beiden
       an entgegengesetzten Rändern und können sich nicht mehr
       begegnen. Nebeneffekt, der hier erwünscht ist: Die Hauptaktion
       des Bereichs ("+" für einen neuen Eintrag) bleibt beim Scrollen
       durch lange Tagebuchlisten sichtbar.

       Eigener Hintergrund ist Pflicht, sonst scheinen die Einträge
       beim Vorbeiscrollen durch die Kopfzeile hindurch. padding-top
       ersetzt den Abstand, den vorher der Schlafgraph darüber lieferte
       – im geklebten Zustand liegt darüber nichts mehr.

       z-index:4 hält sie über dem scrollenden Inhalt, aber unter dem
       Emotions-Schalter (z-index:5): Falls sich die beiden doch
       einmal berühren, verdeckt die Kopfzeile den Schalter nicht –
       er trägt das Kernprinzip der App und muss sichtbar bleiben. */
    .tagebuch-kopf {
      position: sticky;
      top: 0;
      z-index: 4;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      /* Label und "+" beieinander am LINKEN Rand statt auseinander-
         gezogen (vorher space-between). Damit verlässt die Hauptaktion
         des Bereichs die rechte Spalte, in der der schwebende
         Emotions-Schalter sitzt – gemessen war das "+" dort an der
         Startansicht nicht anklickbar, weil der Schalter die Klicks
         abfing. Die klebende Kopfzeile allein löste das nicht: Bei
         Scrollposition 0 steht sie naturgemäß tief, also genau in der
         Zone des Schalters. */
      justify-content: flex-start;
      gap: 14px;
      padding: 10px 20px;
      background: var(--bg);
    }

    .tagebuch-kopf-label {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Wiederverwendet exakt dieselbe Optik wie der bestehende
       "+"-Button für neue Gruppen (.neue-gruppe-btn) – dezenter
       Outline-Kreis mit zentriertem "+" statt auffälligem
       Eingabe-Kasten oder freistehendem Symbol. */
    /* Punkt 3: Das Anlegen eines Eintrags ist die Hauptinteraktion
       des Tagebuchs – 26px waren dafür zu leise. Jetzt 40px Kreis mit
       22px Zeichen und voller Kontrastfarbe statt --text-2. Bewusst
       weiterhin Outline und nicht gefüllt: gefüllt wäre ein primärer
       Button (siehe Button-Hierarchie), und der steht in diesem
       Bereich dem "Eintragen" im Composer zu. */
    .tagebuch-neu-btn {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: none;
      color: #000000;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .phone-frame.emotion-an .tagebuch-neu-btn { color: #ffffff; }

    .tagebuch-neu-btn:hover { border-color: var(--text-2); }

    /* [hidden] MUSS hier explizit gewinnen: display:flex oben hat
       dieselbe Spezifität wie die UA-Regel "[hidden] { display:none }"
       und würde sie sonst durch die Reihenfolge im Stylesheet
       überschreiben – der Button bliebe trotz .hidden = true sichtbar. */
    .tagebuch-neu-btn[hidden] { display: none; }

    /* ── Ansicht-Umschalter: Liste / Monat ────────────────────────
       Zusammenhängende Segmented-Control in derselben Pillen-Optik
       wie .filter-chip (Outline-Rahmen, aktiv = gefüllt), nur dezenter
       dimensioniert – passt in die schmale Kopfzeile. ── */
    .tagebuch-ansicht-umschalter {
      flex-shrink: 0;
      display: flex;
      gap: 2px;
      width: fit-content;
      margin: 0 20px 16px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .tagebuch-ansicht-btn {
      background: none;
      border: none;
      color: var(--text-3);
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.02em;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tagebuch-ansicht-btn:hover { color: var(--text-2); }

    .tagebuch-ansicht-btn--aktiv,
    .tagebuch-ansicht-btn--aktiv:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .tagebuch-composer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 20px 16px;
    }

    /* Siehe Kommentar bei .tagebuch-neu-btn[hidden] oben – derselbe
       Spezifitäts-Konflikt, hier für den Composer. */
    .tagebuch-composer[hidden] { display: none; }

    .tagebuch-eingabe {
      width: 100%;
      resize: none;
      background: none;
      border: 1px solid var(--border);
      outline: none;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 14px;
      color: #000000;
      padding: 8px 10px;
    }

    .phone-frame.emotion-an .tagebuch-eingabe { color: #ffffff; }

    .tagebuch-composer-aktionen {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .tagebuch-mehr-btn {
      display: block;
      width: 100%;
      margin-top: 4px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 12px;
      text-align: center;
      padding: 9px 0;
      cursor: pointer;
    }

    .tagebuch-mehr-btn:hover { border-color: var(--text-2); color: #000000; }
    .phone-frame.emotion-an .tagebuch-mehr-btn:hover { color: #ffffff; }

    .tagebuch-liste {
      padding: 4px 20px 20px;
    }

    .tagebuch-liste[hidden] { display: none; }

    /* Editorial-Layout statt Kästen: Datum groß links, Text rechts. */
    .tagebuch-eintrag {
      display: flex;
      gap: 16px;
      padding: 20px 0;
    }

    .tagebuch-datum-spalte {
      flex-shrink: 0;
      width: 76px; /* Platz für zweistellige Tage bei 42px Situra-Black, siehe .tagebuch-tag */
      text-align: center;
    }

    /* Situra-Black (fettester Schnitt) – Datum als klarer Ankerpunkt,
       wie gefordert; einzige Ausnahme von Situra-Medium im Tagebuch-
       Bereich. Reine Darstellung eines gespeicherten Zeitstempels,
       KEIN reaktiver/eingefrorener Zustand – rührt nicht an der
       Wort-für-Wort-Typografie des Eintragstexts daneben.
       WICHTIG zur Größe: Situra-Black ist ein derart extrem fetter
       Schnitt, dass die Ziffern-Innenräume (z. B. bei 0/8) bei kleiner
       Schriftgröße fast vollständig zulaufen und kaum noch
       unterscheidbar sind (im Browser mit vergrößerter Darstellung
       geprüft) – 26px war praktisch unlesbar. 42px ist ein
       Kompromiss: deutlich lesbarer, ohne die Datumsspalte
       unverhältnismäßig groß wirken zu lassen. Der volle Zeitstempel
       bleibt zusätzlich als title-Tooltip erhalten (siehe
       tagebuchEintragRendern, JS). */
    .tagebuch-tag {
      font-family: 'Situra-Black', 'Inter', sans-serif;
      font-size: 42px;
      line-height: 1;
      color: #000000;
    }

    .phone-frame.emotion-an .tagebuch-tag { color: #ffffff; }

    .tagebuch-wochentag {
      margin-top: 3px;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .tagebuch-text {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
      font-size: 16px;
      line-height: 1.5;
      color: #000000;
      overflow-wrap: break-word;
    }

    .phone-frame.emotion-an .tagebuch-text { color: #ffffff; }

    /* Kleiner Hinweis über dem Eintragstext, wenn er bereits in den
       Moment-Bereich geteilt wurde (siehe tagebuchEintragTeilen, JS) –
       rein darstellend, keine reaktive Typografie. */
    .tagebuch-geteilt-hinweis {
      display: block;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 5px;
    }

    /* Teilen-Button: outline = noch nicht geteilt, gefüllt = bereits
       geteilt – dieselbe Filled/Outline-Konvention wie der Emotion-
       Schalter an anderer Stelle der App. */
    .tagebuch-teilen-btn {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 2px;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--text-3);
      background: transparent;
      color: var(--text-3);
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .tagebuch-teilen-btn:hover { border-color: var(--text-2); color: var(--text-2); }

    .tagebuch-teilen-btn--aktiv {
      background: #000000;
      border-color: #000000;
      color: #ffffff;
    }

    .phone-frame.emotion-an .tagebuch-teilen-btn--aktiv {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .tagebuch-leer-hinweis {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
      padding: 8px 0;
    }

    /* ── Schlaf-Verlauf: dauerhaft sichtbar OBERHALB des Tagebuch-
       Bereichs (über der "Tagebuch"-Überschrift), keine der beiden
       Umschalt-Ansichten. Schlichte, handgebaute Linien-Grafik (kein
       Chart-Framework): eine geschwungene SVG-Kurve (Catmull-Rom-
       Glättung, siehe glatterSvgPfad in JS) über kontinuierliche
       Werte 0–100 ("Schlaftiefe/-qualität"), Y-Achse links, X-Achse
       unten, keine Flächenfüllung/Balken/Farbe außer der bestehenden
       Schwarz/Weiß-Palette. Bis genug echte Nächte ausgewertet sind
       (schlafVerlaufLaden), werden die übrigen Tage mit deterministi-
       schen Platzhalterwerten aufgefüllt (tagebuchSchlafPlatzhalter-
       Serie, JS) – jeder bereits ausgewertete echte Tag ersetzt den
       Platzhalter an exakt seinem Datum, die Grafik wächst also
