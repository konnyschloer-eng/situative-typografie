       nahtlos in echte Werte hinein. ── */
    .tagebuch-schlafgraph {
      flex-shrink: 0;
      padding: 0 20px var(--profil-abschnitt);
    }

    .tagebuch-graph-titel {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .tagebuch-graph-karte {
      display: flex;
      gap: 8px;
    }

    .tagebuch-graph-y-achse {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      padding: 2px 0;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .tagebuch-graph-plot {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .tagebuch-graph-svg {
      display: block;
      width: 100%;
      height: 64px;
    }

    .tagebuch-graph-gitter {
      stroke: var(--border-light);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .tagebuch-graph-linie {
      fill: none;
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .phone-frame.emotion-an .tagebuch-graph-linie { stroke: #ffffff; }

    /* Fläche unter der Linie: siehe linearGradient in
       tagebuchSchlafGraphRendern (JS) – dezent getönt oben, zu 0
       Deckkraft unten, damit sie weich in den Hintergrund ausfadet. */
    .tagebuch-graph-flaeche-start { stop-color: #000000; stop-opacity: 0.16; }
    .tagebuch-graph-flaeche-ende  { stop-color: #000000; stop-opacity: 0; }
    .phone-frame.emotion-an .tagebuch-graph-flaeche-start { stop-color: #ffffff; stop-opacity: 0.16; }
    .phone-frame.emotion-an .tagebuch-graph-flaeche-ende  { stop-color: #ffffff; stop-opacity: 0; }

    .tagebuch-graph-x-achse {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 9px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* ── Monatsübersicht: Kalender-Raster der Tagebucheinträge ───────
       Klassische Monatsansicht (Wochentage Mo–So als Spalten, aktueller
       Kalendermonat). Tage mit mindestens einem Eintrag sind über
       .tagebuch-kalender-tag--belegt markiert (Punkt unter der Zahl,
       siehe .tagebuch-kalender-punkt) und klickbar – tagebuchZuEintrag-
       Springen (JS) wechselt dafür in die Listenansicht und scrollt
       zum ersten Eintrag dieses Tages. Rein Schwarz/Weiß, keine
       Flächenfarbe außer der bestehenden --bg-hover beim Hover. ── */
    .tagebuch-monat {
      padding: 12px 20px 20px;
    }

    .tagebuch-monat[hidden] { display: none; }

    .tagebuch-kalender-titel {
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-2);
      text-transform: capitalize;
      margin-bottom: 10px;
    }

    .tagebuch-kalender-kopf,
    .tagebuch-kalender-raster {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .tagebuch-kalender-kopf {
      margin-bottom: 6px;
    }

    .tagebuch-kalender-kopf span {
      text-align: center;
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .tagebuch-kalender-raster { gap: 2px 0; }

    .tagebuch-kalender-tag {
      height: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      border-radius: 50%;
      color: var(--text-3);
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      font-size: 13px;
      cursor: default;
    }

    .tagebuch-kalender-tag--leer { visibility: hidden; }

    .tagebuch-kalender-tag--heute { box-shadow: inset 0 0 0 1px var(--border); }

    .tagebuch-kalender-tag--belegt {
      color: #000000;
      cursor: pointer;
    }

    .phone-frame.emotion-an .tagebuch-kalender-tag--belegt { color: #ffffff; }

    .tagebuch-kalender-tag--belegt:hover { background: var(--bg-hover); }

    .tagebuch-kalender-punkt {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Kurzes, dezentes Aufblitzen, wenn tagebuchZuEintragSpringen
       (JS) per Kalendertag zu einem Eintrag scrollt – reine visuelle
       Orientierungshilfe, keine Zustandsänderung. */
    .tagebuch-eintrag--hervorgehoben { background: var(--bg-hover); }

    .gespraechs-liste {
      flex: 1;
      overflow-y: auto;
    }

    .gespraechs-eintrag {
      display: flex;
      /* center statt stretch: .gespraechs-info enthält jetzt nur noch
         eine Zeile (Name, keine Nachrichtenvorschau mehr) – der Avatar
         bleibt der Höhen-Anker der Zeile, Name + Meta-Spalte werden
         daran vertikal zentriert statt künstlich gestreckt. */
      align-items: center;
      gap: 14px;
      padding: 16px 20px; /* etwas mehr Luft für die jetzt einzeilige, größere Namenszeile */
      cursor: pointer;
      user-select: none;
    }

    .gespraechs-eintrag:hover,
    .gespraechs-eintrag:active {
      background: var(--bg-hover);
    }

    /* ── Profilbild: Kreis mit Anfangsbuchstabe ──────────────────
       Keine Farbe, kein Foto – nur Outline (passend zum Bubble-Look)
       und der Buchstabe. Der Situra-Schnitt (font-family) wird per JS
       gesetzt: er zeigt den auf die 7 Stufen gerundeten, gleitenden
       Mittelwert der für diese Person erfassten Puls-/Zustandswerte,
       nicht den aktuellen Moment. Fallback unten = Wert 500 (Medium). ── */
    .avatar {
      flex-shrink: 0;
      align-self: center; /* bleibt vertikal zentriert, unabhängig vom stretch der Zeile */
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #444;
      background: transparent;
      border: 1px solid var(--bubble-outline);
      font-family: 'Situra-Medium', 'Inter', sans-serif;
      transition: border-color 0.4s ease, color 0.4s ease;
    }

    /* Kleinere Variante für die Chat-Kopfzeile */
    .avatar--chat {
      width: 28px; height: 28px;
      font-size: 12px;
      margin-right: 2px;
    }

    /* Profilfoto statt Buchstabe: nur gesetzt, wenn für die Person
       eine Datei aus avatars-manifest.json geladen werden konnte
       (siehe avatarFotoAktualisieren). Ohne Treffer bleibt der
       Buchstaben-Kreis unverändert. !important nötig, weil sonst die
       spezifischere .phone-frame.emotion-an .avatar-Regel weiter
       unten Buchstabe + Outline auch über dem Foto sichtbar färben
       würde. */
    .avatar--foto {
      background-size: cover;
      background-position: center;
      color: transparent !important;
      border-color: transparent !important;
    }

    .gespraechs-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      /* flex:1 1 0 statt nur min-width:0 – füllt IMMER exakt den
         verbleibenden Platz zwischen Avatar und Meta-Spalte, unabhängig
         von der Textlänge. Dadurch endet .gespraechs-meta in jeder
         Zeile an derselben rechten Kante statt je nach Inhalt zu
         schwanken. */
      flex: 1 1 0;
      min-width: 0;
    }

    .gespraechs-name {
      /* Deutlich größer (vorher 14px) – der Name ist jetzt das
         zentrale Element der Zeile: die typografische Charakteristik
         der Person (Strichstärke/Schnitt per JS, Zittern, Unschärfe
         bei Demo-Kontakten) soll klar im Vordergrund stehen, statt
         von einer Nachrichtenvorschau in den Hintergrund gedrängt zu
         werden. Reagierende Typografie-Logik selbst unverändert –
         reine Größenänderung. */
      font-size: 22px;
      line-height: 1.15;
      color: #000000; /* bleibt konstant – Lesbarkeit */
      font-family: 'Situra-Regular', 'Inter', sans-serif;
    }

    /* Nachrichtenvorschau: nur noch für GRUPPEN in Gebrauch (zeigt dort
       die Mitgliederliste statt einer Nachricht, siehe
       gruppenEintragErstellen) – für 1:1-Kontakte wurde das Element
       komplett entfernt (kein CSS-Verstecken nötig), siehe
       kontaktEintragErstellen weiter unten und die feste HTML-Liste
       oben. */
    .gespraechs-vorschau {
      font-size: 13px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Rechte Spalte: Uhrzeit der letzten Nachricht + Ungelesen-
       Punkt darunter, dezent (kleine Schrift/Punkt, gedeckte Farbe)
       und knapp gruppiert, damit sie den nun deutlich größeren Namen
       nicht überstrahlen. flex-shrink:0 hält die Spalte auf fester
       Breite. Durch align-items:center auf .gespraechs-eintrag (s.o.)
       wird die ganze Spalte (statt einzelner Kinder per space-between)
       vertikal zum Avatar zentriert. ── */
    .gespraechs-meta {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .gespraechs-zeit {
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* Ungelesen-Indikator: statt eines Punkts bekommt die ganze Zeile
       einen Farbverlauf. Heller Modus: bewusst NICHT var(--border) (die
       ist dort warm/beige für echte Trennlinien und ließ den Verlauf
       bräunlich wirken) – stattdessen reines, neutrales Schwarz mit
       sinkender Deckkraft über das ebenfalls neutrale --bg, Richtung
       dunkel (links) → hell (rechts). Dunkler Modus: unverändert, dort
       ist --border bereits neutral (kein Farbstich). */
    .gespraechs-eintrag[data-ungelesen] {
      background: linear-gradient(to right, rgba(0, 0, 0, 0.16), var(--bg));
    }

    .phone-frame.emotion-an .gespraechs-eintrag[data-ungelesen] {
      background: linear-gradient(to left, var(--border), var(--bg));
    }

    /* Die Uhrzeit sitzt rechts, also genau im hellsten Teil des
       Verlaufs (Hellmodus) bzw. im dunkelsten Teil (Dunkelmodus) – das
       normale var(--text-3) (bewusst blass) ist dort zu kontrastarm.
       Feste, starke Kontrastfarbe je Modus statt der blassen Variable. */
    .gespraechs-eintrag[data-ungelesen] .gespraechs-zeit { color: #000000; }
    .phone-frame.emotion-an .gespraechs-eintrag[data-ungelesen] .gespraechs-zeit { color: #ffffff; }


    /* ══════════════════════════════════════════════════════
       ANSICHT 2 – CHAT
       ══════════════════════════════════════════════════════ */

    .kopfzeile {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 12px;
    }

    .kopfzeile-titelzeile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px; /* knapper, damit Sensor-Anzeige sichtbar UNTER "Band verbinden" gruppiert wirkt */
    }

    .kopfzeile-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .zurueck-btn {
      background: none;
      border: none;
      padding: 0 8px 0 0;
      cursor: pointer;
      font-size: 18px;
      color: var(--text-3);
      line-height: 1;
      font-family: inherit;
    }

    .zurueck-btn:hover { color: var(--text-2); }

    .kopfzeile-titel {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Avatar + Name als ein tippbares Element – öffnet bei Gruppen
       die Gruppeninfo; bei 1:1-Chats rein visuell (kein Cursor/Hover). */
    .chat-partner-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      cursor: default;
    }

    .chat-partner-btn--gruppe { cursor: pointer; }
    .chat-partner-btn--gruppe:hover .kopfzeile-titel { color: var(--text-2); }

    .sensor-hinweis {
      font-size: 10px;
      color: var(--text-4);
      letter-spacing: 0.04em;
      font-style: italic;
    }

    /* 2×2-Raster für die 4 Dimensionen */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
    }

    .sensor-dimension { display: flex; flex-direction: column; gap: 3px; }

    .dimension-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .dimension-label {
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dimension-label--live { color: var(--text-2); }

    .dimension-label--live::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-3);
      margin-right: 4px;
      vertical-align: middle;
      animation: pulsieren 2s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    .dimension-wert {
      font-size: 10px;
      color: var(--text-4);
      font-variant-numeric: tabular-nums;
    }

    /* Sensor-Anzeige: Der Regler liegt hier in einer EIGENEN Zeile
       unter der Kopfzeile (.dimension-slider, width:100%) – er kann
       durch die Wertbreite also gar nicht verrutschen. Trotzdem eine
       feste Breite, damit die Zahl beim Zählen nicht seitlich wandert:
       Die Kopfzeile steht auf space-between, ohne feste Breite rückt
       die linke Kante des Werts bei jedem Stellenwechsel nach.

       9ch deckt den längsten Inhalt ab – das ist nicht die dreistellige
       Zahl, sondern die Schlafstufe "sehr gut" (8 Zeichen).

       BEWUSST auf .sensor-grid eingegrenzt: Dieselbe Klasse trägt auch
       die drei Werte im Profil, die untereinander in eigenen Zellen
       stehen. Eine feste Breite würde deren Satzbild zerreißen. */
    .sensor-grid .dimension-wert {
      flex: 0 0 auto;
      width: 9ch;
      text-align: right;
      white-space: nowrap;
    }

    .dimension-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%; height: 2px;
      background: var(--border);
      border-radius: 1px;
      outline: none;
      cursor: pointer;
    }

    .dimension-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .dimension-slider::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    .dimension-balken-spur {
      width: 100%; height: 2px;
      background: var(--border-light);
      border-radius: 1px;
      overflow: hidden;
    }

    .dimension-balken {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.15s ease;
    }

    .dimension-endpunkte {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--text-4);
      letter-spacing: 0.03em;
    }

    /* ── Sensor-Anzeige (Intensität/Tempo/Stabilität/Temperatur):
       ein-/ausfahrbar an derselben Stelle statt dauerhaft sichtbar –
       exakt dieselbe Auf-/Zuklapp-Mechanik wie .test-drawer unten
       (grid-template-rows 0fr → 1fr), nur eigene Klassen, damit beide
       Schubladen unabhängig voneinander auf-/zuklappen. Standardmäßig
       eingeklappt, nur der Griff ist sichtbar. ── */
    /* Rechtsbündig statt zentriert: steht dadurch klein und sichtbar
       direkt UNTER dem "Band verbinden"-Button (der ebenfalls rechts
       sitzt, siehe .band-steuerung), statt als eigene, mittige Zeile
       über die ganze Kopfzeilenbreite zu wirken. */
    .info-drawer-griff {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      width: 100%;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      cursor: pointer;
      padding: 3px 0;
    }

    .info-drawer-griff:hover { color: var(--text-2); }

    /* Auf-/Zuklapp-Pfeil als reines Schriftzeichen (Situra, wie der
       übrige Text) statt SVG-Chevron – konsequent zum Konzept "Typografie
       statt Icons". ">" liegend (90°) zeigt geschlossen nach unten
       ("aufklappen"), gedreht (-90°) im offenen Zustand nach oben
       ("zuklappen") – exakt dieselbe Zeigerichtung/Animation wie zuvor
       der um 180° gedrehte SVG-Chevron. */
    .info-drawer-pfeil {
      display: inline-block;
      transform: rotate(90deg);
      transition: transform 0.4s cubic-bezier(.4, 0, .2, 1);
    }

    .info-drawer.offen .info-drawer-pfeil {
      transform: rotate(-90deg);
    }

    .info-drawer-inhalt {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s cubic-bezier(.4, 0, .2, 1);
    }

    .info-drawer.offen .info-drawer-inhalt {
      grid-template-rows: 1fr;
    }

    .info-drawer-inneres {
      min-height: 0;
      overflow: hidden;
      padding-top: 10px;
    }

    /* ── Test-/Demo-Panel: ein-/ausfahrbares Dropdown ──────────
       Liegt bewusst INNERHALB der Sensor-Anzeige (siehe HTML –
       .test-drawer ist Kind von .info-drawer-inneres), nicht mehr
       als eigenständiger, immer sichtbarer Griff daneben: der
       Test-Eingaben-Griff selbst wird erst sichtbar, wenn die
       Sensor-Anzeige aufgeklappt ist. Standardmäßig trotzdem
       zusätzlich eingeklappt (eigener .offen-Zustand). Das Panel
       fährt von oben (unterhalb des Griffs) sanft nach unten aus
       (grid-template-rows 0fr → 1fr = flüssige Höhen-Animation ohne
       feste Pixel-Höhe). ── */
    .test-drawer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .test-drawer-griff {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      cursor: pointer;
      padding: 3px 0;
    }

    .test-drawer-griff:hover { color: var(--text-2); }

    /* Reines Schriftzeichen statt SVG-Chevron – siehe Kommentar bei
       .info-drawer-pfeil weiter oben, identisches Prinzip. */
    .test-drawer-pfeil {
      display: inline-block;
      transform: rotate(90deg);
      transition: transform 0.4s cubic-bezier(.4, 0, .2, 1);
    }

    .test-drawer.offen .test-drawer-pfeil {
      transform: rotate(-90deg);
    }

    .test-drawer-inhalt {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s cubic-bezier(.4, 0, .2, 1);
    }

    .test-drawer.offen .test-drawer-inhalt {
      grid-template-rows: 1fr;
    }

    /* min-height:0 ist nötig, damit das Grid-Kind auf 0 kollabieren
       kann (sonst verhindert der Inhalt selbst das Zuklappen). */
    .test-drawer-inneres {
      min-height: 0;
      overflow: hidden;
      padding-top: 12px;
    }

    .test-panel-label {
      display: block;
      font-size: 9px;
      color: var(--text-4);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-style: italic;
      margin-bottom: 8px;
    }

    .test-badge {
      font-style: italic;
      font-size: 9px;
      color: var(--text-4);
      text-transform: none;
      letter-spacing: 0;
      margin-left: 4px;
    }

    /* ── "Neue Person": setzt beide Grundlinien zurück ──
       Bewusst zurückhaltend statt als Gefahren-Knopf: Der Vorgang ist
       nicht zerstörerisch, die Grundlinien bauen sich in rund vier
       Minuten neu auf. */
    .test-neue-person-hinweis {
      display: block;
      font-size: 9px;
      color: var(--text-4);
      font-style: italic;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ── Chat-Verlauf ─────────────────────────────────── */
    .chat-bereich {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      align-items: center;
      gap: 24px;
    }

    /* Gleiche Spezifität wie die UA-Regel "[hidden] { display:none }"
       (siehe Kommentar bei .tagebuch-neu-btn[hidden] weiter unten) –
       erst durch den räumlichen Gruppenraum wird #chat überhaupt per
       hidden-Attribut umgeschaltet (siehe zeigeChat/zeigeGruppenChat,
       JS), vorher bestand diese Lücke nie sichtbar. */
    .chat-bereich[hidden] { display: none; }

    .nachricht {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-width: 0;
      /* --einblenden-dauer wird per JS auf eigene Nachrichten gesetzt (Tempo) */
      animation: einblenden var(--einblenden-dauer, 0.5s) ease-out forwards;
    }

    /* Einzelne Buchstaben im Zitter-Modus benötigen inline-block,
       damit transform darauf wirkt (inline-Elemente ignorieren transform). */
    .zitter-buchstabe {
      display: inline-block;
    }

    /* ── Blase als EINE durchgehende Kontur (Körper + Spitze) ──────────
       KORREKTUR (Umbau von border+Dreieck-Pseudoelement auf clip-path):
       die alte Technik zeichnete den Blasenkörper über "border" und die
       Spitze über ein zusätzliches, separat positioniertes Dreieckspaar
       (::before/::after) – zwei GRUNDVERSCHIEDENE Zeichenwege, die an der
       Nahtstelle (Übergang Rundung → Spitze) nie exakt zusammenfinden;
       in Vergrößerung war dort immer ein sichtbarer Versatz/Ansatz zu
       erkennen. Neue Lösung, identisch zum bereits bewährten Muster im
       Gruppenraum (siehe .raum-nachricht weiter unten, ausführliche
       Herleitung dort): GENAU EIN clip-path je Ebene bildet Körper UND
       Spitze als einzige, zusammenhängende Silhouette. Zwei ineinander-
       liegende Ebenen (::before außen in Kontur-Farbe, ::after 1px
       kleiner innen in Hintergrundfarbe) ergeben zusammen den 1px-Strich,
       der der GESAMTEN Form folgt statt nur dem rechteckigen Blasenkörper.
       .text selbst bleibt unsichtbar (reine Text-Ebene) – border/
       border-radius entfallen deshalb komplett, z-index:0 öffnet einen
       eigenen Stapelkontext, damit die negativ gestapelten Ebenen INNER-
       HALB dieser Blase bleiben statt hinter einen entfernteren Vorfahren
       zu "entkommen" (siehe ausführliche Begründung bei .raum-nachricht).

       KORREKTUR (echte Rundungen statt Facetten): clip-path: polygon()
       kennt NUR gerade Linien zwischen den Punkten – die vorherige
       4-Punkte-Viertelkreis-Näherung pro Ecke war deshalb in Wirklichkeit
       ein Achteck-Ausschnitt und zeigte bei genauerem Hinsehen sichtbar
       ABGESCHRÄGTE statt weich gerundete Ecken. clip-path: path(...) MIT
       echten Kurvenbefehlen (hier: quadratische Bézier "Q") behebt das –
       kann aber nur ABSOLUTE Pixel-Koordinaten (keine Prozente/calc()),
       muss die tatsächliche, erst zur Laufzeit bekannte Blasengröße also
       aus JS bekommen: --blase-radius/--blase-spitze/--blase-versatz
       (Design-Token-Variablen, siehe unten) legen die ZIEL-Maße fest,
       blasenKonturAktualisieren (JS, siehe dort) liest sie aus, misst die
       tatsächlich gerenderte Blasengröße (ResizeObserver hält das bei
       jeder Größenänderung – z. B. während der font-size-Transition beim
       Moduswechsel einer großen Gruppen-Zone – synchron) und schreibt
       den fertigen SVG-Pfad in --blase-aussen/--blase-innen (per
       CSS-Variable statt style-Zugriff, weil ::before/::after aus JS
       nicht direkt ansprechbar sind – Custom Properties vererben sich
       aber normal an Pseudoelemente). Dieselbe Funktion fixiert im
       selben Aufwasch auch die max-width jeder einzelnen .wort-Spanne in
       echten Pixeln (siehe .wort, CSS, und die Funktion selbst für die
       Begründung – behebt das separate "Wort bricht mitten im Wort um"-
       Problem). --andere und --ich teilen sich jetzt dieselben Regeln
       (kein eigener gespiegelter Punktesatz mehr nötig): die Spiegelung
       steckt in der von JS berechneten Pfad-STRING selbst. */
    .nachricht-andere .text,
    .nachricht-ich .text {
      --blase-radius: 18px;
      --blase-spitze: 12px;
      --blase-versatz: 16px;
      color: #000000; /* wie eigene Nachrichten – nur die Outline unterscheidet den Absender */
      font-variation-settings: 'wght' 400;
      display: inline-block;
      max-width: 88%;
      background: transparent;
      padding: 18px 24px;
      position: relative;
      z-index: 0;
    }

    /* Gemeinsamer Ebenen-Reset für beide Konturen (Absender-Richtung
       steckt nur noch im per JS berechneten Pfad, nicht mehr in eigenen
       Rand-Eigenschaften). transition hier (nicht am Elternelement,
       siehe .nachricht-andere/.nachricht-ich .text oben): Pseudoelemente
       erben KEINE transition-Deklaration ihres Elternelements und werden
       von der globalen ".phone-frame *"-Regel (MODUSWECHSEL-TRANSITION,
       siehe dort) NICHT erfasst (der Universalselektor "*" matcht nur
       echte Elemente) – ohne diese eigene Zeile würde die Konturfarbe
       beim Emotion-Moduswechsel abrupt statt weich umspringen. */
    /* ══════════════════════════════════════════════════════════════
       SPRECHBLASEN-KONTUR – ein einziger gestrichener SVG-Pfad.

       Erzeugt in blasenKonturAktualisieren (JS, siehe dort für die
       ausführliche Begründung). Ersetzt die frühere Konstruktion aus
       zwei clip-path-Ebenen, bei der die Unterkante rechnerisch 0px
       statt 1px breit war.

       fill übernimmt die Aufgabe der früheren inneren Ebene (Blasen-
       Hintergrund), stroke die der äußeren (Kontur) – EIN Element
       statt zwei Pseudoelementen.

       overflow: visible, weil der Strich mittig auf der Kurve liegt
       und damit ein halbes Pixel über die viewBox hinausragt.
       ══════════════════════════════════════════════════════════════ */
    .phone-frame { --blase-strich: rgba(0, 0, 0, 0.7); }
    .phone-frame.emotion-an { --blase-strich: rgba(255, 255, 255, 0.7); }

    .blase-kontur {
      position: absolute;
      left: 0; top: 0;
      overflow: visible;
      pointer-events: none;
      z-index: -1;
    }

    .blase-kontur path {
      fill: var(--bg);
      stroke: var(--blase-strich);
      stroke-width: 1;
      /* Hält die Strichstärke unabhängig von einer etwaigen Skalierung
         der viewBox exakt bei 1px – hier ist die Abbildung zwar 1:1,
         aber die Blase wird bei Moduswechseln in Gruppen-Zonen per
         font-size-Transition umgerechnet. */
      vector-effect: non-scaling-stroke;
      /* Runde Ecke an der Spitze: Ein spitzer Winkel würde mit dem
         Standard-Verbinder (miter) einen langen Dorn erzeugen. */
      stroke-linejoin: round;
      transition: fill 0.4s ease, stroke 0.4s ease;
    }



    /* Zeilenumbruch + große zentrale Darstellung.
       KORREKTUR ("Hallo" bricht mitten im Wort um, obwohl reichlich Platz
       da wäre): word-break:break-word entfernt – per Spezifikation ist
       das NICHT dasselbe wie overflow-wrap:break-word, sondern entspricht
       word-break:normal + overflow-wrap:ANYWHERE. "anywhere" fließt (im
       Gegensatz zu "break-word", das nachweislich nur als allerletzter
       Ausweg greift) in die INTRINSISCHE Breitenberechnung mit ein – der
       Browser darf die Wort-Box dadurch schon beim Ermitteln ihrer
       bevorzugten (shrink-to-fit-)Breite kleiner ansetzen, als sie
       eigentlich bräuchte, weil er ein Umbrechen "irgendwo" jederzeit für
       zulässig hält. word-break ist zudem eine VERERBTE Eigenschaft und
       wirkte dadurch bis auf .wort weiter (siehe .wort, CSS) – genau dort
       sollte ausschließlich das eigene, bewusst zurückhaltende
       overflow-wrap:break-word gelten (nur allerletzter Ausweg bei
       einem einzelnen, wirklich zu langen Wort). overflow-wrap:break-word
       hier allein reicht als Sicherheitsnetz für den Fallback-Textpfad
       ohne .wort-Spans (siehe nachrichtElementErstellen, JS) bereits aus. */
    .nachricht .text {
      font-size: 30px;
      line-height: 1.35;
      /* Linksbündig, nicht zentriert: Bei mehrzeiligen Nachrichten
         erzeugt Zentrierung unruhige Zeilenanfänge, und eine letzte
         Zeile mit nur einem Wort steht verloren in der Mitte. Die BLASE
         bleibt davon unberührt – sie ist inline-block mit
         shrink-to-fit, ihre Breite ergibt sich aus der längsten Zeile
         und ändert sich durch die Ausrichtung des Inhalts nicht. Auch
         die Kontur (siehe .blase-kontur) wird aus der gemessenen
         Blasengeometrie gezeichnet, nicht aus den Zeilen. */
      text-align: left;
      overflow-wrap: break-word;
      min-width: 0;
    }

    /* Jedes Wort als eigene Box: trägt seinen EIGENEN eingefrorenen
       Dimensions-Zustand (siehe JS: wortZustaende). inline-block hält
       das Wort als Einheit zusammen; bricht nur um, wenn es selbst
       breiter als die verfügbare Zeile ist (z. B. sehr lange Wörter).
       KORREKTUR ("Wort bricht mitten im Wort um, obwohl reichlich Platz
       da wäre"): max-width:100% hier ist nur der FALLBACK, bevor JS
       läuft. Ein Prozentwert gegen ein Elternelement, dessen eigene
       Breite selbst per shrink-to-fit (inline-block ohne explizite
       Breite, siehe .text/.raum-nachricht) aus IHREM Inhalt berechnet
       wird, löst Chromium beim ERSTEN Layout nach einem Größensprung
       (z. B. Wachsen einer Zone zur großen Bühnen-Blase) nachweislich
       nicht zuverlässig neu auf – der Prozentsatz blieb dabei am alten,
       zu schmalen Wert hängen, sichtbar als Wort, das mitten im Wort
       umbricht. blasenKonturAktualisieren (JS, siehe dort) überschreibt
       max-width hier deshalb IMMER per Inline-Style mit einem echten
       Pixelwert (= tatsächliche Content-Breite der Blase), sobald die
       Blase im DOM steht bzw. sich ihre Größe ändert – Inline-Style
       gewinnt automatisch gegen diese Klassenregel, keine !important
       nötig. */
    .wort {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: break-word;
      /* Explizit gegen ein evtl. geerbtes word-break:break-word eines
         Vorfahren (siehe Korrektur bei .nachricht .text) abgesichert –
         DAS entspricht per Spezifikation overflow-wrap:ANYWHERE (bricht
         schon bei der Breitenberechnung, nicht erst als letzter Ausweg)
         und würde hier genau das ungewollte "bricht mitten im Wort trotz
         Platz"-Verhalten auslösen. Nur das eigene, bewusst zurück-
         haltende overflow-wrap:break-word oben soll hier je greifen. */
      word-break: normal;
    }

    /* Absender-Label oberhalb der Nachricht */
    .nachricht-absender {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
      user-select: none;
    }

    /* Dezenter Status-Indikator unterhalb jeder eigenen Nachricht.
       "e" = emotionale Typografie war beim Senden aktiv.
       Leer = neutral/leblos gesendet (Abwesenheit ist das Signal). */
    .nachricht-status {
      font-size: 13px;
      line-height: 1;
      margin-top: 16px;
      color: var(--text-2);          /* sichtbar in beiden Farbmodi */
      font-style: italic;            /* kleines "e" wirkt leichter als Regular */
      letter-spacing: 0;
      user-select: none;
    }

    .nachricht-ich .nachricht-status { text-align: center; }

    /* Empfangene Nachrichten: Kennzeichen linksbündig unter der Blase,
       passend zur Ausrichtung der Nachricht selbst. */
    .nachricht-andere .nachricht-status { text-align: left; }

    @keyframes einblenden {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Zitter-Keyframes werden dynamisch per JS erzeugt (ein Keyframe pro
       Buchstabe, zufällige Werte). Kein statischer @keyframes-Block nötig. */

    /* ══════════════════════════════════════════════════════════════
       GRUPPEN-RAUM – räumliche Darstellung des Gruppenchats (siehe
       JS-Abschnitt "GRUPPEN-RAUM" weiter unten). Komplett eigener
       Selektor-Namensraum (.raum-*) – überschneidet sich mit keiner
       bestehenden .nachricht- bzw. .chat-bereich-Regel oben, der
       1:1-Chat bleibt davon unberührt. .wort/.zitter-buchstabe (siehe
       oben) werden von der reagierenden Typografie unverändert
       wiederverwendet. ══════════════════════════════════════════ */
    .raum-bereich {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--bg);
      overflow: hidden;
      position: relative;
    }

    /* Gleiche Spezifität wie die UA-Regel "[hidden] { display:none }"
       (siehe Kommentar bei .tagebuch-neu-btn[hidden] weiter unten) –
       muss hier explizit gewinnen, sonst bliebe der Raum trotz
       hidden-Attribut als Flex-Spalte sichtbar. */
    .raum-bereich[hidden] { display: none; }

    /* Eine "Zeile" der räumlichen Anordnung (siehe raumZeilenAufbauen, JS)
       – ein horizontaler Flex-Container mit einer festen Teilmenge der
       Zonen. Jede Zeile ist ein UNABHÄNGIGER Flex-Kontext (Spalten
       müssen sich nicht über Zeilen hinweg ausrichten). --zeilen-gewicht
       (Default 1 = neutral) steuert die HÖHE dieser Zeile relativ zu den
       übrigen Zeilen (siehe raumZeilenGewichteSetzen, JS): die Zeile mit
       dem Verschmelzungs-Container (siehe .raum-merge weiter unten)
       bekommt ein größeres Gewicht, alle reinen Einzelzonen-Zeilen ein
       kleineres – dadurch wird der gemeinsame Gesprächsraum groß, der
       Rest schrumpft entsprechend (Punkt 3 der Anforderung). transition
       NACH der MODUSWECHSEL-TRANSITION-Regel notiert (siehe dort). */
    .raum-zeile {
      display: flex;
      flex-direction: row;
      flex: var(--zeilen-gewicht, 1) 1 0;
      min-height: 0;
      gap: 1px;
    }

    .raum-zone {
      background: var(--bg);
      /* Trennlinie zwischen den Zonen sitzt als Inset-Schatten AUF der
         Zone selbst (statt als Hintergrundfarbe auf .raum-bereich/
         .raum-zeile) – so bleibt sie exakt 1px fein, unabhängig von der
         tatsächlichen Zonengröße. Sprechen zwei (oder mehr) Personen
         miteinander, gibt es zwischen ihnen gar keine zwei Zonen mehr,
         die sich eine Kante teilen könnten – sie sind dann EIN einziges
         .raum-merge-Element (siehe dort) – die Trennlinie "verschwindet"
         dadurch automatisch, ganz ohne eigene Ein-/Ausblend-Regel. */
      box-shadow: inset 0 0 0 1px var(--border-light);
      display: flex;
      flex-direction: column;
      /* Alle Zonen EINER Zeile teilen sich den verfügbaren Platz gleich
         (die Größen-Hervorhebung sitzt jetzt auf der Zeile, siehe
         .raum-zeile --zeilen-gewicht oben, nicht mehr pro Zone). */
      flex: 1 1 0;
      /* Mindestgröße (passive Zonen dürfen nicht faktisch verschwinden):
         Flexbox unterschreitet min-width/-height nicht, auch wenn eine
         geschrumpfte Zeile rechnerisch eine kleinere Höhe ergäbe – Name
         und mindestens eine verkleinerte Nachricht bleiben dadurch immer
         erkennbar. */
      min-width: 96px;
      min-height: 72px;
      padding: 10px 12px;
      overflow: hidden;
      position: relative;
      /* Bezugsrahmen für die cqw-Schriftskalierung in .raum-nachricht/
         .raum-zone-name (Schrift soll proportional zur TATSÄCHLICHEN
         Zonengröße wachsen/schrumpfen – dadurch wächst die Schrift im
         Verschmelzungs-Container ganz von selbst mit, sobald die Zeile
         größer wird, ohne eigene Regel dafür). */
      container-type: inline-size;
    }

    /* Frisch erzeugte Zonen/Verschmelzungs-Container (siehe raumZone-
       Erzeugen/raumMergeErzeugen, JS) starten unsichtbar und blenden
       sich erst NACH einem gerenderten Frame ein (Klasse wird dann per
       JS entfernt) – ohne diesen Zwischenschritt hätte die opacity-
       transition (siehe .raum-zone weiter unten, MODUSWECHSEL-Block)
       keinen "Vorher"-Wert, von dem sie interpolieren könnte, und das
       Erscheinen wäre abrupt statt weich. */
    .raum-eintretend { opacity: 0; }

    /* "Du" landet unabhängig von Personenzahl immer in der letzten
       Zeile (siehe raumZonenAufbauen, JS: füllt die letzte Mitglieder-
       Zeile auf oder bekommt eine eigene) und dort rechtsbündig. */
    .raum-zone--du {
      align-items: flex-end;
      text-align: right;
    }

    .raum-zone-name {
      flex-shrink: 0;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .raum-zone-nachrichten {
      flex: 1;
      /* Korrektur – MUSS unabhängig vom align-items der Zone immer die
         volle Zonenbreite bekommen (align-self überschreibt gezielt nur
         dieses eine Element): .raum-zone--du setzt zonenweit align-
         items:flex-end (rechtsbündige Namens-Ausrichtung) – ohne dieses
         align-self würde dieser Nachrichten-Stapel dadurch NICHT mehr
         gestreckt, sondern schrumpfte auf die Breite seines eigenen
         Inhalts (Fit-Content) und würde rechtsbündig verankert. Damit
         hätte max-width:100% in .raum-nachricht keine definite Bezugs-
         breite mehr zum Umbrechen – eine lange Nachricht bliebe einzeilig
         und ragte, da rechts verankert, weit über den LINKEN Zonenrand
         hinaus (genau der gemeldete "Nachricht ragt heraus"-Fehler, hier
         zusätzlich zur Ursache in .raum-zone--du sichtbar geworden). */
      align-self: stretch;
      min-height: 0;
      display: flex;
      flex-direction: column;
      /* Korrektur – KEIN justify-content:flex-end mehr: überschreitet
         der Inhalt (z. B. zwei lange Testnachrichten in einer schmalen
         Zone) die verfügbare Höhe, hängt bei flex-end-Ausrichtung der
         Überlauf am ANFANG (oben) – das ragte dort sichtbar über den
         Zonenrand hinaus. Stattdessen normale Lesereihenfolge (älteste
         oben) + Scroll-zum-Ende in raumNachrichtHinzufuegen (JS, analog
         zum bestehenden "chat.scrollTop = chat.scrollHeight" im
         1:1-Chat) – dadurch bleibt IMMER die neueste Nachricht sichtbar,
         und bei Überlauf ist die ältere per Scroll (overflow-y:auto
         unten) trotzdem vollständig erreichbar statt einfach
         abgeschnitten oder herausragend. */
      /* flex-start (Default) nötig, seit .raum-nachricht eine sichtbare
         Sprechblasen-Outline hat (siehe unten) – sonst würde die Blase
         auf die volle Zonenbreite gestreckt, unabhängig von der
         tatsächlichen Textlänge. Bei reinem Text (vorher) fiel das
         mangels sichtbarem Rand nicht auf. */
      align-items: flex-start;
      gap: 6px;
      /* Korrektur – Nachrichten dürfen nie aus der Zone herausragen:
         übersteigt der Inhalt (z. B. ein langer Testtext in einer
         kleinen/klein gewichteten Zone) die verfügbare Höhe, wird HIER
         gescrollt statt dass .raum-zone (overflow:hidden) den Text
         sichtbar abschneidet – bleibt so immer vollständig lesbar, ohne
         die Zonengröße selbst zu sprengen. Scrollbalken-Optik siehe
         gemeinsamer SCROLLBALKEN-Block ganz oben (.raum-zone-nachrichten
         dort mit aufgenommen). overflow-x explizit hidden (nicht default
         "visible" belassen): wird nur overflow-y gesetzt, rechnet der
         Browser das offene overflow-x automatisch zu "auto" um (CSS-
         Overflow-Spezifikation). Exakt dasselbe Muster wie .chat-bereich
         im 1:1-Chat. */
      overflow-y: auto;
      overflow-x: hidden;
    }

    .raum-zone--du .raum-zone-nachrichten { align-items: flex-end; }

    /* Große Zone (aktive Person solo ODER gemeinsamer Verschmelzungs-Raum,
       siehe raumGrossEl/.raum-zone--gross, JS): Nachrichten sollen nicht
       weiter oben in der Zeilenreihenfolge/unten in der Ecke kleben,
       sondern vertikal MITTIG im jetzt großen, verfügbaren Raum stehen –
       "safe center" fällt automatisch auf normalen Scroll-Start zurück,
       sobald mehr Nachrichten da sind, als vertikal hineinpassen (exakt
       dasselbe Muster wie .chat-bereich im 1:1-Chat, siehe dort), statt
       wie reines "center" den Anfang UND das Ende abzuschneiden. Gilt für
       BEIDE große Formen (Solo-Zone wie Verschmelzungs-Raum) – betrifft
       nur die VERTIKALE Verteilung des gesamten Nachrichten-Stapels; die
       links/rechts-Unterscheidung PRO einzelner Nachricht (wer spricht,
       siehe .raum-eintrag--ich/--andere weiter unten) bleibt im
       Verschmelzungs-Raum davon unberührt. */
    .raum-zone--gross .raum-zone-nachrichten { justify-content: safe center; }

    /* Nur in der SOLO großen Zone (ein einzelner Absender, kein
       gemeinsamer Raum – :not(.raum-merge) grenzt das ab) zusätzlich
       horizontal zentriert, ganz analog zum 1:1-Chat (siehe .chat-bereich
       weiter oben): Typografie soll dort das dominante Element sein.
       Höhere Spezifität als .raum-zone--du .raum-zone-nachrichten oben
       (3 statt 2 Klassen), gewinnt daher auch für die eigene ("Du")
       große Solo-Zone. Im Verschmelzungs-Raum bleibt links/rechts bewusst
       erhalten (einzige Unterscheidung, wer spricht, siehe Kommentar
       oben) – text-align:center für BEIDE großen Formen gemeinsam sitzt
       bei .raum-zone--gross .raum-nachricht weiter unten (die Blase
       selbst ist dort ohnehin für Solo UND Verschmelzungs-Raum gleich
       groß, siehe dort). */
    .raum-zone--gross:not(.raum-merge) .raum-zone-nachrichten { align-items: center; }

    /* Verschmelzungs-Container (siehe .raum-merge weiter unten): hier
       sprechen mehrere Personen im selben Bereich, jede Nachricht muss
       sich EINZELN nach links oder rechts ausrichten (siehe .raum-
       eintrag--ich/--andere unten, align-self) statt einheitlich wie in
       einer Einzelzone – deshalb hier NEUTRAL "stretch" statt flex-start/
       -end. Nach .raum-zone-nachrichten notiert, gewinnt bei gleicher
       Spezifität (beide Klassen sitzen gemeinsam auf demselben Element,
       siehe raumMergeErzeugen, JS) durch die spätere Stelle im
       Stylesheet. */
    .raum-merge-nachrichten {
      align-items: stretch;
      /* KORREKTUR – Blasen überlappten sich: die geerbte gap:6px (siehe
         .raum-zone-nachrichten weiter oben) war für die kompakte Zonen-
         Darstellung bemessen. Im Verschmelzungs-Raum ragt die Spitze
         jeder großen Blase 12px nach unten heraus (siehe .raum-merge-
         nachrichten .raum-nachricht weiter unten) – 6px Abstand reichte
         dadurch nicht, die zweite Blase lag über der Spitze der ersten.
         28px = 12px Spitzenlänge + spürbarer Rest-Abstand, verhindert
         jede Überschneidung unabhängig von der tatsächlichen Bläschen-
         höhe (variiert durch unterschiedlich langen Text). */
      gap: 28px;
    }

    /* Ein "Eintrag" bündelt optionales Absender-Label + Sprechblase
       (siehe raumNachrichtHinzufuegen, JS) und ist selbst das Element,
       das sich ausrichtet – in einer Einzelzone übernimmt es einfach die
       align-items-Ausrichtung der Zone (s.o.), im Verschmelzungs-
       Container richtet sich dagegen JEDER Eintrag EINZELN aus: "Du"
       rechts, alle anderen links – exakt dasselbe Links/Rechts-Prinzip
       wie .raum-zone--du vs. übrige Zonen, nur jetzt pro Nachricht statt
       pro Zone, weil mehrere Personen denselben Bereich teilen. */
    .raum-eintrag {
      display: flex;
      flex-direction: column;
      max-width: 100%;
    }
    .raum-eintrag--ich    { align-self: flex-end;   align-items: flex-end; }
    .raum-eintrag--andere { align-self: flex-start; align-items: flex-start; }

    /* In der großen SOLO-Zone (siehe .raum-zone--gross weiter oben) trägt
       nur eine einzige Person vor – "Du" links/rechts zu unterscheiden
       gibt es dort nichts, deshalb hier bewusst zentriert statt des
       links/rechts-Prinzips von .raum-eintrag--ich/--andere oben (das
       bleibt für den Verschmelzungs-Raum unverändert bestehen, siehe
       :not(.raum-merge) unten). align-self auf .raum-eintrag selbst
       überschreibt sonst IMMER das align-items der Zone (s.o.) – ohne
       diese Regel bliebe die Nachricht trotz zentrierter Zone optisch in
       der rechten/linken Ecke hängen.
       KORREKTUR ("Wort bricht mitten im Wort um") – width:100% hier
       ergänzt (exakt wie beim gleich gelagerten .raum-merge-nachrichten
       .raum-eintrag--ich/--andere weiter unten, das dieses Problem nie
       hatte): OHNE eine feste Breite ist .raum-eintrag hier selbst
       shrink-to-fit (align-items:center statt stretch) und übernimmt
       dabei die Breite der Blase – die Blase wiederum begrenzt sich
       selbst auf max-width:88% GENAU DIESES .raum-eintrag (siehe
       .raum-zone--gross .raum-nachricht weiter unten). Zwei ineinander
       verschachtelte shrink-to-fit-Elemente, deren Breiten sich
       GEGENSEITIG über einen Prozentsatz < 100% begrenzen, haben
       rechnerisch nur EINEN stabilen Fixpunkt: 0 – jede Neuberechnung
       (z. B. durch den ResizeObserver in blasenKonturAktualisieren, JS)
       konvergiert dadurch schrittweise gegen immer schmalere Werte, bis
       Wörter mitten im Wort umbrechen. width:100% macht .raum-eintrag
       stattdessen zu einer FESTEN Bezugsgröße (100% der stabilen,
       tatsächlichen Zonenbreite) – die 88%-Grenze der Blase hat dann
       einen echten, nicht-zirkulären Bezugspunkt. */
    .raum-zone--gross:not(.raum-merge) .raum-eintrag--ich,
    .raum-zone--gross:not(.raum-merge) .raum-eintrag--andere {
      align-self: center;
      align-items: center;
      width: 100%;
    }

    /* Absender-Name über einer Nachricht – NUR im Verschmelzungs-
       Container gesetzt, und dort auch nur, sobald mehr als zwei
       Personen mitreden (siehe raumNachrichtHinzufuegen, JS): bei genau
       zwei Personen ist die Zuordnung durch links/rechts bereits
       eindeutig (identisch zum bisherigen Zonen-Prinzip), ein Name wäre
       dort nur redundant. */
    .raum-eintrag-sender {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 2px;
    }

    /* "e"-Kennzeichen unter eigenen Nachrichten ("Du"), analog zu
       .nachricht-status im 1:1-Chat (siehe dort für die vollständige
       Begründung) – fehlte im Gruppenraum komplett. Gleiche Bedeutung:
       "e" sichtbar = emotionale Typografie war beim Senden aktiv, leer =
       neutral/leblos gesendet (Abwesenheit ist das Signal, siehe JS,
       raumNachrichtHinzufuegen). Sitzt als eigenes Element NACH der
       Blase im selben .raum-eintrag-Wrapper – align-items der Zone/des
       Verschmelzungs-Containers (siehe .raum-eintrag--ich weiter oben
       bzw. .raum-merge-nachrichten .raum-eintrag--ich weiter unten)
       positioniert es dadurch automatisch passend (rechtsbündig in der
       Einzelzone, mittig im Verschmelzungs-Raum) – keine eigene
       text-align-Regel nötig. */
    .raum-eintrag-status {
      font-size: 13px;
      line-height: 1;
      /* 10px Abstand zur LAYOUT-Kante der Blase – die Spitze selbst ragt
         absolut positioniert darüber hinaus (siehe .raum-nachricht--ich/
         --andere::before weiter unten, beeinflusst die Layout-Höhe der
         Blase NICHT) und würde bei zu knappem Abstand hier optisch mit
         dem Kennzeichen kollidieren. In der großen Zone (Solo ODER
         Verschmelzungs-Raum, 12px lange Spitze statt 7px) per eigener
         Regel weiter unten zusätzlich vergrößert. */
      margin-top: 10px;
      color: var(--text-2);
      font-style: italic;
      user-select: none;
    }

    /* ── Einzelne Nachricht als EINE durchgehende Kontur (Körper +
       Spitze) ───────────────────────────────────────────────────────
       Exakt dieselbe Zwei-Ebenen-clip-path-Technik wie beim 1:1-Chat
       (siehe .nachricht-andere/.nachricht-ich .text weiter oben, dort
       auch die ausführliche Herleitung/Begründung) – hier nur kompakter
       dimensioniert (R=14px/Spitze 7px statt 18px/12px), damit mehrere
       Zonen nebeneinander Platz haben. .raum-nachricht selbst bleibt
       unsichtbar (reine Text-Ebene, kein border/box-shadow/border-radius
       mehr), z-index:0 öffnet dafür den eigenen Stapelkontext (siehe
       ausführliche Begründung weiter unten). Eine GROSSE Zone (Solo ODER
       Verschmelzungs-Raum, siehe .raum-zone--gross weiter unten)
       überschreibt Größe UND Konturmaße auf dieselben 18px/12px-Werte
       wie der 1:1-Chat – "vergleichbar mit dem Einzelchat", nicht nur
       hochskalierte Miniatur-Maße. */
    .raum-nachricht {
      --blase-radius: 14px;
      --blase-spitze: 7px;
      --blase-versatz: 10px;
      display: inline-block;
      max-width: 100%;
      font-size: 14px; /* Fallback für Browser ohne Container-Query-Einheiten, siehe Regel direkt darunter */
      line-height: 1.35;
      /* Nachrichtentext immer linksbündig, wie im 1:1-Chat (siehe
         .nachricht .text). MUSS hier ausdrücklich stehen: Die Zone der
         eigenen Person setzt text-align:right (siehe .raum-zone--du),
         und das VERERBT sich in die Blase hinein – der Text darin stand
         dadurch rechtsbündig. Die Blase selbst bleibt rechts, dafür
         sorgt align-items:flex-end der Zone, nicht diese Eigenschaft. */
      text-align: left;
      overflow-wrap: break-word;
      color: #000000;
      background: transparent;
      padding: 9px 13px;
      position: relative;
      /* Eigener Stapelkontext für die negativ gestapelten Konturebenen
         (siehe ::before/::after weiter unten): ohne eigenen z-index
         "entkommen" negative z-index-Kinder bis zum nächsten Vorfahren,
         der tatsächlich einen Stapelkontext eröffnet, und landen dort
         HINTER dessen eigenem (undurchsichtigem) Hintergrund – z. B.
         hinter .raum-zone { background: var(--bg) }, komplett unsichtbar. */
      z-index: 0;
    }

    /* Schriftgröße skaliert PROPORTIONAL zur tatsächlichen Zonenbreite
       (cqw = 1% der Inline-Größe von .raum-zone, siehe dort "container-
       type: inline-size") – dadurch wächst die Schrift von selbst mit,
       sobald die Zone größer wird. clamp() sorgt für eine lesbare
       Untergrenze in der kleinsten (Mindestgröße-)Zone und eine
       Obergrenze, die nicht größer wirkt als nötig. Gilt nur für
       NICHT-große Zonen – eine GROSSE Zone (siehe .raum-zone--gross
       weiter unten) überschreibt das auf eine feste Größe wie im
       1:1-Chat. Als EIGENE, zweite font-size-Deklaration notiert (nicht
       die einzige): unterstützt ein Browser cqw nicht, ist nur diese
       eine Deklaration ungültig und fällt auf den 14px-Fallback direkt
       darüber zurück, statt ganz ohne font-size dazustehen. */
    .raum-nachricht { font-size: clamp(9px, 9cqw, 34px); }

    .phone-frame.emotion-an .raum-nachricht { color: #ffffff; }





    /* ── Große Zone (Solo ODER gemeinsamer Verschmelzungs-Raum): große,
       mittige Bühnen-Darstellung ──────────────────────────────────────
       Bühne für die reagierende Typografie statt Nachrichtenprotokoll –
       Nachrichten hier wie im 1:1-Chat groß und MITTIG (siehe .nachricht-
       andere/.nachricht-ich .text weiter oben), nicht klein/links-rechts
       aufgereiht wie in kompakten Zonen. Alle Selektoren hier mit
       .raum-zone--gross als Präfix notiert (sitzt sowohl auf dem
       Verschmelzungs-Container als auch auf der großen Solo-Zone, siehe
       raumGrossEl, JS) – dadurch automatisch höhere Spezifität als die
       kompakten Basis-Regeln oben, kleine Zonen (kein aktiver großer
       Raum) bleiben davon unberührt. */
    .raum-merge-nachrichten .raum-eintrag--ich,
    .raum-merge-nachrichten .raum-eintrag--andere {
      align-self: center;
      align-items: center;
      width: 100%;
    }

    /* "e"-Kennzeichen (siehe .raum-eintrag-status weiter oben) braucht
       hier mehr Abstand zur Blasen-Layout-Kante: die Spitze ist in der
       großen Zone 12px lang statt 7px in einer kompakten Zone. */
    .raum-zone--gross .raum-eintrag-status { margin-top: 18px; }

    /* ── Kontur EINE durchgehende Form (Blase + Spitze) ───────────────
       Dieselbe Zwei-Ebenen-clip-path: path(...)-Technik wie beim 1:1-Chat
       und den kompakten Zonen (siehe .nachricht-andere/.nachricht-ich
       .text bzw. .raum-nachricht--andere/--ich weiter oben für die
       vollständige Herleitung, inkl. Begründung für echte Bézier-Kurven
       statt polygon()-Facetten) – hier mit denselben Maßen wie der
       1:1-Chat (Radius 18px/17px, Spitze 12px/11px): eine große Zone
       soll "vergleichbar mit dem Einzelchat" wirken, nicht wie eine
       hochskalierte Miniatur. */
    .raum-zone--gross .raum-nachricht {
      --blase-radius: 18px;
      --blase-spitze: 12px;
      --blase-versatz: 16px;
      max-width: 88%;
      font-size: 30px;
      padding: 18px 24px;
      /* Linksbündig wie überall sonst – die große Zone ist derselbe
         Nachrichtentext, nur größer gesetzt. Die Blase bleibt mittig,
         dafür sorgt align-items:center von
         .raum-zone--gross:not(.raum-merge) .raum-zone-nachrichten. */
      text-align: left;
      background: transparent;
      z-index: 0;
    }





    /* Verblassen: max. 2 gleichzeitig sichtbare Nachrichten pro Liste,
       einheitlich Einzelzone wie gemeinsamer Verschmelzungs-Container
       (siehe raumNachrichtHinzufuegen, JS – der frühere Sonderfall "3 im
       Raum" aus Zeiten kompakter Blasen entfällt, seit dort dieselben
       großen Bühnen-Blasen wie im 1:1-Chat stehen, siehe .raum-zone--
       gross .raum-nachricht weiter oben) – die älteste bekommt
       diese Klasse, blendet sich weich aus und wird danach per Timer
       entfernt, statt abrupt zu verschwinden. Im gemeinsamen Raum läuft
       davor zusätzlich eine Mindest-Lesezeit (siehe raumEintragVerblassen
       Planen, JS), bevor diese Klasse überhaupt gesetzt wird. Sitzt auf
       dem .raum-eintrag-Wrapper (nicht der Blase direkt), damit auch ein
       eventuelles Absender-Label (.raum-eintrag-sender) mit ausblendet. */
    .raum-eintrag.raum-eintrag--verblasst {
      opacity: 0;
    }

    /* Kurzer Puls auf der gerade eingefügten Nachricht, solange sie Teil
       eines aktiven Verschmelzungs-Raums ist (siehe raumNachrichtSenden,
       JS) – bewusst kein Farbwechsel (monochromes Prinzip der App, siehe
       Kommentar bei sensorZuSchriftAchse/Temperatur), sondern ein
       kurzes Glühen in der jeweils aktuellen Textfarbe. */
    @keyframes raum-echo-puls {
      0%, 100% { text-shadow: none; }
      30%      { text-shadow: 0 0 10px currentColor; }
    }

    .raum-nachricht--echo {
      animation: raum-echo-puls 1.2s ease;
    }

    /* ── Eingabebereich ───────────────────────────────── */
    .eingabe-bereich {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
    }

    .eingabe-innen {
      display: flex;
      align-items: flex-end; /* Button + Toggle bleiben unten, wenn Feld wächst */
      gap: 10px;
    }

    #antwort-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-3);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 12px;
      padding: 7px 10px;
      cursor: pointer;
    }

    #antwort-btn:hover:not(:disabled) {
      border-color: var(--text-3);
      color: var(--text-2);
    }

    #antwort-btn:disabled { opacity: 0.3; cursor: default; }

    /* Freigestellter Kasten statt nur einer Unterstreichung – Absenden
       geschieht per ENTER (siehe #eingabe keydown-Handler, JS), es
       gibt bewusst keinen sichtbaren Sende-Button mehr daneben. */
    #eingabe {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;       /* explizit – Basis für die Höhenberechnung */
      color: #000000;            /* bleibt konstant */
      padding: 9px 14px;
      resize: none;           /* kein manuelles Ziehen */
      overflow-y: hidden;     /* wird per JS auf auto gesetzt, wenn Max-Höhe erreicht */
    }

    #eingabe:focus { border-color: var(--text-2); }

    #eingabe::placeholder { color: var(--placeholder); }

    /* Scrollbalken im Eingabefeld (nur sichtbar, wenn der Text die
       Max-Höhe übersteigt): siehe einheitlichen SCROLLBALKEN-Block
       oben – #eingabe ist dort mit den übrigen scrollbaren Bereichen
       zusammengefasst. */

    /* ── Emotion-Toggle ───────────────────────────────── */
    .emotion-schalter {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    .emotion-schalter input[type="checkbox"] { display: none; }

    /* Klar unterscheidbarer AN/AUS-Zustand statt nur eines dezenten
       Farbwechsels der Schiene: AUS = nur Umriss, keine Füllung; AN =
       voll gefüllt (--schalter-fuellung, siehe Modus-Variablen oben –
       in der Karte hinter dem Schalter unten per Klassen-Selektor
       überschrieben, weil diese Karte in BEIDEN Modi dunkel ist). Die
       eigentliche Übergangs-Animation kommt von der globalen
       MODUSWECHSEL-TRANSITION-Regel weiter unten (gilt für background-
       color/border-color auf allen Elementen im Frame), hier daher
       bewusst keine eigene, u. U. kollidierende transition-Angabe. */
    .schalter-visuell {
      width: 34px; height: 19px;
      background: transparent;
      border: 1.5px solid var(--text-3);
      border-radius: 10px;
      position: relative;
    }

    .schalter-visuell::after {
      content: '';
      position: absolute;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--text-3);
      top: 1.5px; left: 1.5px;
      /* transition steht bewusst NICHT hier, siehe Regel nach
         MODUSWECHSEL-TRANSITION weiter unten (::after wird von der
         globalen Transition-Regel nicht erfasst, braucht also ohnehin
         eine eigene – die aber an der richtigen Stelle im Stylesheet
         stehen muss). */
    }

    /* Klassenbasiert statt #emotion-toggle: es gibt drei Schalter (Fuß-
       leiste im Chat + schwebender Schalter der Übersicht +
       Einstellungen-Overlay), die denselben globalen Zustand spiegeln –
       siehe emotionModusSetzen (JS). */
    .emotion-schalter input:checked + .schalter-visuell {
      background: var(--schalter-fuellung);
      border-color: var(--schalter-fuellung);
    }

    .emotion-schalter input:checked + .schalter-visuell::after {
      transform: translateX(15px);
      background: var(--schalter-fuellung-kontrast);
    }

    .schalter-label {
      font-size: 9px;
      color: var(--text-3);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    /* Beide Emotion-Schalter (Chat-Fußleiste + schwebender Schalter der
       Übersicht) bekommen dieselbe Karte als Hintergrund, damit sie als
       feststehendes Element über dem jeweiligen Inhalt erkennbar
       bleiben. Farbe folgt dem Modus wie --scrollbar-farbe oben. */
    .eingabe-innen .emotion-schalter,
    .emotion-schalter--schwebend {
      background: var(--emotion-karte-bg);
      padding: 6px 10px;
      border-radius: 12px;
      /* Diese Karte ist in BEIDEN App-Modi dunkel (siehe --emotion-
         karte-bg oben – im hellen Modus fast schwarz, im dunklen Modus
         nur ein dezent hellerer Grauton auf Schwarz). Die AN-Füllung
         des Schalters muss deshalb IMMER hell sein, unabhängig vom
         App-Modus – sonst wäre sie im hellen Modus (schwarze Füllung
         auf fast schwarzer Karte) praktisch unsichtbar. */
      --schalter-fuellung:          #ffffff;
      --schalter-fuellung-kontrast: #000000;
    }

    /* Übersicht (Chats/Gruppen/Moment/Profil): der Schalter schwebt
       unten rechts über der Tab-Leiste, statt oben in der Kopfzeile zu
       stehen. position:absolute ist relativ zu #ansicht-uebersicht
       (selbst position:absolute, siehe .ansicht) – dadurch bleibt er
       beim Scrollen der Listen/des Feeds fest an Ort und Stelle, ganz
       unabhängig davon, welcher Tab gerade aktiv ist. */
    /* Sitzt vollständig ÜBER der Tab-Leiste, mit sichtbarem Abstand.
       Der Bezugsrahmen (#ansicht-uebersicht) reicht bis zur Unterkante
       des Frames, also HINTER die Leiste – deshalb muss der Abstand
       deren volle Höhe mit einrechnen:

         Leistenhöhe (56) + Trennlinie (1) + Abstand (12) = 69px

       Als calc() statt als fertige 69, damit die ersten beiden Summanden
       aus derselben Quelle kommen wie die Leiste selbst. Vorher stand
       hier eine feste 54 – die Zahl passte zur alten Leistenhöhe und
       wurde beim Vergrößern der Leiste still falsch.

       z-index:5 sorgt zusätzlich dafür, dass der Schalter nicht von der
       Leiste überdeckt wird, falls sich die Kanten je wieder berühren. */
    .emotion-schalter--schwebend {
      position: absolute;
      right: 16px;
      bottom: calc(var(--tab-leiste-hoehe) + 1px + 12px);
      z-index: 5;
    }


    /* ══════════════════════════════════════════════════════
       MODUSWECHSEL-TRANSITION
       Alle Farb-Eigenschaften im Frame wechseln weich (0.4 s).
       Betrifft NUR background-color, border-color, color –
       keine Konflikte mit transform/opacity-Animationen.
       Muss als letztes stehen, damit es nicht überschrieben wird.
       ══════════════════════════════════════════════════════ */
    .phone-frame,
    .phone-frame * {
      transition-property: background-color, border-color, color;
      transition-duration: 0.4s;
      transition-timing-function: ease;
    }

    /* Slider-Thumb (Pseudo-Elemente brauchen eigene Regel) */
    .dimension-slider::-webkit-slider-thumb { transition: background-color 0.4s ease; }
    .dimension-slider::-moz-range-thumb     { transition: background-color 0.4s ease; }

    /* Balken-Breite bleibt schnell (0.15 s) – nur Farbe folgt dem Modus */
    .dimension-balken { transition: width 0.15s ease, background-color 0.4s ease; }

    /* Toggle-Schieber bewegt sich immer mit 0.4 s (konsistent mit
       Moduswechsel) UND wechselt seine Füllfarbe (AUS/AN-Kontrast)
       ebenso weich – ::after ist ein Pseudo-Element und wird von der
       globalen ".phone-frame *"-Regel oben NICHT erfasst (die matcht
       nur echte Elemente), daher hier explizit background-color mit
       aufgenommen statt sich auf die globale Regel zu verlassen. */
    .schalter-visuell::after { transition: transform 0.4s ease, background-color 0.4s ease; }

    /* Gruppenraum: eigene transition-property, muss ebenso NACH der
       MODUSWECHSEL-TRANSITION-Regel stehen, sonst gewinnt deren
       transition-property (nur background-color/border-color/color) und
       font-size ändert sich abrupt statt weich. Die Konturfarbe selbst
       hängt nicht mehr an .raum-nachricht (kein box-shadow/border mehr,
       siehe Kommentar dort) – die beiden Kontur-Ebenen (::before/::after)
       tragen ihre eigene transition-Zeile direkt an sich selbst, siehe
       dort (Pseudoelemente erben keine transition ihres Elternelements). */
    .raum-nachricht { transition: font-size 0.6s ease; }

    /* Absender-Label + Sprechblasen-Wrapper (siehe .raum-eintrag, CSS
       weiter oben): eigene opacity-Transition aus demselben Grund NACH
       der globalen MODUSWECHSEL-TRANSITION-Regel nötig – trägt sowohl
       das Verblassen alter Nachrichten (.raum-eintrag--verblasst) als
       auch das Ein-/Ausblenden ganzer Zonen beim Verschmelzen/Auflösen
       (siehe .raum-zone/.raum-merge unten – Wrapper UND Zone teilen sich
       dieselbe Übergangsdauer, damit beide Ebenen synchron wirken). */
    .raum-eintrag { transition: opacity 0.6s ease; }

    /* Zonen-Name (Kopfzeile jeder Zone/des Verschmelzungs-Containers). */
    .raum-zone-name { transition: opacity 0.6s ease; }

    /* Zeilen-Gewichtung (siehe .raum-zeile, CSS weiter oben):
       --zeilen-gewicht steuert flex-grow (ein reiner <number>-Wert, in
       Chromium/Android-WebView zuverlässig interpolierbar, anders als
       eine grid-template-columns/-rows-Transition – siehe Kommentar-
       Historie, das wurde an dieser Stelle bereits einmal probiert und
       wegen unzuverlässiger Animation auf genau diesem WebView-Stand
       wieder verworfen). Aus demselben Grund wie oben NACH der globalen
       MODUSWECHSEL-TRANSITION-Regel nötig. */
    .raum-zeile { transition: flex-grow 0.6s ease; }

    /* Zonen/Verschmelzungs-Container selbst blenden sich beim Entstehen/
       Verschwinden weich ein bzw. aus (siehe .raum-eintretend weiter
       oben und raumStrukturUmbauen, JS). */
    .raum-zone { transition: opacity 0.5s ease; }

    /* ── Invertierter Modus (Emotion AN): helle Schrift auf dunklem Grund ── */
    /* Überschreibt hartcodierte Farben, die nicht über CSS-Variablen laufen.  */
    .phone-frame.emotion-an .app-logo              { filter: invert(1); }
    .phone-frame.emotion-an .gespraechs-name       { color: #ffffff; }
    .phone-frame.emotion-an .nachricht-andere .text          { color: #ffffff; }
    .phone-frame.emotion-an .nachricht-ich .text             { color: #ffffff; }
    .phone-frame.emotion-an #eingabe                { color: #ffffff; }
    .phone-frame.emotion-an .suche-eingabe          { color: #ffffff; }
    .phone-frame.emotion-an .moment-eingabe         { color: #ffffff; }
    .phone-frame.emotion-an .avatar                 { color: #ffffff; border-color: rgba(255,255,255,0.7); }

    /* ── Bluetooth-Band-Steuerung ─────────────────────────────── */
    .band-steuerung {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .band-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 999px; /* wie .filter-chip – abgerundeter Button */
      color: var(--text-3);
      font-family: 'Situra-Regular', 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      cursor: pointer;
    }

    .band-btn.verbunden { color: var(--accent); border-color: var(--accent); }

    .band-bpm-live {
      font-size: 10px;
      color: var(--text-4);
      font-variant-numeric: tabular-nums;
      font-style: italic;
    }

    .band-bpm-live.fehler { color: var(--text-2); }
  </style>

<style>
  /* Nur fürs Standbild – ändert nichts an der Darstellung der
     Nachrichten selbst, macht die Seite bloß aufnahmebereit. */
  body { margin: 0; background: #202020; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; }
  .phone-frame { width: 390px; height: 844px; }  /* Gerätemaß, feste Größe fürs Foto */

  /* Bedienelemente bleiben sichtbar (sie gehören zum Screen), reagieren
     aber nicht – es ist ein Standbild, kein bedienbarer Prototyp. */
  .ansicht button, .ansicht input { pointer-events: none; }
</style>
</head>
<body>

<div class="phone-frame emotion-an" id="phone-frame">
<div class="ansicht" id="ansicht-chat">

    <header class="kopfzeile">
      <div class="kopfzeile-titelzeile">
        <div class="kopfzeile-links">
          <button class="zurueck-btn" id="zurueck-btn">&lt;</button>
          <button class="chat-partner-btn" id="chat-partner-btn" title="Gruppeninfo anzeigen">
            <div class="avatar avatar--chat" id="chat-partner-avatar">–</div>
            <span class="kopfzeile-titel" id="chat-partner-name">–</span>
          </button>
        </div>
        <div class="band-steuerung">
          <span id="band-bpm-live" class="band-bpm-live" hidden></span>
          <button id="band-btn" class="band-btn">Band verbinden</button>
        </div>
      </div>

      <!-- Ein-/ausfahrbares Info-Fenster (Sensor-Anzeige): standardmäßig
           eingeklappt, an derselben Stelle wie zuvor die dauerhaft
           sichtbare Anzeige – nur der Griff ist sichtbar, bis geöffnet. -->
      <div class="info-drawer" id="info-drawer">
        <button class="info-drawer-griff" id="info-drawer-griff"
          aria-expanded="false" aria-controls="info-drawer-inhalt"
          title="Sensor-Anzeige ein-/ausblenden">
          <span>Sensor-Anzeige</span>
          <span class="info-drawer-pfeil" aria-hidden="true">&gt;</span>
        </button>

        <div class="info-drawer-inhalt" id="info-drawer-inhalt">
          <div class="info-drawer-inneres">
            <div class="sensor-grid">

              <div class="sensor-dimension">
                <div class="dimension-header">
                  <!-- Kennzeichnung wechselt zur Laufzeit: ohne Band ist
                       der Regler ein Testwert, mit Band kommt der Wert
                       aus dem Puls (siehe sensorHerkunftAktualisieren). -->
                  <span class="dimension-label" id="label-intensitaet">Intensität<em class="test-badge" id="badge-intensitaet">Testwert</em></span>
                  <span class="dimension-wert" id="wert-intensitaet">500</span>
                </div>
                <input class="dimension-slider" type="range"
                  id="slider-intensitaet" min="100" max="900" value="500" step="1">
              </div>

              <div class="sensor-dimension">
                <div class="dimension-header">
                  <span class="dimension-label dimension-label--live">Tempo</span>
                  <span class="dimension-wert" id="wert-tempo">—</span>
                </div>
                <div class="dimension-balken-spur">
                  <div class="dimension-balken" id="balken-tempo"></div>
                </div>
              </div>

              <div class="sensor-dimension">
                <div class="dimension-header">
                  <span class="dimension-label dimension-label--live" id="label-stabilitaet">Stabilität</span>
                  <span class="dimension-wert" id="wert-stabilitaet">—</span>
                </div>
                <div class="dimension-balken-spur">
                  <div class="dimension-balken" id="balken-stabilitaet"></div>
                </div>
              </div>

              <!-- Wachheit: einzige Dimension ohne Regler. Der Wert kommt
                   aus der nächtlichen Auswertung (nachtAuswertungPruefen),
                   nicht aus einer Eingabe. Liegt keine Nacht vor, steht
                   hier ausdrücklich "keine Messung" statt eines stillen
                   Standardwerts – sonst sähe es nach Funktion aus. -->
              <div class="sensor-dimension">
                <div class="dimension-header">
                  <span class="dimension-label" id="label-wachheit">Wachheit</span>
                  <span class="dimension-wert" id="wert-wachheit">—</span>
                </div>
                <div class="dimension-balken-spur">
                  <div class="dimension-balken" id="balken-wachheit"></div>
                </div>
              </div>

              <!-- Atmung: Regler steht bewusst HIER und nicht mehr im
                   Test-Panel darunter. Zwei Namen für dieselbe Größe
                   ("Atmung" oben, "Atemfrequenz" unten) waren nur
                   verwirrend – die Kennzeichnung als Testwert sagt
                   ohnehin, dass hier nichts gemessen wird. -->
              <div class="sensor-dimension">
                <div class="dimension-header">
                  <span class="dimension-label">Atmung<em class="test-badge">Testwert</em></span>
                  <span class="dimension-wert" id="wert-atemfrequenz">900</span>
                </div>
                <input class="dimension-slider" type="range"
                  id="slider-atemfrequenz" min="100" max="900" value="900" step="1">
                <div class="dimension-endpunkte"><span>aufgewühlt</span><span>gefasst</span></div>
              </div>

              <!-- Temperatur wirkt auf die Schriftgröße (kühl = kleiner,
                   warm = größer, ±12 % – siehe sensorZuSchriftAchse).
                   "Testwert", weil die Hauttemperatur weiterhin nicht
                   angebunden ist: Der Wert kommt vom Regler, die echte
                   Messung bleibt Ausblick. -->
              <div class="sensor-dimension">
                <div class="dimension-header">
                  <span class="dimension-label">Temperatur<em class="test-badge">Testwert</em></span>
                  <span class="dimension-wert" id="wert-tonalitaet">500</span>
                </div>
                <input class="dimension-slider" type="range"
                  id="slider-tonalitaet" min="100" max="900" value="500" step="1">
              </div>

            </div>

            <!-- Ein-/ausfahrbares Test-/Demo-Panel: liegt bewusst INNERHALB
                 der Sensor-Anzeige (nicht mehr als eigener, immer
                 sichtbarer Griff daneben) – der Test-Eingaben-Griff
                 selbst wird also erst sichtbar, wenn die Sensor-Anzeige
                 aufgeklappt ist. Fährt beim Öffnen sanft aus. ── -->
            <div class="test-drawer" id="test-drawer">
              <button class="test-drawer-griff" id="test-drawer-griff"
                aria-expanded="false" aria-controls="test-drawer-inhalt"
                title="Test-Eingaben ein-/ausblenden">
                <span>Test-Eingaben</span>
                <span class="test-drawer-pfeil" aria-hidden="true">&gt;</span>
              </button>

              <div class="test-drawer-inhalt" id="test-drawer-inhalt">
                <div class="test-drawer-inneres">
                  <span class="test-panel-label">Test-Eingaben · alle Regler stehen jetzt oben</span>

                  <!-- Gerätewechsel beim Testen: Die persönlichen
                       Grundlinien für Puls und Pulsvariabilität gehören zu
                       EINER Person. Wird das Band weitergegeben, sind sie
                       ungültig – und eine fremde Grundlinie erzeugt sofort
                       Scheinabweichungen (das war die Ursache für
                       Stabilität 100 direkt nach dem Anlegen). Beide werden
                       immer gemeinsam zurückgesetzt, nie einzeln: Der
                       Stress-Index verrechnet sie miteinander. -->
                  <button class="btn-sekundaer btn--kompakt" id="neue-person-btn" type="button">
                    Neue Person
                  </button>
                  <span class="test-neue-person-hinweis" id="neue-person-hinweis">
                    Setzt die Grundlinien für Puls und Variabilität zurück
                  </span>
                  <!-- Die Regler für Atmung und Temperatur sind in die
                       Sensor-Anzeige darüber gewandert: Dort stehen alle
                       sechs Dimensionen beisammen, jeweils mit dem Vermerk
                       "Testwert", wo nichts gemessen wird. Zwei Namen für
                       dieselbe Größe ("Atmung" oben, "Atemfrequenz" hier)
                       und doppelte element-IDs waren das Ergebnis der
                       vorherigen Aufteilung. -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="chat-bereich" id="chat"></main>

    <!-- ── Räumlicher Gruppenchat: komplett eigener Container, NICHT
         #chat – siehe JS-Abschnitt "GRUPPEN-RAUM". Wird nur bei
         geöffnetem Gruppenchat sichtbar (zeigeGruppenChat), bei 1:1
         bleibt er hidden und #chat unverändert wie bisher. ── -->
    <main class="raum-bereich" id="gruppen-raum" hidden></main>

    <footer class="eingabe-bereich">
      <div class="eingabe-innen">
        <!-- Kein sichtbarer Sende-/Antwort-Button mehr im Interface –
             Absenden geschieht per ENTER (siehe #eingabe keydown-
             Handler, JS). Der Button bleibt im DOM (nur hidden), damit
             die Demo-Antworten-Simulation (1:1 + Gruppenraum) über
             die Konsole weiter auslösbar ist, ohne dass sie im
             normalen Interface sichtbar ist. -->
        <button id="antwort-btn" hidden>&lt; Antwort</button>
        <!-- textarea statt input: wächst automatisch nach oben -->
        <textarea id="eingabe" rows="1"
          placeholder="Nachricht schreiben …"
          autocomplete="off"></textarea>
        <label class="emotion-schalter" title="Emotionale Typografie an/aus">
          <input type="checkbox" id="emotion-toggle" checked>
          <span class="schalter-visuell"></span>
          <span class="schalter-label">Emotion</span>
        </label>
