<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentum</title>

  <!-- Reine Weiterleitungsseite: Startpunkt (App-Root wie öffentlicher
       Web-Link/GitHub Pages) führt direkt ins Onboarding. Zwei
       Mechanismen kombiniert, damit die Weiterleitung robust ist:
       meta-refresh greift auch ohne JavaScript, das Script greift
       schneller/sofort in modernen Browsern (window.location.replace
       statt .href, damit index.html NICHT im Verlauf landet – der
       Zurück-Button springt sonst zurück auf diese leere Zwischenseite
       statt z. B. auf die vorherige externe Seite). situra-slider.html
       ist davon bewusst unberührt – eigenständige Showcase-Seite,
       nicht Teil dieses Onboarding-/Chat-Ablaufs. -->
  <meta http-equiv="refresh" content="0; url=onboarding.html">
  <script>
    window.location.replace('onboarding.html');
  </script>
</head>
<body>
  <p>Weiterleitung zu <a href="onboarding.html">onboarding.html</a> …</p>
</body>
</html>
