<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat – Situative Typografie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════════════════════════════════
       FARBWELTEN – als CSS-Custom-Properties auf .phone-frame
       Zum Anpassen: nur die Werte hier ändern, der Rest folgt.

       NEUTRAL (Emotion AUS): kühl, sachlich, nüchtern
       DUNKEL  (Emotion AN):  invertiert, schwarz, direkt
       ══════════════════════════════════════════════════════════════ */

    .phone-frame {
      /* ── Neutral (Standardzustand, Emotion AUS) ── */
      --bg:           #f2f2f0;   /* Haupthintergrund */
      --bg-surface:   #eceae7;   /* Header, Footer, Flächen */
      --bg-hover:     #e8e5e1;   /* Hover auf Listenelementen */
      --border:       #d6d3cc;   /* Kräftigere Linien */
      --border-light: #e4e1da;   /* Feine Trennlinien */
      --text-2:       #888888;   /* Sekundärtext */
      --text-3:       #aaaaaa;   /* Labels, schwacher Text */
      --text-4:       #bbbbbb;   /* Sehr schwacher Text, Wertanzeigen */
      --accent:       #555555;   /* Slider-Thumb, Fortschrittsbalken */
      --toggle-off:   #c4c2bb;   /* Toggle-Schiene, Emotion AUS */
      --toggle-on:    #444444;   /* Toggle-Schiene, Emotion AN */
      --placeholder:  #c0bdb8;   /* Eingabefeld-Platzhalter */
    }

    .phone-frame.emotion-an {
      /* ── Invertiert/Dunkel (Emotion AN) ── */
      --bg:           #111111;   /* Haupthintergrund – fast schwarz */
      --bg-surface:   #1a1a1a;   /* Header, Footer, Flächen */
      --bg-hover:     #222222;   /* Hover auf Listenelementen */
      --border:       #383838;   /* Kräftigere Linien */
      --border-light: #2a2a2a;   /* Feine Trennlinien */
      --text-2:       #999999;   /* Sekundärtext */
      --text-3:       #666666;   /* Labels, schwacher Text */
      --text-4:       #505050;   /* Sehr schwacher Text, Wertanzeigen */
      --accent:       #888888;   /* Slider-Thumb, Fortschrittsbalken */
      --toggle-off:   #383838;   /* Toggle-Schiene, Emotion AUS */
      --toggle-on:    #aaaaaa;   /* Toggle-Schiene, Emotion AN */
      --placeholder:  #484848;   /* Eingabefeld-Platzhalter */
    }


    /* ── Äußerer Rahmen ───────────────────────────────── */
    body {
      background: #e8e6e1;  /* bleibt konstant (außerhalb des Frames) */
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
    }

    /* ── Phone-Frame ──────────────────────────────────── */
    .phone-frame {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
    }

    @media (max-width: 440px) {
      body { background: var(--bg); }
      .phone-frame { width: 100%; height: 100dvh; box-shadow: none; }
    }

    /* ── Ansichten (Übersicht / Chat) ─────────────────── */
    .ansicht {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: opacity 0.2s ease;
    }

    .ansicht--versteckt {
      opacity: 0;
      pointer-events: none;
    }


    /* ══════════════════════════════════════════════════════
       ANSICHT 1 – GESPRÄCHSÜBERSICHT
       ══════════════════════════════════════════════════════ */

    .kopfzeile-uebersicht {
      flex-shrink: 0;
      height: 52px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .seitentitel {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .gespraechs-liste {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .gespraechs-eintrag {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      user-select: none;
    }

    .gespraechs-eintrag:hover,
    .gespraechs-eintrag:active {
      background: var(--bg-hover);
    }

    .avatar {
      flex-shrink: 0;
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #666;
      font-variation-settings: 'wght' 500;
    }

    .gespraechs-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .gespraechs-name {
      font-size: 14px;
      color: #222; /* bleibt konstant – Lesbarkeit */
      font-variation-settings: 'wght' 500;
    }

    .gespraechs-vorschau {
      font-size: 13px;
      color: var(--text-3);
      font-variation-settings: 'wght' 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* ══════════════════════════════════════════════════════
       ANSICHT 2 – CHAT
       ══════════════════════════════════════════════════════ */

    .kopfzeile {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 12px;
    }

    .kopfzeile-titelzeile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .kopfzeile-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .zurueck-btn {
      background: none;
      border: none;
      padding: 0 8px 0 0;
      cursor: pointer;
      font-size: 18px;
      color: var(--text-3);
      line-height: 1;
      font-family: inherit;
    }

    .zurueck-btn:hover { color: var(--text-2); }

    .kopfzeile-titel {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sensor-hinweis {
      font-size: 10px;
      color: var(--text-4);
      letter-spacing: 0.04em;
      font-style: italic;
    }

    /* 2×2-Raster für die 4 Dimensionen */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
    }

    .sensor-dimension { display: flex; flex-direction: column; gap: 3px; }

    .dimension-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .dimension-label {
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dimension-label--live { color: var(--text-2); }

    .dimension-label--live::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-3);
      margin-right: 4px;
      vertical-align: middle;
      animation: pulsieren 2s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    .dimension-wert {
      font-size: 10px;
      color: var(--text-4);
      font-variant-numeric: tabular-nums;
    }

    .dimension-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%; height: 2px;
      background: var(--border);
      border-radius: 1px;
      outline: none;
      cursor: pointer;
    }

    .dimension-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .dimension-slider::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    .dimension-balken-spur {
      width: 100%; height: 2px;
      background: var(--border-light);
      border-radius: 1px;
      overflow: hidden;
    }

    .dimension-balken {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.15s ease;
    }

    /* ── Chat-Verlauf ─────────────────────────────────── */
    .chat-bereich {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .nachricht {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      min-width: 0;
      /* --einblenden-dauer wird per JS auf eigene Nachrichten gesetzt (Tempo) */
      animation: einblenden var(--einblenden-dauer, 0.18s) ease forwards;
    }

    /* Einzelne Buchstaben im Zitter-Modus benötigen inline-block,
       damit transform darauf wirkt (inline-Elemente ignorieren transform). */
    .zitter-buchstabe {
      display: inline-block;
    }

    .nachricht-andere { align-self: flex-start; }
    .nachricht-andere .text {
      color: #777; /* bleibt konstant – Lesbarkeit */
      font-variation-settings: 'wght' 400;
    }

    .nachricht-ich { align-self: flex-end; text-align: right; }
    .nachricht-ich .text {
      color: #111; /* bleibt konstant – Lesbarkeit */
      font-variation-settings: 'wght' 400;
    }

    /* Zeilenumbruch erzwingen */
    .nachricht .text {
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 0;
    }

    /* Jedes Wort als eigene Box: trägt seinen EIGENEN eingefrorenen
       Dimensions-Zustand (siehe JS: wortZustaende). inline-block hält
       das Wort als Einheit zusammen; bricht nur um, wenn es selbst
       breiter als die verfügbare Zeile ist (z. B. sehr lange Wörter). */
    .wort {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* Dezenter Status-Indikator unterhalb jeder eigenen Nachricht.
       "e" = emotionale Typografie war beim Senden aktiv.
       Leer = neutral/leblos gesendet (Abwesenheit ist das Signal). */
    .nachricht-status {
      font-size: 10px;
      line-height: 1;
      margin-top: 3px;
      color: var(--text-4);          /* sehr dezent, passend zur Farbwelt */
      font-variation-settings: 'wght' 400;
      font-style: italic;            /* kleines "e" wirkt leichter als Regular */
      letter-spacing: 0;
      user-select: none;
    }

    .nachricht-ich .nachricht-status { text-align: right; }

    @keyframes einblenden {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Zitter-Keyframes werden dynamisch per JS erzeugt (ein Keyframe pro
       Buchstabe, zufällige Werte). Kein statischer @keyframes-Block nötig. */

    /* ── Eingabebereich ───────────────────────────────── */
    .eingabe-bereich {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
    }

    .eingabe-innen {
      display: flex;
      align-items: flex-end; /* Button + Toggle bleiben unten, wenn Feld wächst */
      gap: 10px;
    }

    #antwort-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-3);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-variation-settings: 'wght' 400;
      padding: 7px 10px;
      cursor: pointer;
    }

    #antwort-btn:hover:not(:disabled) {
      border-color: var(--text-3);
      color: var(--text-2);
    }

    #antwort-btn:disabled { opacity: 0.3; cursor: default; }

    #eingabe {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;       /* explizit – Basis für die Höhenberechnung */
      color: #222;            /* bleibt konstant */
      font-variation-settings: 'wght' 400;
      padding: 5px 0;
      resize: none;           /* kein manuelles Ziehen */
      overflow-y: hidden;     /* wird per JS auf auto gesetzt, wenn Max-Höhe erreicht */
    }

    #eingabe:focus { border-bottom-color: var(--text-2); }

    #eingabe::placeholder { color: var(--placeholder); }

    /* ── Scrollbalken im Eingabefeld ─────────────────────
       Nur sichtbar, wenn der Text die Max-Höhe übersteigt.
       Firefox: scrollbar-width / scrollbar-color
       Chrome / Edge / Safari: ::-webkit-scrollbar-*       */

    /* Firefox – schmale Variante, Farbe: Daumen / Spur */
    #eingabe {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.18) transparent;
    }

    /* Breite der Scrollleiste */
    #eingabe::-webkit-scrollbar {
      width: 4px;
    }

    /* Spur: vollständig transparent */
    #eingabe::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Ziehbalken: schmale, leicht abgerundete Linie */
    #eingabe::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 2px;
    }

    /* Pfeil-Buttons entfernen */
    #eingabe::-webkit-scrollbar-button {
      display: none;
    }

    /* ── Emotion-Toggle ───────────────────────────────── */
    .emotion-schalter {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    .emotion-schalter input[type="checkbox"] { display: none; }

    .schalter-visuell {
      width: 34px; height: 19px;
      background: var(--toggle-off);
      border-radius: 10px;
      position: relative;
    }

    .schalter-visuell::after {
      content: '';
      position: absolute;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #fff;
      top: 3px; left: 3px;
      transition: transform 0.4s ease;
    }

    #emotion-toggle:checked + .schalter-visuell {
      background: var(--toggle-on);
    }

    #emotion-toggle:checked + .schalter-visuell::after {
      transform: translateX(15px);
    }

    .schalter-label {
      font-size: 9px;
      color: var(--text-3);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }


    /* ══════════════════════════════════════════════════════
       MODUSWECHSEL-TRANSITION
       Alle Farb-Eigenschaften im Frame wechseln weich (0.4 s).
       Betrifft NUR background-color, border-color, color –
       keine Konflikte mit transform/opacity-Animationen.
       Muss als letztes stehen, damit es nicht überschrieben wird.
       ══════════════════════════════════════════════════════ */
    .phone-frame,
    .phone-frame * {
      transition-property: background-color, border-color, color;
      transition-duration: 0.4s;
      transition-timing-function: ease;
    }

    /* Slider-Thumb (Pseudo-Elemente brauchen eigene Regel) */
    .dimension-slider::-webkit-slider-thumb { transition: background-color 0.4s ease; }
    .dimension-slider::-moz-range-thumb     { transition: background-color 0.4s ease; }

    /* Balken-Breite bleibt schnell (0.15 s) – nur Farbe folgt dem Modus */
    .dimension-balken { transition: width 0.15s ease, background-color 0.4s ease; }

    /* Toggle-Schieber bewegt sich immer mit 0.4 s (konsistent mit Moduswechsel) */
    .schalter-visuell::after { transition: transform 0.4s ease; }

    /* ── Invertierter Modus (Emotion AN): helle Schrift auf dunklem Grund ── */
    /* Überschreibt hartcodierte Farben, die nicht über CSS-Variablen laufen.  */
    .phone-frame.emotion-an .gespraechs-name       { color: #d8d6d1; }
    .phone-frame.emotion-an .nachricht-andere .text { color: #999999; }
    .phone-frame.emotion-an .nachricht-ich .text    { color: #d8d6d1; }
    .phone-frame.emotion-an #eingabe                { color: #d8d6d1; }
    .phone-frame.emotion-an .avatar                 { background: #282828 !important; color: #777777; }

    /* ── Bluetooth-Band-Steuerung ─────────────────────────────── */
    .band-steuerung {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .band-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-3);
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-variation-settings: 'wght' 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 8px;
      cursor: pointer;
    }

    .band-btn.verbunden { color: var(--accent); border-color: var(--accent); }

    .band-bpm-live {
      font-size: 10px;
      color: var(--text-4);
      font-variant-numeric: tabular-nums;
      font-style: italic;
    }

    .band-bpm-live.fehler { color: var(--text-2); }
  </style>
</head>
<body>
<div class="phone-frame" id="phone-frame">

  <!-- ══════════════════════════════════════════════════════
       ANSICHT 1 – GESPRÄCHSÜBERSICHT
       ══════════════════════════════════════════════════════ -->
  <div class="ansicht" id="ansicht-uebersicht">

    <header class="kopfzeile-uebersicht">
      <span class="seitentitel">Gespräche</span>
    </header>

    <main class="gespraechs-liste">

      <div class="gespraechs-eintrag" data-name="Anna">
        <div class="avatar" style="background: #dedad4;">A</div>
        <div class="gespraechs-info">
          <span class="gespraechs-name">Anna</span>
          <span class="gespraechs-vorschau">Schick mir mal einen Screenshot, wenn's fertig ist.</span>
        </div>
      </div>

      <div class="gespraechs-eintrag" data-name="Luca">
        <div class="avatar" style="background: #d4d9de;">L</div>
        <div class="gespraechs-info">
          <span class="gespraechs-name">Luca</span>
          <span class="gespraechs-vorschau">Klingt interessant – wie funktioniert das genau?</span>
        </div>
      </div>

      <div class="gespraechs-eintrag" data-name="Mia">
        <div class="avatar" style="background: #d4d9d6;">M</div>
        <div class="gespraechs-info">
          <span class="gespraechs-name">Mia</span>
          <span class="gespraechs-vorschau">Hast du schon was zum Zeigen?</span>
        </div>
      </div>

    </main>
  </div>


  <!-- ══════════════════════════════════════════════════════
       ANSICHT 2 – CHAT
       ══════════════════════════════════════════════════════ -->
  <div class="ansicht ansicht--versteckt" id="ansicht-chat">

    <header class="kopfzeile">
      <div class="kopfzeile-titelzeile">
        <div class="kopfzeile-links">
          <button class="zurueck-btn" id="zurueck-btn">&#8592;</button>
          <span class="kopfzeile-titel" id="chat-partner-name">–</span>
        </div>
        <div class="band-steuerung">
          <span id="band-bpm-live" class="band-bpm-live" hidden></span>
          <button id="band-btn" class="band-btn">Band verbinden</button>
        </div>
      </div>

      <div class="sensor-grid">

        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Intensität</span>
            <span class="dimension-wert" id="wert-intensitaet">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-intensitaet" min="100" max="900" value="500" step="1">
        </div>

        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label dimension-label--live">Tempo</span>
            <span class="dimension-wert" id="wert-tempo">—</span>
          </div>
          <div class="dimension-balken-spur">
            <div class="dimension-balken" id="balken-tempo"></div>
          </div>
        </div>

        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label dimension-label--live">Stabilität</span>
            <span class="dimension-wert" id="wert-stabilitaet">—</span>
          </div>
          <div class="dimension-balken-spur">
            <div class="dimension-balken" id="balken-stabilitaet"></div>
          </div>
        </div>

        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Tonalität</span>
            <span class="dimension-wert" id="wert-tonalitaet">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-tonalitaet" min="100" max="900" value="500" step="1">
        </div>

      </div>
    </header>

    <main class="chat-bereich" id="chat"></main>

    <footer class="eingabe-bereich">
      <div class="eingabe-innen">
        <button id="antwort-btn">&#8592; Antwort</button>
        <!-- textarea statt input: wächst automatisch nach oben -->
        <textarea id="eingabe" rows="1"
          placeholder="Nachricht schreiben …"
          autocomplete="off"></textarea>
        <label class="emotion-schalter" title="Emotionale Typografie an/aus">
          <input type="checkbox" id="emotion-toggle" checked>
          <span class="schalter-visuell"></span>
          <span class="schalter-label">Emotion</span>
        </label>
      </div>
    </footer>

  </div>

</div><!-- /.phone-frame -->

<script>

  // ── Navigation ────────────────────────────────────────────────
  const ansichtUebersicht = document.getElementById('ansicht-uebersicht');
  const ansichtChat       = document.getElementById('ansicht-chat');
  const chatPartnerName   = document.getElementById('chat-partner-name');
  const phoneFrame        = document.getElementById('phone-frame');

  function zeigeUebersicht() {
    ansichtChat.classList.add('ansicht--versteckt');
    ansichtUebersicht.classList.remove('ansicht--versteckt');
  }

  function zeigeChat(name) {
    chatPartnerName.textContent = name;
    ansichtUebersicht.classList.add('ansicht--versteckt');
    ansichtChat.classList.remove('ansicht--versteckt');
    // Höhe anpassen, sobald die Ansicht sichtbar ist (scrollHeight = 0 wenn unsichtbar)
    setTimeout(() => { eingabeFeldAnpassen(); eingabe.focus(); }, 210);
  }

  document.querySelectorAll('.gespraechs-eintrag').forEach(function (el) {
    el.addEventListener('click', function () { zeigeChat(this.dataset.name); });
  });

  document.getElementById('zurueck-btn').addEventListener('click', zeigeUebersicht);


  // ═══════════════════════════════════════════════════════════════
  //  MAPPING-FUNKTION
  //  Wandelt 4 Rohwerte (je 100–900) in typografische Parameter um.
  // ═══════════════════════════════════════════════════════════════
  function sensorZuSchriftAchse(rohwerte) {

    // Intensität → font-weight (echte Inter-Achse 'wght')
    const wght = Math.min(900, Math.max(100, Math.round(rohwerte.intensitaet)));

    // BEHELF – Tempo → letter-spacing (−0.04 em … 0.12 em)
    const spacing = umrechnen(rohwerte.tempo, 100, 900, -0.04, 0.12);

    // Tempo → Dauer der Einblend-Animation neuer Nachrichten
    // Niedrig (100) = langsam/bedächtig (0.5 s) · hoch (900) = schnell/knapp (0.06 s)
    // Teilt KEINEN Parameter mehr mit Stabilität.
    const einblendDauer = umrechnen(rohwerte.tempo, 100, 900, 0.5, 0.06);

    // BEHELF – Stabilität → Translations-Amplitude pro Buchstabe
    // Dezenterer Bereich: spürbar aber nie unleserlich/grotesk
    const WOBBLE_AMPLITUDE_MAX = 2.0; // ← nachjustieren (px): Maximum bei Stabilität 100
    const WOBBLE_TOTZONE_PX    = 0.4; // ← nachjustieren (px): darunter = kein Zittern
    const wobbleRoh = umrechnen(rohwerte.stabilitaet, 100, 900, WOBBLE_AMPLITUDE_MAX, 0);
    const wobble    = wobbleRoh < WOBBLE_TOTZONE_PX ? 0 : wobbleRoh;

    // BEHELF – Stabilität → Rotations-Amplitude pro Buchstabe (Grad)
    const WOBBLE_ROT_MAX     = 2.5; // ← nachjustieren (Grad): Maximum
    const WOBBLE_ROT_TOTZONE = 0.5; // ← nachjustieren (Grad): Totzone
    const wobbleRotRoh = umrechnen(rohwerte.stabilitaet, 100, 900, WOBBLE_ROT_MAX, 0);
    const wobbleRot    = wobbleRotRoh < WOBBLE_ROT_TOTZONE ? 0 : wobbleRotRoh;

    // BEHELF – Tonalität → font-style: oblique (0° … 20°)
    // Ersetzt transform: skewX() – oblique wirkt nur auf die Glyphen,
    // nicht auf den Element-Container (Scrollbalken, Rahmen bleiben gerade).
    // Kalt/neutral (100) = 0° · warm/persönlich (900) = 20°
    const oblique = umrechnen(rohwerte.tonalitaet, 100, 900, 0, 20);

    return { wght, spacing, einblendDauer, wobble, wobbleRot, oblique };
  }

  function umrechnen(wert, vonMin, vonMax, zuMin, zuMax) {
    return zuMin + (wert - vonMin) / (vonMax - vonMin) * (zuMax - zuMin);
  }

  // ── Dynamisches Stylesheet für Zitter-Keyframes ────────────────
  // Pro Buchstabe wird ein einzigartiger @keyframes-Block erzeugt
  // und hier eingefügt, damit jeder Buchstabe zufällig zittert.
  const zitterStyleEl = document.createElement('style');
  document.head.appendChild(zitterStyleEl);

  // Erzeugt einen einzigartigen @keyframes-Block für einen Buchstaben.
  // Gibt den Animations-Namen zurück; fügt den Block ins Stylesheet ein.
  // BEHELF – später durch echte variable Schrift-Achsen ersetzen.
  function erstelleZitterAnimation(amplitude, rotAmplitude) {
    // Eindeutiger Name, damit Buchstaben sich nicht gegenseitig überschreiben
    const name = 'zb' + Math.random().toString(36).slice(2, 9);

    // Unregelmäßige Zeitstempel (nicht gleichmäßig verteilt) für nervöses Timing
    const schritte = [0];
    for (let i = 0; i < 5; i++) {
      schritte.push(Math.round(10 + Math.random() * 78));
    }
    schritte.push(100);
    schritte.sort((a, b) => a - b);

    let css = `@keyframes ${name}{`;
    schritte.forEach(pct => {
      const x   = ((Math.random() * 2 - 1) * amplitude   ).toFixed(2);
      const y   = ((Math.random() * 2 - 1) * amplitude * 0.8).toFixed(2);
      const r   = ((Math.random() * 2 - 1) * rotAmplitude).toFixed(2);
      // Leichte Zufalls-Skalierung: vermittelt Forminstabilität
      const sx  = (1 + (Math.random() * 2 - 1) * 0.04).toFixed(3);
      const sy  = (1 + (Math.random() * 2 - 1) * 0.04).toFixed(3);
      css += `${pct}%{transform:translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy});}`;
    });
    css += '}';

    zitterStyleEl.sheet.insertRule(css, zitterStyleEl.sheet.cssRules.length);
    return name;
  }

  // Teilt den Text eines Elements in einzelne Buchstaben-Spans auf
  // und weist jedem Buchstaben eine eigene, zufällige Zitter-Animation zu.
  // BEHELF – später durch variable Font-Achsen ersetzen.
  function buchstabenAnimieren(element, achsen) {
    const text = element.textContent;
    element.textContent = ''; // Inhalt leeren, dann neu aufbauen

    for (const buchstabe of text) {
      const span = document.createElement('span');
      span.textContent = buchstabe;

      if (buchstabe === ' ' || buchstabe === '\n') {
        // Leer-/Trennzeichen: kein Transform, kein inline-block nötig
        element.appendChild(span);
        continue;
      }

      span.classList.add('zitter-buchstabe'); // display: inline-block per CSS

      // Einzigartiger Keyframe + zufällige Dauer und Startversatz pro Buchstabe
      // → unregelmäßiges, asynchrones Zittern statt synchronem Takt
      const animName  = erstelleZitterAnimation(achsen.wobble, achsen.wobbleRot);
      const dauer     = (0.25 + Math.random() * 0.9).toFixed(2); // 0.25–1.15 s
      const verzoeger = (-Math.random() * 1.5).toFixed(2);        // negativer Delay = mid-cycle start

      span.style.animationName           = animName;
      span.style.animationDuration       = `${dauer}s`;
      span.style.animationTimingFunction = 'ease-in-out';
      span.style.animationIterationCount = 'infinite';
      span.style.animationDelay          = `${verzoeger}s`;

      element.appendChild(span);
    }
  }

  // Alle typografischen Parameter auf ein Element anwenden (Einfrieren beim Senden).
  // Die Werte werden als Snapshot eingefroren – danach nie mehr verändert.
  function stilAnwenden(element, achsen) {
    // Intensität → font-weight (echte Inter-Achse 'wght')
    element.style.fontVariationSettings = `'wght' ${achsen.wght}`;
    element.style.fontWeight            = achsen.wght;

    // BEHELF – Tempo → letter-spacing
    // Tempo steuert NICHT das Zittern – nur Laufweite und Einblend-Speed.
    element.style.letterSpacing = `${achsen.spacing.toFixed(3)}em`;

    // BEHELF – Tonalität → font-style: oblique (nur Glyphen, kein Box-Transform)
    element.style.fontStyle = `oblique ${achsen.oblique.toFixed(1)}deg`;

    // BEHELF – Stabilität → per-Buchstaben-Zittern mit Zufallsanimation
    // Teilt KEINEN Parameter mit Tempo.
    if (achsen.wobble > 0) {
      buchstabenAnimieren(element, achsen);
    }
    // Kein transform/animation auf dem Container-Element selbst
  }

  // Setzt ein Element auf den neutralen "leblosen" Zustand zurück
  // (Emotion war AUS oder dieses Wort wurde eingefügt/Paste).
  function stilNeutralAnwenden(element) {
    element.style.fontVariationSettings = "'wght' 400";
    element.style.fontWeight            = 400;
    element.style.letterSpacing         = '0em';
    element.style.fontStyle             = 'normal';
    element.style.transform             = 'none';
    element.style.animation             = 'none';
  }

  // Eingabefeld bleibt beim Tippen IMMER neutral.
  //
  // Grund: Ein <textarea> kennt keine Wortgrenzen für Styling – eine
  // Live-Vorschau würde immer den GESAMTEN Text einfärben und damit
  // auch bereits BESIEGELTE Wörter sichtbar mitverändern, während am
  // nächsten Wort getippt wird. Das widerspricht der Regel "ein
  // besiegeltes Wort verändert sich nicht mehr" (siehe
  // wortZustaendeSynchronisieren). Darum: keine Live-Effekte im
  // Eingabefeld. Die pro Wort eingefrorenen Zustände (wortZustaende)
  // werden ausschließlich beim Anzeigen der GESENDETEN Nachricht
  // sichtbar – dort jedes Wort einzeln mit seinem eigenen Zustand
  // (siehe nachrichtHinzufuegen).
  function vorschauAktualisieren() {
    eingabe.style.fontVariationSettings = "'wght' 400";
    eingabe.style.fontWeight            = 400;
    eingabe.style.letterSpacing         = '0em';
    eingabe.style.fontStyle             = 'normal';
  }


  // ── Auto-Grow: Eingabefeld an Inhalt anpassen ─────────────────
  const MAX_EINGABE_HOEHE = 120; // ca. 5 Zeilen (5 × 1.5 × 15 px + Padding)

  function eingabeFeldAnpassen() {
    eingabe.style.height   = 'auto'; // zurücksetzen, damit scrollHeight stimmt
    const inhaltsHoehe     = eingabe.scrollHeight;
    eingabe.style.height   = Math.min(inhaltsHoehe, MAX_EINGABE_HOEHE) + 'px';
    // Scrollbalken nur zeigen, wenn Max-Höhe überschritten
    eingabe.style.overflowY = inhaltsHoehe > MAX_EINGABE_HOEHE ? 'auto' : 'hidden';
  }


  // ═══════════════════════════════════════════════════════════════
  //  TIPP-ANALYSE  ←  ECHTES TIPPVERHALTEN
  //
  //  Tempo:      Zeichen pro Sekunde (rollendes Zeitfenster)
  //  Stabilität: Ereignis-Modell — Backspace = Unruhe, Space = Ruhe.
  //              Ruhe ist der Ausgangszustand und die Standardannahme.
  // ═══════════════════════════════════════════════════════════════

  // ── Tempo ────────────────────────────────────────────────────
  const TIPP_FENSTER_MS = 4000; // Rollierendes Zeitfenster (ms)
  const CPS_MAXIMUM     = 8;    // ← nachjustieren: Zeichen/s → Tempo 900

  let tipp_zeitstempel = [];

  // ── Stabilität: Schrittwerte (alle gut sichtbar hier) ─────────
  const STAB_START              = 900; // Startzustand: vollständige Ruhe
  const STAB_MIN                = 100; // untere Grenze
  const STAB_MAX                = 900; // obere Grenze (= Ruhe)

  // Wie stark ein einzelner Backspace/Delete destabilisiert:
  const STAB_BACKSPACE_ABZUG    = 40;  // ← nachjustieren

  // Wie stark ein Leerzeichen (Wort abgeschlossen) beruhigt:
  const STAB_LEERZEICHEN_GEWINN = 10;  // ← nachjustieren (war: 20)

  // Zeiterholung: alle X ms erholt sich Stabilität automatisch um Y Punkte.
  // Niedrigere Werte = trägere Erholung = Unruhe bleibt länger sichtbar.
  const STAB_ERHOLUNGS_MS       = 500; // ← nachjustieren in ms    (war: 250)
  const STAB_ERHOLUNG_PRO_TICK  = 3;   // ← nachjustieren in Punkte (war: 6)

  // Aktueller Stabilitätswert als fließende Zahl (für sanfte Übergänge)
  let stabilitaet_wert = STAB_START;

  // ══ MARKIERUNG: Paste-Zustand ══════════════════════════════════
  // true  → letzter Input war ein Einfüge-Vorgang (Paste):
  //         Dimensionen-Effekte deaktiviert, Vorschau neutral.
  // false → Nutzer schreibt selbst (oder hat nach einem Paste weitergetippt):
  //         Effekte aktiv wie gewohnt.
  // Wird in tippAnalysieren (via 'input'-Event) zurückgesetzt.
  // ══════════════════════════════════════════════════════════════
  let istEingefuegt = false;

  // ══════════════════════════════════════════════════════════════
  //  WORT-ZUSTÄNDE  ←  pro Wort EIN eigener eingefrorener Zustand
  //
  //  wortZustaende[i] = { achsen, leblos } für das i-te (0-basierte)
  //  Wort der aktuell getippten Nachricht. "leblos" entspricht der
  //  bisherigen Nachrichten-weiten Leblos-Regel (Emotion AUS oder
  //  Paste), nur eben pro Wort eingefroren statt für die ganze
  //  Nachricht einheitlich.
  // ══════════════════════════════════════════════════════════════
  let wortZustaende = [];

  // Zählt, wie viele Wörter im aktuellen Eingabetext bereits
  // "abgeschlossen" sind, d. h. ein Leerzeichen folgt auf sie.
  function abgeschlosseneWortAnzahl(text) {
    const treffer = text.match(/\S+\s/g);
    return treffer ? treffer.length : 0;
  }

  // Hält wortZustaende synchron zum Eingabetext.
  //
  // ══════════════════════════════════════════════════════════════
  //  BESIEGELN EINES WORTES (bei Leerzeichen)
  //  Sobald ein neues Leerzeichen ein Wort abschließt, steigt
  //  "anzahl" um eins. GENAU in diesem Moment wird unten eine
  //  KOPIE von aktuelleAchsen für dieses Wort in wortZustaende[]
  //  abgelegt – nicht erst beim Senden. Da "{ ...aktuelleAchsen }"
  //  eine eigenständige Kopie der Zahlenwerte erzeugt (keine
  //  Referenz), ist dieser Zustand ab sofort UNVERÄNDERLICH:
  //  spätere Änderungen an aktuelleAchsen (Puls, Tippverhalten,
  //  Slider) betreffen nur noch das NÄCHSTE, noch offene Wort.
  // ══════════════════════════════════════════════════════════════
  function wortZustaendeSynchronisieren() {
    const anzahl = abgeschlosseneWortAnzahl(eingabe.value);
    const leblos = !emotionAktiv || istEingefuegt;

    // ★★★ BESIEGELUNG: für jedes neu abgeschlossene Wort jetzt   ★★★
    // ★★★ den aktuellen Zustand einfrieren – danach unangetastet. ★★★
    while (wortZustaende.length < anzahl) {
      wortZustaende.push({ achsen: { ...aktuelleAchsen }, leblos });
    }
    // Wortgrenze per Backspace wieder aufgehoben → zugehörigen
    // eingefrorenen Zustand verwerfen (Wort ist wieder "in Arbeit",
    // also noch nicht besiegelt).
    if (wortZustaende.length > anzahl) {
      wortZustaende.length = anzahl;
    }
  }

  // Stabilität in Rohwerte + Anzeige + Vorschau übernehmen
  function stabilitaetUebernehmen() {
    const gerundet               = Math.round(stabilitaet_wert);
    aktuelleRohwerte.stabilitaet = gerundet;
    aktuelleAchsen               = sensorZuSchriftAchse(aktuelleRohwerte);
    wertStabilitaetAnzeige.textContent = gerundet;
    balkenStabilitaet.style.width = `${(gerundet - STAB_MIN) / (STAB_MAX - STAB_MIN) * 100}%`;
    vorschauAktualisieren();
  }

  // Kontinuierliche Zeiterholung: läuft immer, erholt Stabilität sanft
  setInterval(() => {
    if (stabilitaet_wert >= STAB_MAX) return; // schon ruhig, nichts zu tun
    stabilitaet_wert = Math.min(STAB_MAX, stabilitaet_wert + STAB_ERHOLUNG_PRO_TICK);
    stabilitaetUebernehmen();
  }, STAB_ERHOLUNGS_MS);

  function tippAnalysieren(event) {
    const istTippTaste =
      event.key.length === 1 ||
      event.key === 'Backspace' ||
      event.key === 'Delete';
    if (!istTippTaste) return;

    const jetzt = Date.now();

    // ── Tempo: Zeitstempel im Fenster verwalten ───────────────
    tipp_zeitstempel.push(jetzt);
    tipp_zeitstempel = tipp_zeitstempel.filter(t => t >= jetzt - TIPP_FENSTER_MS);

    // ── Stabilität: Ereignisse auswerten ─────────────────────
    if (event.key === 'Backspace' || event.key === 'Delete') {
      // Löschen destabilisiert; mehrere kurz hintereinander wirken kumulativ
      stabilitaet_wert = Math.max(STAB_MIN, stabilitaet_wert - STAB_BACKSPACE_ABZUG);
    } else if (event.key === ' ') {
      // Wort abgeschlossen → beruhigt den Rhythmus
      stabilitaet_wert = Math.min(STAB_MAX, stabilitaet_wert + STAB_LEERZEICHEN_GEWINN);
    }
    // Buchstaben: keine direkte Wirkung; Erholung läuft über den Timer

    // ── Tempo berechnen ──────────────────────────────────────
    const tempo = tempoBerechnen();
    aktuelleRohwerte.tempo = tempo;

    wertTempoAnzeige.textContent = tempo;
    balkenTempo.style.width = `${(tempo - 100) / 800 * 100}%`;

    // Stabilität und Vorschau synchronisieren
    stabilitaetUebernehmen();
  }

  function tempoBerechnen() {
    const cps     = tipp_zeitstempel.length / (TIPP_FENSTER_MS / 1000);
    const gemappt = Math.round(umrechnen(cps, 0, CPS_MAXIMUM, 100, 900));
    return Math.min(900, Math.max(100, gemappt));
  }


  // ── Vordefinierte Nachrichten ─────────────────────────────────
  const vorgegebeneNachrichten = [
    "Hey, was machst du gerade?",
    "Ah, klingt interessant – wie funktioniert das genau?",
    "Also die Schrift verändert sich je nach Kontext?",
    "Hast du schon was zum Zeigen?",
    "Schick mir mal einen Screenshot, wenn's fertig ist."
  ];
  let naechsteAntwortIndex = 0;

  // ── DOM-Referenzen ────────────────────────────────────────────
  const chat          = document.getElementById('chat');
  const eingabe       = document.getElementById('eingabe');
  const antwortBtn    = document.getElementById('antwort-btn');
  const emotionToggle = document.getElementById('emotion-toggle');

  const sliderIntensitaet      = document.getElementById('slider-intensitaet');
  const sliderTonalitaet       = document.getElementById('slider-tonalitaet');
  const wertIntensitaet        = document.getElementById('wert-intensitaet');
  const wertTonalitaet         = document.getElementById('wert-tonalitaet');
  const wertTempoAnzeige       = document.getElementById('wert-tempo');
  const wertStabilitaetAnzeige = document.getElementById('wert-stabilitaet');
  const balkenTempo            = document.getElementById('balken-tempo');
  const balkenStabilitaet      = document.getElementById('balken-stabilitaet');

  // ── Startzustand ──────────────────────────────────────────────
  let aktuelleRohwerte = {
    intensitaet: Number(sliderIntensitaet.value),
    tempo:       100,
    stabilitaet: 500,
    tonalitaet:  Number(sliderTonalitaet.value)
  };

  let aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);
  let emotionAktiv   = emotionToggle.checked; // true = AN

  // Interface sofort in den richtigen Modus bringen
  phoneFrame.classList.toggle('emotion-an', emotionAktiv);
  vorschauAktualisieren();
  eingabeFeldAnpassen(); // Starthöhe setzen

  // ── Nachricht einfügen ────────────────────────────────────────
  // wortSnapshots: bei eigenen Nachrichten ein Array [{achsen, leblos}, ...],
  // ein Eintrag pro Wort (siehe wortZustaendeSynchronisieren weiter oben).
  function nachrichtHinzufuegen(text, vonMir, wortSnapshots) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('nachricht', vonMir ? 'nachricht-ich' : 'nachricht-andere');

    // Tempo steuert die Dauer der Einblend-Animation eigener Nachrichten
    if (vonMir && emotionAktiv) {
      wrapper.style.setProperty('--einblenden-dauer', `${aktuelleAchsen.einblendDauer.toFixed(2)}s`);
    }

    const textEl = document.createElement('p');
    textEl.classList.add('text');

    if (vonMir) {
      // ═══════════════════════════════════════════════════════════
      // WORT-EBENE: Jedes Wort wird als eigenes <span class="wort">
      // dargestellt und bekommt SEINEN eigenen eingefrorenen Zustand
      // angewendet (statt eines einzigen Zustands für die ganze
      // Nachricht). Zwischen den Wörtern steht ein normales
      // Leerzeichen (Textknoten), damit der Zeilenumbruch dort
      // weiterhin normal funktioniert.
      // ═══════════════════════════════════════════════════════════
      const woerter = text.split(/\s+/).filter(w => w.length > 0);

      woerter.forEach((wort, i) => {
        const snapshot = wortSnapshots[i];

        const wortSpan = document.createElement('span');
        wortSpan.classList.add('wort');
        wortSpan.textContent = wort;

        // ★★★ HIER wird der für dieses Wort eingefrorene Zustand ★★★
        // ★★★ angewendet (oder die neutrale "leblos"-Darstellung). ★★★
        if (snapshot && !snapshot.leblos) {
          stilAnwenden(wortSpan, snapshot.achsen);
        } else {
          stilNeutralAnwenden(wortSpan);
        }

        textEl.appendChild(wortSpan);
        if (i < woerter.length - 1) {
          textEl.appendChild(document.createTextNode(' '));
        }
      });
    } else {
      textEl.textContent = text;
    }

    wrapper.appendChild(textEl);

    // Status-Indikator: Emotion-Zustand beim Absenden einfrieren
    // Nur bei eigenen Nachrichten relevant; wird nie nachträglich geändert.
    if (vonMir) {
      const statusEl = document.createElement('span');
      statusEl.classList.add('nachricht-status');
      // "e" sichtbar, wenn mindestens EIN Wort emotional eingefroren wurde;
      // leer = alle Wörter leblos/neutral (Abwesenheit ist das Signal)
      const hatEmotionalesWort = wortSnapshots.some(s => !s.leblos);
      statusEl.textContent = hatEmotionalesWort ? 'e' : '';
      wrapper.appendChild(statusEl);
    }

    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
  }

  // ── Ereignis-Handler ──────────────────────────────────────────

  eingabe.addEventListener('keydown', tippAnalysieren);
  // Kombinierter Input-Handler: Höhe + Paste-Erkennung
  eingabe.addEventListener('input', function (e) {
    eingabeFeldAnpassen();

    // ══ MARKIERUNG: Unterscheidung eingefügt vs. getippt ═════════
    // InputEvent.inputType erkennt die Art der Eingabe zuverlässig:
    //   'insertFromPaste'  → Ctrl+V, Kontextmenü-Einfügen, Drag-Drop
    //   'insertText'       → normales Tippen
    // So wird Ctrl+V-keydown (key 'v') nicht fälschlicherweise als
    // Tipp-Event gewertet, weil erst das nachfolgende 'input'-Event
    // den tatsächlichen insertType kennt.
    if (e.inputType === 'insertFromPaste') {
      istEingefuegt = true;
      vorschauAktualisieren(); // sofort neutral anzeigen
    } else if (istEingefuegt && e.inputType === 'insertText') {
      // Nutzer tippt nach einem Paste selbst weiter → Effekte reaktivieren
      istEingefuegt = false;
      vorschauAktualisieren();
    }
    // ══════════════════════════════════════════════════════════════

    // Wort-Zustände an den aktuellen Text anpassen (siehe oben)
    wortZustaendeSynchronisieren();
  });

  eingabe.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.shiftKey) return;        // Shift+Enter → Zeilenumbruch, nicht senden
    e.preventDefault();            // verhindert Zeilenumbruch beim Senden
    const text = eingabe.value.trim();
    if (!text) return;

    // ═══ Letztes Wort einfrieren, falls noch kein Leerzeichen folgte ═══
    // (Senden gilt – wie ein Leerzeichen – als Wortabschluss, siehe Konzept)
    const woerter = text.split(/\s+/).filter(w => w.length > 0);
    const wortSnapshots = wortZustaende.slice(0, woerter.length);
    if (wortSnapshots.length < woerter.length) {
      wortSnapshots.push({ achsen: { ...aktuelleAchsen }, leblos: !emotionAktiv || istEingefuegt });
    }

    nachrichtHinzufuegen(text, true, wortSnapshots);
    eingabe.value = '';
    eingabeFeldAnpassen();         // Höhe nach dem Leeren zurücksetzen

    // ── Zustand für die NÄCHSTE Nachricht zurücksetzen ────────
    // Stabilität: sofort auf Ausgangswert (vollständige Ruhe)
    stabilitaet_wert = STAB_START;

    // Tempo: Zeitstempel-Puffer leeren → nächste Nachricht beginnt
    // ohne Tipp-Vorgeschichte (Tempo startet bei Minimum)
    tipp_zeitstempel = [];
    aktuelleRohwerte.tempo = 100;
    wertTempoAnzeige.textContent = 100;
    balkenTempo.style.width      = '0%';

    // Intensität und Tonalität: Slider-Werte bleiben (spiegeln Sensor-Zustand);
    // nichts zurücksetzen – die Regler sind Platzhalter für externe Daten.

    // Paste-Flag zurücksetzen: nächste Nachricht beginnt im Tipp-Modus
    istEingefuegt = false;

    // Wort-Zustände zurücksetzen: nächste Nachricht beginnt ohne
    // eingefrorene Wörter (siehe wortZustaendeSynchronisieren)
    wortZustaende = [];

    // Vorschau und Anzeigen auf den zurückgesetzten Zustand bringen
    stabilitaetUebernehmen(); // setzt aktuelleAchsen + Vorschau neu
  });

  function sliderAktualisieren() {
    aktuelleRohwerte.intensitaet = Number(sliderIntensitaet.value);
    aktuelleRohwerte.tonalitaet  = Number(sliderTonalitaet.value);
    wertIntensitaet.textContent  = aktuelleRohwerte.intensitaet;
    wertTonalitaet.textContent   = aktuelleRohwerte.tonalitaet;
    aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);
    vorschauAktualisieren();
  }

  sliderIntensitaet.addEventListener('input', sliderAktualisieren);
  sliderTonalitaet.addEventListener('input',  sliderAktualisieren);

  antwortBtn.addEventListener('click', function () {
    if (naechsteAntwortIndex >= vorgegebeneNachrichten.length) return;
    nachrichtHinzufuegen(vorgegebeneNachrichten[naechsteAntwortIndex], false);
    naechsteAntwortIndex++;
    if (naechsteAntwortIndex >= vorgegebeneNachrichten.length) {
      antwortBtn.disabled    = true;
      antwortBtn.textContent = '–';
    }
  });

  // Emotion-Toggle:
  //   1. CSS-Klasse wechselt das komplette Farbschema (via Variablen)
  //   2. emotionAktiv steuert die typografische Logik (Vorschau, Einfrieren)
  emotionToggle.addEventListener('change', function () {
    emotionAktiv = this.checked;
    phoneFrame.classList.toggle('emotion-an', emotionAktiv); // ← Moduswechsel
    vorschauAktualisieren();
  });


  // ══════════════════════════════════════════════════════════════════
  //  BLUETOOTH-HERZFREQUENZ – Polar Verity Sense (oder kompatibles Band)
  //
  //  Verbindungsaufbau: Heart Rate Service (UUID 0x180D / 'heart_rate')
  //  Datenquelle:       Heart Rate Measurement (UUID 0x2A37 / 'heart_rate_measurement')
  //
  //  BPM → Intensität:  55 bpm → Rohwert 100 (ruhig, leicht)
  //                    105 bpm → Rohwert 900 (aktiviert, fett)
  //  Werte außerhalb werden auf 100–900 geklemmt.
  // ══════════════════════════════════════════════════════════════════

  const BAND_BPM_MIN = 75;   // ← nachjustieren: ab diesem Puls dünnste Strichstärke (Minimum)
  const BAND_BPM_MAX = 110;  // ← nachjustieren: ab diesem Puls fetteste Strichstärke (Maximum)

  let bandVerbunden        = false;
  let bluetoothGeraet      = null;
  let bandCharacteristic   = null;
  let intentionalesTrennen = false;

  const bandBtn          = document.getElementById('band-btn');
  const bandBpmLive      = document.getElementById('band-bpm-live');
  const labelIntensitaet = sliderIntensitaet.closest('.sensor-dimension').querySelector('.dimension-label');

  // ── Verbindungsaufbau per Klick ─────────────────────────────────
  bandBtn.addEventListener('click', async function () {
    // Zweiter Klick trennt das Band explizit
    if (bandVerbunden) {
      await bandExplizitTrennen();
      return;
    }

    if (!navigator.bluetooth) {
      bandFehlerZeigen('Web Bluetooth wird in diesem Browser nicht unterstützt.');
      return;
    }

    try {
      // Browser-Geräteauswahl-Dialog öffnet sich (nur Heart-Rate-Geräte sichtbar)
      bluetoothGeraet = await navigator.bluetooth.requestDevice({
        filters: [{ services: ['heart_rate'] }]
      });

      // Bei unerwartetem Verbindungsabbruch auf Slider zurückfallen
      bluetoothGeraet.addEventListener('gattserverdisconnected', function () {
        if (!intentionalesTrennen) {
          bandZuruecksetzen();
          bandFehlerZeigen('Verbindung zum Band getrennt – Slider aktiv.');
        }
        intentionalesTrennen = false;
      });

      // GATT-Verbindung aufbauen und Characteristic abonnieren
      const server  = await bluetoothGeraet.gatt.connect();
      const service = await server.getPrimaryService('heart_rate');
      bandCharacteristic = await service.getCharacteristic('heart_rate_measurement');
      await bandCharacteristic.startNotifications();
      bandCharacteristic.addEventListener('characteristicvaluechanged', bpmEmpfangen);

      // UI: verbunden → Slider sperren, Live-Indikator zeigen
      bandVerbunden = true;
      bandBtn.textContent = 'Band trennen';
      bandBtn.classList.add('verbunden');
      bandBpmLive.hidden = false;
      bandBpmLive.classList.remove('fehler');
      sliderIntensitaet.disabled            = true;
      sliderIntensitaet.style.opacity       = '0.3';
      sliderIntensitaet.style.pointerEvents = 'none';
      labelIntensitaet.classList.add('dimension-label--live');

    } catch (err) {
      // NotFoundError = Nutzer hat Dialog abgebrochen → kein Hinweis nötig
      if (err.name !== 'NotFoundError') {
        bandFehlerZeigen('Verbindung fehlgeschlagen – Slider aktiv.');
        console.error('[Bluetooth]', err);
      }
      bluetoothGeraet = null;
    }
  });

  // ── BPM-Daten empfangen und auswerten ───────────────────────────
  // Wird bei jeder neuen Heart Rate Measurement Notification aufgerufen.
  function bpmEmpfangen(event) {
    const daten    = event.target.value;   // DataView (rohe Bytes der Characteristic)
    const flags    = daten.getUint8(0);    // Byte 0: Flags
    const format16 = flags & 0x01;         // Bit 0: 1 = uint16, 0 = uint8

    // Herzfrequenz lesen (1 oder 2 Bytes je nach Format-Flag)
    const bpm = format16 ? daten.getUint16(1, true) : daten.getUint8(1);

    // RR-Intervalle vorhanden? (Bit 4 der Flags) → für spätere HRV-Nutzung loggen
    if (flags & 0x10) {
      const offset  = format16 ? 3 : 2;
      const rrWerte = [];
      for (let i = offset; i + 1 < daten.byteLength; i += 2) {
        // Einheit laut Spec: 1/1024 Sekunde → in ms umrechnen
        rrWerte.push(Math.round(daten.getUint16(i, true) / 1024 * 1000));
      }
      if (rrWerte.length) console.log('[HRV] RR-Intervalle (ms):', rrWerte);
    }

    // Live-Anzeige des Rohwerts (sichtbar nach Verbindung)
    bandBpmLive.textContent = bpm + ' bpm';

    // ── BPM → Intensitäts-Rohwert mappen (fließt hier ins Mapping ein) ──
    // umrechnen() wiederverwendet aus sensorZuSchriftAchse() oben.
    const intensitaetRoh = Math.min(900, Math.max(100,
      Math.round(umrechnen(bpm, BAND_BPM_MIN, BAND_BPM_MAX, 100, 900))
    ));

    // Intensität in aktuelleRohwerte einsetzen – ersetzt den Slider-Wert
    aktuelleRohwerte.intensitaet = intensitaetRoh;
    wertIntensitaet.textContent  = intensitaetRoh;
    aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);
    vorschauAktualisieren();
  }

  // ── Hilfsfunktionen Verbindungsstatus ───────────────────────────

  // Setzt UI und Zustand auf Slider-Fallback zurück (intern + bei Abbruch).
  function bandZuruecksetzen() {
    bandVerbunden      = false;
    bandCharacteristic = null;
    bandBtn.textContent = 'Band verbinden';
    bandBtn.classList.remove('verbunden');
    bandBpmLive.hidden = true;
    sliderIntensitaet.disabled            = false;
    sliderIntensitaet.style.opacity       = '';
    sliderIntensitaet.style.pointerEvents = '';
    labelIntensitaet.classList.remove('dimension-label--live');
    // Intensität auf letzten Slider-Wert zurücksetzen
    aktuelleRohwerte.intensitaet = Number(sliderIntensitaet.value);
    wertIntensitaet.textContent  = aktuelleRohwerte.intensitaet;
    aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);
    vorschauAktualisieren();
  }

  // Trennt die Verbindung auf Nutzerwunsch (kein Fehlerhinweis).
  async function bandExplizitTrennen() {
    intentionalesTrennen = true;
    if (bandCharacteristic) {
      try { await bandCharacteristic.stopNotifications(); } catch (e) {}
    }
    if (bluetoothGeraet && bluetoothGeraet.gatt.connected) {
      bluetoothGeraet.gatt.disconnect();
    }
    bluetoothGeraet = null;
    bandZuruecksetzen();
  }

  // Zeigt eine kurze Fehlermeldung (5 s) an der BPM-Anzeige.
  function bandFehlerZeigen(meldung) {
    bandBpmLive.textContent = meldung;
    bandBpmLive.classList.add('fehler');
    bandBpmLive.hidden = false;
    setTimeout(function () {
      if (!bandVerbunden) {
        bandBpmLive.hidden = true;
        bandBpmLive.classList.remove('fehler');
      }
    }, 5000);
  }

</script>
</body>
</html>
