<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat – Situative Typografie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e6e1;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
    }

    /* ── Phone-Frame ──────────────────────────────────── */
    .phone-frame {
      position: relative; /* Anker für absolute Ansichten */
      width: 390px;
      height: 844px;
      max-height: 100dvh;
      background: #f6f5f2;
      overflow: hidden;   /* kein Überlauf aus dem Frame */
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
    }

    @media (max-width: 440px) {
      body { background: #f6f5f2; }
      .phone-frame { width: 100%; height: 100dvh; box-shadow: none; }
    }

    /* ── Ansichten (Übersicht / Chat) ─────────────────────
       Beide Ansichten liegen übereinander (absolute),
       füllen den Phone-Frame vollständig aus und werden
       per JS ein- und ausgeblendet.                       */
    .ansicht {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #f6f5f2;
      /* Sanfte Überblendung beim Wechsel */
      transition: opacity 0.2s ease;
    }

    .ansicht--versteckt {
      opacity: 0;
      pointer-events: none; /* kein Klick auf versteckte Ansicht */
    }


    /* ══════════════════════════════════════════════════════
       ANSICHT 1 – GESPRÄCHSÜBERSICHT
       ══════════════════════════════════════════════════════ */

    /* Kopfzeile der Übersicht */
    .kopfzeile-uebersicht {
      flex-shrink: 0;
      height: 52px;
      background: #f6f5f2;
      border-bottom: 1px solid #e0ddd7;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .kopfzeile-uebersicht .seitentitel {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Liste der Gespräche */
    .gespraechs-liste {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    /* Einzelner Eintrag */
    .gespraechs-eintrag {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid #ece9e4;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }

    .gespraechs-eintrag:hover,
    .gespraechs-eintrag:active {
      background: #efece7;
    }

    /* Runder Avatar-Platzhalter mit Initial */
    .avatar {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #666;
      font-variation-settings: 'wght' 500;
    }

    /* Textteil neben dem Avatar */
    .gespraechs-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0; /* text-overflow funktioniert nur mit min-width: 0 */
    }

    .gespraechs-name {
      font-size: 14px;
      color: #222;
      font-variation-settings: 'wght' 500;
    }

    /* Vorschau der letzten Nachricht – einzeilig mit Auslassungspunkten */
    .gespraechs-vorschau {
      font-size: 13px;
      color: #aaa;
      font-variation-settings: 'wght' 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* ══════════════════════════════════════════════════════
       ANSICHT 2 – CHAT
       ══════════════════════════════════════════════════════ */

    /* Kopfzeile des Chats */
    .kopfzeile {
      flex-shrink: 0;
      background: #f6f5f2;
      border-bottom: 1px solid #e0ddd7;
      padding: 10px 16px 12px;
    }

    .kopfzeile-titelzeile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    /* Zurück-Pfeil + Gesprächspartner-Name */
    .kopfzeile-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .zurueck-btn {
      background: none;
      border: none;
      padding: 0 8px 0 0;
      cursor: pointer;
      font-size: 18px;
      color: #999;
      line-height: 1;
      font-family: inherit;
      transition: color 0.15s;
    }

    .zurueck-btn:hover { color: #555; }

    .kopfzeile-titel {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sensor-hinweis {
      font-size: 10px;
      color: #ccc;
      letter-spacing: 0.04em;
      font-style: italic;
    }

    /* 2×2-Raster: Intensität + Tonalität = Slider,
                   Tempo + Stabilität = Live-Anzeige    */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
    }

    .sensor-dimension { display: flex; flex-direction: column; gap: 3px; }

    .dimension-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .dimension-label {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Pulsierender Punkt = Live-Messung */
    .dimension-label--live { color: #777; }

    .dimension-label--live::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #aaa;
      margin-right: 4px;
      vertical-align: middle;
      animation: pulsieren 2s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    .dimension-wert {
      font-size: 10px;
      color: #bbb;
      font-variant-numeric: tabular-nums;
    }

    /* Interaktiver Slider */
    .dimension-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%; height: 2px;
      background: #ccc;
      border-radius: 1px;
      outline: none;
      cursor: pointer;
    }

    .dimension-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
    }

    .dimension-slider::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #555;
      border: none;
      cursor: pointer;
    }

    /* Fortschrittsbalken für Live-Messungen */
    .dimension-balken-spur {
      width: 100%; height: 2px;
      background: #e0ddd7;
      border-radius: 1px;
      overflow: hidden;
    }

    .dimension-balken {
      height: 100%; width: 0%;
      background: #888;
      border-radius: 1px;
      transition: width 0.15s ease;
    }

    /* ── Chat-Verlauf ─────────────────────────────────── */
    .chat-bereich {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    .nachricht {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      min-width: 0;
      animation: einblenden 0.18s ease forwards;
    }

    .nachricht-andere { align-self: flex-start; }
    .nachricht-andere .text {
      color: #777;
      font-variation-settings: 'wght' 400;
    }

    .nachricht-ich { align-self: flex-end; text-align: right; }
    .nachricht-ich .text {
      color: #111;
      font-variation-settings: 'wght' 400;
    }

    /* Zeilenumbruch erzwingen, lange Wörter/URLs ebenfalls */
    .nachricht .text {
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 0;
    }

    @keyframes einblenden {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Zittern-Animation (Stabilität) – BEHELF
       --zt-amplitude und --zt-skew werden pro Nachricht eingefroren. */
    @keyframes zittern {
      0%,  100% { transform: translateX(0)                              skewX(var(--zt-skew,0deg)); }
      20%        { transform: translateX(var(--zt-amplitude,0px))       skewX(var(--zt-skew,0deg)); }
      40%        { transform: translateX(calc(var(--zt-amplitude,0px)*-0.7)) skewX(var(--zt-skew,0deg)); }
      60%        { transform: translateX(calc(var(--zt-amplitude,0px)* 0.4)) skewX(var(--zt-skew,0deg)); }
      80%        { transform: translateX(calc(var(--zt-amplitude,0px)*-0.2)) skewX(var(--zt-skew,0deg)); }
    }

    /* ── Eingabebereich ───────────────────────────────── */
    .eingabe-bereich {
      flex-shrink: 0;
      background: #f6f5f2;
      border-top: 1px solid #e0ddd7;
      padding: 10px 14px;
    }

    .eingabe-innen {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #antwort-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid #d0cdc8;
      color: #999;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-variation-settings: 'wght' 400;
      padding: 7px 10px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }

    #antwort-btn:hover:not(:disabled) { border-color: #aaa; color: #666; }
    #antwort-btn:disabled { opacity: 0.3; cursor: default; }

    #eingabe {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      border-bottom: 1px solid #ccc;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #222;
      font-variation-settings: 'wght' 400;
      padding: 5px 0;
      transition: border-color .15s;
    }

    #eingabe:focus { border-bottom-color: #888; }
    #eingabe::placeholder { color: #c0bdb8; }

    /* ── Emotion-Toggle ───────────────────────────────── */
    .emotion-schalter {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    .emotion-schalter input[type="checkbox"] { display: none; }

    .schalter-visuell {
      width: 34px; height: 19px;
      background: #ccc;
      border-radius: 10px;
      position: relative;
      transition: background .2s;
    }

    .schalter-visuell::after {
      content: '';
      position: absolute;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #fff;
      top: 3px; left: 3px;
      transition: transform .2s;
    }

    #emotion-toggle:checked + .schalter-visuell { background: #444; }
    #emotion-toggle:checked + .schalter-visuell::after { transform: translateX(15px); }

    .schalter-label {
      font-size: 9px;
      color: #aaa;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div class="phone-frame">

  <!-- ══════════════════════════════════════════════════════
       ANSICHT 1 – GESPRÄCHSÜBERSICHT
       ══════════════════════════════════════════════════════ -->
  <div class="ansicht" id="ansicht-uebersicht">

    <header class="kopfzeile-uebersicht">
      <span class="seitentitel">Gespräche</span>
    </header>

    <main class="gespraechs-liste">

      <!-- Eintrag 1 -->
      <div class="gespraechs-eintrag" data-name="Anna">
        <div class="avatar" style="background: #dedad4;">A</div>
        <div class="gespraechs-info">
          <span class="gespraechs-name">Anna</span>
          <span class="gespraechs-vorschau">Schick mir mal einen Screenshot, wenn's fertig ist.</span>
        </div>
      </div>

      <!-- Eintrag 2 -->
      <div class="gespraechs-eintrag" data-name="Luca">
        <div class="avatar" style="background: #d4d9de;">L</div>
        <div class="gespraechs-info">
          <span class="gespraechs-name">Luca</span>
          <span class="gespraechs-vorschau">Klingt interessant – wie funktioniert das genau?</span>
        </div>
      </div>

      <!-- Eintrag 3 -->
      <div class="gespraechs-eintrag" data-name="Mia">
        <div class="avatar" style="background: #d4d9d6;">M</div>
        <div class="gespraechs-info">
          <span class="gespraechs-name">Mia</span>
          <span class="gespraechs-vorschau">Hast du schon was zum Zeigen?</span>
        </div>
      </div>

    </main>
  </div><!-- /#ansicht-uebersicht -->


  <!-- ══════════════════════════════════════════════════════
       ANSICHT 2 – CHAT
       ══════════════════════════════════════════════════════ -->
  <div class="ansicht ansicht--versteckt" id="ansicht-chat">

    <!-- Kopfzeile mit Zurück-Pfeil + Dimensionen -->
    <header class="kopfzeile">
      <div class="kopfzeile-titelzeile">
        <div class="kopfzeile-links">
          <!-- Zurück zur Übersicht -->
          <button class="zurueck-btn" id="zurueck-btn">&#8592;</button>
          <span class="kopfzeile-titel" id="chat-partner-name">–</span>
        </div>
        <span class="sensor-hinweis">Platzhalter · Sensordaten</span>
      </div>

      <div class="sensor-grid">

        <!-- Intensität: Slider-Platzhalter -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Intensität</span>
            <span class="dimension-wert" id="wert-intensitaet">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-intensitaet" min="100" max="900" value="500" step="1">
        </div>

        <!-- Tempo: wird aus Tippgeschwindigkeit berechnet -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label dimension-label--live">Tempo</span>
            <span class="dimension-wert" id="wert-tempo">—</span>
          </div>
          <div class="dimension-balken-spur">
            <div class="dimension-balken" id="balken-tempo"></div>
          </div>
        </div>

        <!-- Stabilität: wird aus Tipprhythmus berechnet -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label dimension-label--live">Stabilität</span>
            <span class="dimension-wert" id="wert-stabilitaet">—</span>
          </div>
          <div class="dimension-balken-spur">
            <div class="dimension-balken" id="balken-stabilitaet"></div>
          </div>
        </div>

        <!-- Tonalität: Slider-Platzhalter -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Tonalität</span>
            <span class="dimension-wert" id="wert-tonalitaet">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-tonalitaet" min="100" max="900" value="500" step="1">
        </div>

      </div>
    </header>

    <!-- Scrollbarer Chat-Verlauf -->
    <main class="chat-bereich" id="chat"></main>

    <!-- Eingabeleiste -->
    <footer class="eingabe-bereich">
      <div class="eingabe-innen">
        <button id="antwort-btn">&#8592; Antwort</button>
        <input type="text" id="eingabe"
          placeholder="Nachricht schreiben …" autocomplete="off">
        <label class="emotion-schalter" title="Emotionale Typografie an/aus">
          <input type="checkbox" id="emotion-toggle" checked>
          <span class="schalter-visuell"></span>
          <span class="schalter-label">Emotion</span>
        </label>
      </div>
    </footer>

  </div><!-- /#ansicht-chat -->

</div><!-- /.phone-frame -->

<script>

  // ══════════════════════════════════════════════════════════════
  //  NAVIGATION – Wechsel zwischen Übersicht und Chat
  // ══════════════════════════════════════════════════════════════

  const ansichtUebersicht = document.getElementById('ansicht-uebersicht');
  const ansichtChat       = document.getElementById('ansicht-chat');
  const chatPartnerName   = document.getElementById('chat-partner-name');

  function zeigeUebersicht() {
    ansichtChat.classList.add('ansicht--versteckt');
    ansichtUebersicht.classList.remove('ansicht--versteckt');
  }

  function zeigeChat(name) {
    chatPartnerName.textContent = name;
    ansichtUebersicht.classList.add('ansicht--versteckt');
    ansichtChat.classList.remove('ansicht--versteckt');
    // Eingabefeld fokussieren, sobald der Chat sichtbar ist
    setTimeout(() => eingabe.focus(), 210);
  }

  // Klick auf Gesprächseintrag → Chat öffnen
  document.querySelectorAll('.gespraechs-eintrag').forEach(function (el) {
    el.addEventListener('click', function () {
      zeigeChat(this.dataset.name);
    });
  });

  // Zurück-Pfeil → Übersicht
  document.getElementById('zurueck-btn').addEventListener('click', zeigeUebersicht);


  // ═══════════════════════════════════════════════════════════════
  //  MAPPING-FUNKTION
  //  Wandelt 4 Rohwerte (je 100–900) in typografische Parameter um.
  //
  //  HIER ANPASSEN, wenn echte Sensordaten kommen:
  //    • Intensität / Tonalität: Slider durch Sensor ersetzen
  //    • Tempo / Stabilität: Tipp-Berechnung durch Sensor ersetzen
  //    • BEHELF-Stellen → eigene Variable-Font-Achsen einsetzen
  // ═══════════════════════════════════════════════════════════════
  function sensorZuSchriftAchse(rohwerte) {

    // ── Intensität → font-weight ──────────────────────────────
    // Echte Inter-Achse 'wght' – kein Behelf.
    const wght = Math.min(900, Math.max(100, Math.round(rohwerte.intensitaet)));

    // ── Tempo → letter-spacing (em) ──────────────────────────
    // BEHELF – später durch eigene Schrift-Achse ersetzen
    // Langsam (100) = eng (−0.04 em) · schnell (900) = weit (0.12 em)
    const spacing = umrechnen(rohwerte.tempo, 100, 900, -0.04, 0.12);

    // ── Tempo → Animations-Dauer (s) ─────────────────────────
    // Langsam (100) = 2 s/Zyklus · schnell (900) = 0.3 s/Zyklus
    const animDuration = umrechnen(rohwerte.tempo, 100, 900, 2, 0.3);

    // ── Stabilität → Zitter-Amplitude (px) ───────────────────
    // BEHELF – später durch eigene Schrift-Achse ersetzen
    // Stabil (900) = 0 px · unruhig (100) = 3 px
    const wobbleRoh = umrechnen(rohwerte.stabilitaet, 100, 900, 3, 0);
    const wobble    = wobbleRoh < 0.2 ? 0 : wobbleRoh;

    // ── Tonalität → Schrägstellung (deg) ─────────────────────
    // BEHELF – später durch eigene Schrift-Achse ersetzen
    // Neutral (100) = 0° · warm/geneigt (900) = −5°
    const skew = umrechnen(rohwerte.tonalitaet, 100, 900, 0, -5);

    return { wght, spacing, animDuration, wobble, skew };
  }

  function umrechnen(wert, vonMin, vonMax, zuMin, zuMax) {
    const t = (wert - vonMin) / (vonMax - vonMin);
    return zuMin + t * (zuMax - zuMin);
  }

  // Alle typografischen Parameter auf ein Element anwenden (Einfrieren beim Senden)
  function stilAnwenden(element, achsen) {
    element.style.fontVariationSettings = `'wght' ${achsen.wght}`;
    element.style.fontWeight            = achsen.wght;
    element.style.letterSpacing         = `${achsen.spacing.toFixed(3)}em`;  // BEHELF
    element.style.setProperty('--zt-skew', `${achsen.skew.toFixed(2)}deg`);  // BEHELF

    if (achsen.wobble > 0) {
      // BEHELF – Stabilität → Zitter-Animation
      element.style.setProperty('--zt-amplitude', `${achsen.wobble.toFixed(2)}px`);
      element.style.animation = `zittern ${achsen.animDuration.toFixed(2)}s ease-in-out infinite`;
      element.style.transform  = '';
    } else {
      element.style.animation = 'none';
      element.style.transform  = `skewX(${achsen.skew.toFixed(2)}deg)`;     // BEHELF
    }
  }

  // Vorschau im Eingabefeld (kein Zittern, kein Einfrieren)
  function vorschauAktualisieren() {
    if (emotionAktiv) {
      eingabe.style.fontVariationSettings = `'wght' ${aktuelleAchsen.wght}`;
      eingabe.style.fontWeight            = aktuelleAchsen.wght;
      eingabe.style.letterSpacing         = `${aktuelleAchsen.spacing.toFixed(3)}em`;
      eingabe.style.transform             = `skewX(${aktuelleAchsen.skew.toFixed(2)}deg)`;
    } else {
      eingabe.style.fontVariationSettings = "'wght' 400";
      eingabe.style.fontWeight            = 400;
      eingabe.style.letterSpacing         = '0em';
      eingabe.style.transform             = 'none';
    }
  }


  // ═══════════════════════════════════════════════════════════════
  //  TIPP-ANALYSE  ←  HIER WIRD DAS ECHTE TIPPVERHALTEN GEMESSEN
  // ═══════════════════════════════════════════════════════════════

  const TIPP_FENSTER_MS = 4000;
  const MAX_IKI_MS      = 2000;
  const CPS_MAXIMUM     = 8;

  let tipp_zeitstempel = [];
  let backspace_puffer = [];
  let iki_puffer       = [];
  let letzter_ts       = null;

  function tippAnalysieren(event) {
    const istTippTaste =
      event.key.length === 1 ||
      event.key === 'Backspace' ||
      event.key === 'Delete';
    if (!istTippTaste) return;

    const jetzt = Date.now();

    if (letzter_ts !== null) {
      const delta = jetzt - letzter_ts;
      if (delta < MAX_IKI_MS) {
        iki_puffer.push(delta);
        if (iki_puffer.length > 30) iki_puffer.shift();
      }
    }
    letzter_ts = jetzt;

    tipp_zeitstempel.push(jetzt);
    if (event.key === 'Backspace' || event.key === 'Delete') {
      backspace_puffer.push(jetzt);
    }

    const grenze      = jetzt - TIPP_FENSTER_MS;
    tipp_zeitstempel  = tipp_zeitstempel.filter(t => t >= grenze);
    backspace_puffer  = backspace_puffer.filter(t => t >= grenze);

    const tempo       = tempoBerechnen();
    const stabilitaet = stabilitaetBerechnen();

    aktuelleRohwerte.tempo       = tempo;
    aktuelleRohwerte.stabilitaet = stabilitaet;
    aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);

    wertTempoAnzeige.textContent       = tempo;
    wertStabilitaetAnzeige.textContent = stabilitaet;
    balkenTempo.style.width       = `${(tempo       - 100) / 800 * 100}%`;
    balkenStabilitaet.style.width = `${(stabilitaet - 100) / 800 * 100}%`;

    vorschauAktualisieren();
  }

  function tempoBerechnen() {
    const cps     = tipp_zeitstempel.length / (TIPP_FENSTER_MS / 1000);
    const gemappt = Math.round(umrechnen(cps, 0, CPS_MAXIMUM, 100, 900));
    return Math.min(900, Math.max(100, gemappt));
  }

  function stabilitaetBerechnen() {
    if (iki_puffer.length < 3) return 500;
    const n       = iki_puffer.length;
    const mean    = iki_puffer.reduce((a, b) => a + b, 0) / n;
    const varianz = iki_puffer.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
    const cv      = mean > 0 ? Math.sqrt(varianz) / mean : 0;
    const korrekturRate  = tipp_zeitstempel.length > 0
      ? backspace_puffer.length / tipp_zeitstempel.length : 0;
    const korrekturAbzug = Math.round(umrechnen(korrekturRate, 0, 0.3, 0, 300));
    const basis = Math.round(umrechnen(cv, 0, 1, 900, 100));
    return Math.min(900, Math.max(100, basis - korrekturAbzug));
  }


  // ── Vordefinierte Nachrichten der anderen Person ──────────────
  const vorgegebeneNachrichten = [
    "Hey, was machst du gerade?",
    "Ah, klingt interessant – wie funktioniert das genau?",
    "Also die Schrift verändert sich je nach Kontext?",
    "Hast du schon was zum Zeigen?",
    "Schick mir mal einen Screenshot, wenn's fertig ist."
  ];
  let naechsteAntwortIndex = 0;


  // ── DOM-Referenzen ────────────────────────────────────────────
  const chat          = document.getElementById('chat');
  const eingabe       = document.getElementById('eingabe');
  const antwortBtn    = document.getElementById('antwort-btn');
  const emotionToggle = document.getElementById('emotion-toggle');

  const sliderIntensitaet      = document.getElementById('slider-intensitaet');
  const sliderTonalitaet       = document.getElementById('slider-tonalitaet');
  const wertIntensitaet        = document.getElementById('wert-intensitaet');
  const wertTonalitaet         = document.getElementById('wert-tonalitaet');
  const wertTempoAnzeige       = document.getElementById('wert-tempo');
  const wertStabilitaetAnzeige = document.getElementById('wert-stabilitaet');
  const balkenTempo            = document.getElementById('balken-tempo');
  const balkenStabilitaet      = document.getElementById('balken-stabilitaet');


  // ── Startzustand ──────────────────────────────────────────────
  let aktuelleRohwerte = {
    intensitaet: Number(sliderIntensitaet.value),
    tempo:       100,
    stabilitaet: 500,
    tonalitaet:  Number(sliderTonalitaet.value)
  };

  let aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);
  let emotionAktiv   = emotionToggle.checked;

  vorschauAktualisieren();


  // ── Nachricht einfügen ────────────────────────────────────────
  function nachrichtHinzufuegen(text, vonMir) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('nachricht', vonMir ? 'nachricht-ich' : 'nachricht-andere');

    const textEl = document.createElement('p');
    textEl.classList.add('text');
    textEl.textContent = text;

    if (vonMir) {
      if (emotionAktiv) {
        // Snapshot aller vier Achsen – wird NIE mehr geändert
        stilAnwenden(textEl, aktuelleAchsen);
      } else {
        textEl.style.fontVariationSettings = "'wght' 400";
        textEl.style.fontWeight            = 400;
        textEl.style.letterSpacing         = '0em';
        textEl.style.transform             = 'none';
        textEl.style.animation             = 'none';
      }
    }

    wrapper.appendChild(textEl);
    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
  }


  // ── Ereignis-Handler ──────────────────────────────────────────

  // Tipp-Analyse auf das Eingabefeld
  eingabe.addEventListener('keydown', tippAnalysieren);

  // Enter → Nachricht senden
  eingabe.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    const text = eingabe.value.trim();
    if (!text) return;
    nachrichtHinzufuegen(text, true);
    eingabe.value = '';
    // IKI-Zustand nach dem Senden zurücksetzen
    letzter_ts = null;
    iki_puffer = [];
  });

  // Slider Intensität + Tonalität
  function sliderAktualisieren() {
    aktuelleRohwerte.intensitaet = Number(sliderIntensitaet.value);
    aktuelleRohwerte.tonalitaet  = Number(sliderTonalitaet.value);
    wertIntensitaet.textContent  = aktuelleRohwerte.intensitaet;
    wertTonalitaet.textContent   = aktuelleRohwerte.tonalitaet;
    aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);
    vorschauAktualisieren();
  }

  sliderIntensitaet.addEventListener('input', sliderAktualisieren);
  sliderTonalitaet.addEventListener('input',  sliderAktualisieren);

  // Antwort-Button
  antwortBtn.addEventListener('click', function () {
    if (naechsteAntwortIndex >= vorgegebeneNachrichten.length) return;
    nachrichtHinzufuegen(vorgegebeneNachrichten[naechsteAntwortIndex], false);
    naechsteAntwortIndex++;
    if (naechsteAntwortIndex >= vorgegebeneNachrichten.length) {
      antwortBtn.disabled    = true;
      antwortBtn.textContent = '–';
    }
  });

  // Emotion-Toggle
  emotionToggle.addEventListener('change', function () {
    emotionAktiv = this.checked;
    vorschauAktualisieren();
  });

</script>
</body>
</html>
