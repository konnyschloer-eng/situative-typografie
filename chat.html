<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat – Situative Typografie</title>

  <!-- Inter als variable Schrift laden (Gewichtsachse 100–900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e8e6e1;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── Phone-Frame ──────────────────────────────────── */
    .phone-frame {
      width: 390px;
      height: 844px;
      max-height: 100dvh;
      background: #f6f5f2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 440px) {
      body { background: #f6f5f2; }
      .phone-frame { width: 100%; height: 100dvh; box-shadow: none; }
    }

    /* ── Kopfzeile mit 4-Dimensionen-Grid ────────────── */
    .kopfzeile {
      flex-shrink: 0;
      background: #f6f5f2;
      border-bottom: 1px solid #e0ddd7;
      padding: 10px 16px 12px;
    }

    .kopfzeile-titelzeile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .kopfzeile-titel {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Platzhalter-Hinweis oben rechts */
    .sensor-hinweis {
      font-size: 10px;
      color: #ccc;
      letter-spacing: 0.04em;
      font-style: italic;
    }

    /* 2×2-Raster für die 4 Sensor-Platzhalter-Slider */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
    }

    .sensor-dimension {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dimension-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .dimension-label {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dimension-wert {
      font-size: 10px;
      color: #bbb;
      font-variant-numeric: tabular-nums;
    }

    .dimension-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: #ccc;
      border-radius: 1px;
      outline: none;
      cursor: pointer;
    }

    .dimension-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
    }

    .dimension-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #555;
      border: none;
      cursor: pointer;
    }

    /* ── Chat-Bereich ─────────────────────────────────── */
    .chat-bereich {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    .nachricht {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: einblenden 0.18s ease forwards;
    }

    .nachricht-andere {
      align-self: flex-start;
    }

    .nachricht-andere .text {
      color: #777;
      font-variation-settings: 'wght' 400;
    }

    .nachricht-ich {
      align-self: flex-end;
      text-align: right;
    }

    .nachricht-ich .text {
      color: #111;
      /* Startwert – wird beim Senden durch aktuelle Achsen ersetzt */
      font-variation-settings: 'wght' 400;
    }

    @keyframes einblenden {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Zittern-Animation (Stabilität) ──────────────────
       Verwendet CSS-Custom-Properties, die per JS gesetzt
       werden – so lassen sich Amplitude und Schrägstellung
       pro Nachricht individuell einfrieren.
       BEHELF – später durch echte Schrift-Achse ersetzen.  */
    @keyframes zittern {
      0%,  100% { transform: translateX(0)
                              skewX(var(--zt-skew, 0deg)); }
      20%       { transform: translateX(var(--zt-amplitude, 0px))
                              skewX(var(--zt-skew, 0deg)); }
      40%       { transform: translateX(calc(var(--zt-amplitude, 0px) * -0.7))
                              skewX(var(--zt-skew, 0deg)); }
      60%       { transform: translateX(calc(var(--zt-amplitude, 0px) * 0.4))
                              skewX(var(--zt-skew, 0deg)); }
      80%       { transform: translateX(calc(var(--zt-amplitude, 0px) * -0.2))
                              skewX(var(--zt-skew, 0deg)); }
    }

    /* ── Eingabebereich ───────────────────────────────── */
    .eingabe-bereich {
      flex-shrink: 0;
      background: #f6f5f2;
      border-top: 1px solid #e0ddd7;
      padding: 10px 14px;
    }

    .eingabe-innen {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #antwort-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid #d0cdc8;
      color: #999;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-variation-settings: 'wght' 400;
      padding: 7px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    #antwort-btn:hover:not(:disabled) { border-color: #aaa; color: #666; }
    #antwort-btn:disabled { opacity: 0.3; cursor: default; }

    /* Eingabefeld – Live-Vorschau der Schrift-Achsen */
    #eingabe {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      border-bottom: 1px solid #ccc;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #222;
      /* Startwert – wird per vorschauAktualisieren() überschrieben */
      font-variation-settings: 'wght' 400;
      padding: 5px 0;
      transition: border-color 0.15s;
      /* transform für Tonalitäts-Schrägstellung; kein Zittern (stört Tippen) */
    }

    #eingabe:focus { border-bottom-color: #888; }
    #eingabe::placeholder { color: #c0bdb8; }

    /* ── Emotion-Toggle ───────────────────────────────── */
    .emotion-schalter {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    .emotion-schalter input[type="checkbox"] { display: none; }

    .schalter-visuell {
      width: 34px;
      height: 19px;
      background: #ccc;
      border-radius: 10px;
      position: relative;
      transition: background 0.2s;
    }

    .schalter-visuell::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    #emotion-toggle:checked + .schalter-visuell { background: #444; }
    #emotion-toggle:checked + .schalter-visuell::after { transform: translateX(15px); }

    .schalter-label {
      font-size: 9px;
      color: #aaa;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="phone-frame">

    <!-- Kopfzeile: Titel + 4 Sensor-Platzhalter-Slider -->
    <header class="kopfzeile">
      <div class="kopfzeile-titelzeile">
        <span class="kopfzeile-titel">Chat</span>
        <span class="sensor-hinweis">Platzhalter · Sensordaten</span>
      </div>

      <!-- 4 Dimensionen als 2×2-Raster -->
      <div class="sensor-grid">

        <!-- Dimension 1: Intensität → font-weight -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Intensität</span>
            <span class="dimension-wert" id="wert-intensitaet">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-intensitaet" min="100" max="900" value="500" step="1">
        </div>

        <!-- Dimension 2: Tempo → letter-spacing + Animations-Geschwindigkeit -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Tempo</span>
            <span class="dimension-wert" id="wert-tempo">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-tempo" min="100" max="900" value="500" step="1">
        </div>

        <!-- Dimension 3: Stabilität → Zitter-Animation -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Stabilität</span>
            <span class="dimension-wert" id="wert-stabilitaet">900</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-stabilitaet" min="100" max="900" value="900" step="1">
        </div>

        <!-- Dimension 4: Tonalität → Schrägstellung (Platzhalter) -->
        <div class="sensor-dimension">
          <div class="dimension-header">
            <span class="dimension-label">Tonalität</span>
            <span class="dimension-wert" id="wert-tonalitaet">500</span>
          </div>
          <input class="dimension-slider" type="range"
            id="slider-tonalitaet" min="100" max="900" value="500" step="1">
        </div>

      </div>
    </header>

    <!-- Scrollbarer Chat-Verlauf -->
    <main class="chat-bereich" id="chat"></main>

    <!-- Eingabeleiste mit Emotion-Toggle -->
    <footer class="eingabe-bereich">
      <div class="eingabe-innen">
        <button id="antwort-btn">&#8592; Antwort</button>
        <input type="text" id="eingabe"
          placeholder="Nachricht schreiben …" autocomplete="off">
        <label class="emotion-schalter" title="Emotionale Typografie an/aus">
          <input type="checkbox" id="emotion-toggle" checked>
          <span class="schalter-visuell"></span>
          <span class="schalter-label">Emotion</span>
        </label>
      </div>
    </footer>

  </div><!-- /.phone-frame -->

  <script>

    // ═══════════════════════════════════════════════════════════════
    //  MAPPING-FUNKTION
    //  Wandelt 4 Rohwerte (Slider / Sensor, je 100–900) in
    //  typografische Parameter um.
    //
    //  HIER ANPASSEN, wenn echte Sensordaten kommen:
    //    • rohwerte.intensitaet / .tempo / .stabilitaet / .tonalitaet
    //      durch eigene Sensor-Kanäle ersetzen
    //    • Wertebereich ggf. umrechnen (z. B. BPM 50–180 → 100–900)
    //    • BEHELF-Stellen durch echte Achsen der eigenen Variable Font
    //      ersetzen (z. B. 'ZITR' statt CSS-Animation, 'TONA' statt skew)
    // ═══════════════════════════════════════════════════════════════
    function sensorZuSchriftAchse(rohwerte) {

      // ── Intensität → font-weight ──────────────────────────────
      // Echte Inter-Achse 'wght', kein Behelf nötig.
      const wght = Math.min(900, Math.max(100, Math.round(rohwerte.intensitaet)));

      // ── Tempo → letter-spacing (em) ──────────────────────────
      // BEHELF – später durch eigene Schrift-Achse ersetzen
      // 100 = eng (−0.04 em), 900 = weit (0.12 em)
      const spacing = umrechnen(rohwerte.tempo, 100, 900, -0.04, 0.12);

      // ── Tempo → Animations-Dauer (s) ─────────────────────────
      // Steuert die Geschwindigkeit der Zitter-Animation.
      // 100 = langsam (2 s/Zyklus), 900 = schnell (0.3 s/Zyklus)
      const animDuration = umrechnen(rohwerte.tempo, 100, 900, 2, 0.3);

      // ── Stabilität → Zitter-Amplitude (px) ───────────────────
      // BEHELF – später durch eigene Schrift-Achse ersetzen
      // 900 = stabil (0 px), 100 = unruhig (3 px)
      const wobbleRoh = umrechnen(rohwerte.stabilitaet, 100, 900, 3, 0);
      // Unterhalb von 0.2 px ist das Zittern nicht wahrnehmbar →
      // Animation ganz abschalten, um Rauschen zu vermeiden.
      const wobble = wobbleRoh < 0.2 ? 0 : wobbleRoh;

      // ── Tonalität → CSS-Schrägstellung (deg) ─────────────────
      // BEHELF – später durch eigene Schrift-Achse ersetzen
      // (Platzhalter für Achsen wie rund/spitz, warm/kalt o. Ä.)
      // 100 = neutral (0°), 900 = warm/geneigt (−5°, Richtung Italic)
      const skew = umrechnen(rohwerte.tonalitaet, 100, 900, 0, -5);

      return { wght, spacing, animDuration, wobble, skew };
    }

    // ─── Hilfsfunktion: lineares Umrechnen von Wertebereichen ─────
    // Beispiel: umrechnen(600, 100, 900, −0.04, 0.12) → 0.05
    function umrechnen(wert, vonMin, vonMax, zuMin, zuMax) {
      const t = (wert - vonMin) / (vonMax - vonMin);
      return zuMin + t * (zuMax - zuMin);
    }

    // ─── Alle typografischen Parameter auf ein Element anwenden ───
    // Wird beim Einfrieren (Senden) aufgerufen.
    // Gesendete Elemente werden danach NIE mehr aktualisiert.
    function stilAnwenden(element, achsen) {
      // Intensität → font-weight (echte Achse)
      element.style.fontVariationSettings = `'wght' ${achsen.wght}`;
      element.style.fontWeight = achsen.wght; // Fallback

      // BEHELF – Tempo → letter-spacing
      element.style.letterSpacing = `${achsen.spacing.toFixed(3)}em`;

      // BEHELF – Tonalität → CSS Custom Property für die Animation
      element.style.setProperty('--zt-skew', `${achsen.skew.toFixed(2)}deg`);

      if (achsen.wobble > 0) {
        // BEHELF – Stabilität → Zitter-Animation
        // Die Animation übernimmt auch die Schrägstellung (--zt-skew).
        element.style.setProperty('--zt-amplitude', `${achsen.wobble.toFixed(2)}px`);
        element.style.animation =
          `zittern ${achsen.animDuration.toFixed(2)}s ease-in-out infinite`;
        element.style.transform = ''; // Animation übernimmt den Transform
      } else {
        element.style.animation = 'none';
        // BEHELF – Tonalität → statische Schrägstellung (kein Zittern)
        element.style.transform = `skewX(${achsen.skew.toFixed(2)}deg)`;
      }
    }

    // ─── Vorschau im Eingabefeld aktualisieren ────────────────────
    // Gesendete Nachrichten werden NICHT berührt.
    // Kein Zittern im Eingabefeld (würde das Tippen stören).
    function vorschauAktualisieren() {
      if (emotionAktiv) {
        eingabe.style.fontVariationSettings = `'wght' ${aktuelleAchsen.wght}`;
        eingabe.style.fontWeight = aktuelleAchsen.wght;
        // BEHELF – Tempo → letter-spacing
        eingabe.style.letterSpacing = `${aktuelleAchsen.spacing.toFixed(3)}em`;
        // BEHELF – Tonalität → Schrägstellung
        eingabe.style.transform = `skewX(${aktuelleAchsen.skew.toFixed(2)}deg)`;
      } else {
        eingabe.style.fontVariationSettings = "'wght' 400";
        eingabe.style.fontWeight = 400;
        eingabe.style.letterSpacing = '0em';
        eingabe.style.transform = 'none';
      }
    }


    // ── Vordefinierte Nachrichten der anderen Person ──────────────
    const vorgegebeneNachrichten = [
      "Hey, was machst du gerade?",
      "Ah, klingt interessant – wie funktioniert das genau?",
      "Also die Schrift verändert sich je nach Kontext?",
      "Hast du schon was zum Zeigen?",
      "Schick mir mal einen Screenshot, wenn's fertig ist."
    ];
    let naechsteAntwortIndex = 0;


    // ── DOM-Referenzen ────────────────────────────────────────────
    const chat          = document.getElementById('chat');
    const eingabe       = document.getElementById('eingabe');
    const antwortBtn    = document.getElementById('antwort-btn');
    const emotionToggle = document.getElementById('emotion-toggle');

    // Slider
    const sliderIntensitaet = document.getElementById('slider-intensitaet');
    const sliderTempo       = document.getElementById('slider-tempo');
    const sliderStabilitaet = document.getElementById('slider-stabilitaet');
    const sliderTonalitaet  = document.getElementById('slider-tonalitaet');

    // Wertanzeigen
    const wertIntensitaet = document.getElementById('wert-intensitaet');
    const wertTempo       = document.getElementById('wert-tempo');
    const wertStabilitaet = document.getElementById('wert-stabilitaet');
    const wertTonalitaet  = document.getElementById('wert-tonalitaet');


    // ── Zustand ───────────────────────────────────────────────────

    // Aktuelle Rohwerte (werden später durch Sensordaten ersetzt)
    let aktuelleRohwerte = {
      intensitaet: Number(sliderIntensitaet.value),
      tempo:       Number(sliderTempo.value),
      stabilitaet: Number(sliderStabilitaet.value),
      tonalitaet:  Number(sliderTonalitaet.value)
    };

    // Berechnete Schrift-Parameter (Ausgabe der Mapping-Funktion)
    let aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);

    let emotionAktiv = emotionToggle.checked; // true = Emotion AN

    // Vorschau beim Laden sofort initialisieren
    vorschauAktualisieren();


    // ── Nachricht in den Chat einfügen ────────────────────────────
    function nachrichtHinzufuegen(text, vonMir) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('nachricht', vonMir ? 'nachricht-ich' : 'nachricht-andere');

      const textEl = document.createElement('p');
      textEl.classList.add('text');
      textEl.textContent = text;

      if (vonMir) {
        if (emotionAktiv) {
          // Achsen-Snapshot beim Absenden – wird NIE mehr geändert
          stilAnwenden(textEl, aktuelleAchsen);
        } else {
          // Emotion AUS: Standard-Schrift, keine Effekte
          textEl.style.fontVariationSettings = "'wght' 400";
          textEl.style.fontWeight = 400;
          textEl.style.letterSpacing = '0em';
          textEl.style.transform = 'none';
          textEl.style.animation = 'none';
        }
      }

      wrapper.appendChild(textEl);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
    }


    // ── Ereignis-Handler ──────────────────────────────────────────

    // Alle 4 Slider: Rohwerte lesen → Mapping → Vorschau
    // Gesendete Nachrichten bleiben eingefroren
    function rohwerteAktualisieren() {
      aktuelleRohwerte = {
        intensitaet: Number(sliderIntensitaet.value),
        tempo:       Number(sliderTempo.value),
        stabilitaet: Number(sliderStabilitaet.value),
        tonalitaet:  Number(sliderTonalitaet.value)
      };
      aktuelleAchsen = sensorZuSchriftAchse(aktuelleRohwerte);

      // Wertanzeigen aktualisieren
      wertIntensitaet.textContent = aktuelleRohwerte.intensitaet;
      wertTempo.textContent       = aktuelleRohwerte.tempo;
      wertStabilitaet.textContent = aktuelleRohwerte.stabilitaet;
      wertTonalitaet.textContent  = aktuelleRohwerte.tonalitaet;

      // Nur die Vorschau im Eingabefeld aktualisieren
      vorschauAktualisieren();
    }

    [sliderIntensitaet, sliderTempo, sliderStabilitaet, sliderTonalitaet]
      .forEach(s => s.addEventListener('input', rohwerteAktualisieren));

    // Enter → eigene Nachricht mit eingefrorenem Zustand senden
    eingabe.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      const text = eingabe.value.trim();
      if (!text) return;
      nachrichtHinzufuegen(text, true);
      eingabe.value = '';
    });

    // Button → nächste vordefinierte Antwort einblenden
    antwortBtn.addEventListener('click', function () {
      if (naechsteAntwortIndex >= vorgegebeneNachrichten.length) return;
      nachrichtHinzufuegen(vorgegebeneNachrichten[naechsteAntwortIndex], false);
      naechsteAntwortIndex++;
      if (naechsteAntwortIndex >= vorgegebeneNachrichten.length) {
        antwortBtn.disabled = true;
        antwortBtn.textContent = '–';
      }
    });

    // Emotion-Toggle → nur Vorschau umschalten;
    // gesendete Nachrichten bleiben unberührt (eingefroren)
    emotionToggle.addEventListener('change', function () {
      emotionAktiv = this.checked;
      vorschauAktualisieren();
    });

  </script>
</body>
</html>
